<title>Quad Tasks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Generated by 01_plan/tasks/build.py from tasks.md. Edit the template or the .md, never tasks.html. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column, a workshop job sheet. Sections fold; each row is one tap. */
:root {
  --bg: #eceeed; --paper: #fbfcfb; --ink: #151a1d; --muted: #5b656b; --line: #d3d9d7;
  --accent: #1f5fd6; --accent-soft: #e4ecfb;
  --ordered: #9a5b00; --ordered-soft: #fbf0dc;
  --done: #0f7a4a; --done-soft: #e1f3e9;
  --warn: #b3261e; --warn-soft: #fbe7e5;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1315; --paper: #171c1f; --ink: #e5e9eb; --muted: #97a2a8; --line: #2a3236;
  --accent: #7aa7ff; --accent-soft: #1a2436;
  --ordered: #f0b04a; --ordered-soft: #2b2112;
  --done: #4ade80; --done-soft: #12271b;
  --warn: #ff8a80; --warn-soft: #2e1715; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1315; --paper: #171c1f; --ink: #e5e9eb; --muted: #97a2a8; --line: #2a3236;
  --accent: #7aa7ff; --accent-soft: #1a2436;
  --ordered: #f0b04a; --ordered-soft: #2b2112;
  --done: #4ade80; --done-soft: #12271b;
  --warn: #ff8a80; --warn-soft: #2e1715; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 16px/1.45 var(--body); }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 20px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px; }
a { color: var(--accent); }
code { font: 500 .82em var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font: 800 clamp(30px, 8vw, 42px)/1 var(--display); font-stretch: 78%; letter-spacing: -.01em; text-wrap: balance; }
.meter { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
.meter i { display: block; height: 100%; }
.meter .d { background: var(--done); } .meter .o { background: var(--ordered); }
.counts { display: flex; flex-wrap: wrap; gap: 6px 16px; font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); font-weight: 500; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

.next { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; }
.next .eyebrow { color: var(--accent); }
.next p { margin: 4px 0 0; }

.status { font: 500 12px var(--mono); color: var(--muted); min-height: 1.4em; }
.status.bad { color: var(--warn); }

.filters { display: flex; gap: 6px; flex-wrap: wrap; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 8px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.chip { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

section.sec { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.sec-head { width: 100%; display: flex; align-items: baseline; gap: 10px; padding: 14px 14px 12px; background: none; border: 0; cursor: pointer; text-align: left; }
.sec-head h2 { margin: 0; flex: 1; min-width: 0; font: 750 19px/1.2 var(--display); font-stretch: 85%; text-wrap: balance; }
.sec-head .n { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sec-head .chev { width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg) translateY(-3px); transition: transform .15s; flex: none; }
.sec.closed .chev { transform: rotate(-45deg); }
.sec.closed .sec-body { display: none; }
.sec-note { margin: 0 14px 10px; color: var(--muted); font-size: 14px; }
.sec-bar { height: 3px; background: var(--line); margin: 0 14px 4px; border-radius: 2px; overflow: hidden; display: flex; }
.sec-bar i { display: block; height: 100%; }
.sec-bar .d { background: var(--done); } .sec-bar .o { background: var(--ordered); }
h3 { margin: 14px 14px 2px; font: 600 12px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.empty { margin: 4px 14px 14px; color: var(--muted); font-size: 14px; }
ol.rules { margin: 0 14px 14px; padding-left: 20px; display: grid; gap: 4px; }

ul.tasks { list-style: none; margin: 0; padding: 0 0 6px; }
li.task { display: grid; grid-template-columns: auto 1fr; gap: 0 12px; padding: 10px 14px; border-top: 1px solid var(--line); }
li.task:first-child { border-top: 0; }
.tick { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--muted); background: var(--paper); cursor: pointer; display: grid; place-items: center; margin-top: 1px; }
.tick svg { width: 16px; height: 16px; opacity: 0; }
.task.done .tick { background: var(--done); border-color: var(--done); }
.task.done .tick svg { opacity: 1; stroke: var(--paper); }
.pill { flex: none; align-self: start; min-width: 76px; border-radius: 999px; border: 1.5px solid var(--muted); background: var(--paper); padding: 4px 10px; font: 600 12px var(--mono); cursor: pointer; text-align: center; margin-top: 2px; }
.task.ordered .pill { border-color: var(--ordered); background: var(--ordered-soft); color: var(--ordered); }
.task.done .pill { border-color: var(--done); background: var(--done-soft); color: var(--done); }
.t-main { min-width: 0; }
.t-title { display: block; width: 100%; background: none; border: 0; padding: 4px 0; text-align: left; cursor: pointer; font-weight: 550; line-height: 1.35; }
.task.done .t-title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.t-title .more { color: var(--muted); font: 500 12px var(--mono); margin-left: 6px; white-space: nowrap; }
.t-detail { margin: 2px 0 4px; color: var(--muted); font-size: 14.5px; display: grid; gap: 4px; }
.t-detail p { margin: 0; }
.t-when { font: 500 11.5px var(--mono); color: var(--muted); }
button:disabled { cursor: not-allowed; opacity: .55; }

.inbox { background: var(--paper); border: 1px dashed var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.inbox label { font-weight: 650; }
.inbox .hint { margin: 0; color: var(--muted); font-size: 13.5px; }
.inbox-row { display: flex; gap: 8px; }
.inbox textarea { flex: 1; min-width: 0; min-height: 44px; resize: vertical; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.btn { border: 0; border-radius: 8px; background: var(--ink); color: var(--paper); font-weight: 650; padding: 0 16px; cursor: pointer; min-height: 44px; }
ul.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
ul.notes li { display: flex; gap: 8px; align-items: flex-start; background: var(--bg); border-radius: 8px; padding: 8px 10px; }
ul.notes li span { flex: 1; min-width: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
ul.notes li small { display: block; color: var(--muted); font: 500 11px var(--mono); }
.x { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1; padding: 0 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper);
  border-radius: 10px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; }
.toast button { background: none; border: 0; color: var(--paper); font-weight: 700; text-decoration: underline; cursor: pointer; }
footer { color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">ePWT · the quad</div>
    <h1>Quad Tasks</h1>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="counts" id="counts"></div>
  </header>
  <div class="next" id="next" hidden><div class="eyebrow">Next up</div><p id="next-text"></p></div>
  <div class="status" id="status" role="status">Loading your ticks…</div>
  <div class="filters" role="group" aria-label="Show">
    <button class="chip" id="f-open" data-f="open" aria-pressed="true">Open</button>
    <button class="chip" id="f-all" data-f="all" aria-pressed="false">All</button>
    <button class="chip" id="f-done" data-f="done" aria-pressed="false">Done</button>
  </div>
  <main id="list"></main>
  <div class="inbox">
    <label for="inbox-text">Add a task or a note</label>
    <p class="hint">"The ferrite arrived broken", "buy a second NTC". Claude moves it into the list on Sunday.</p>
    <div class="inbox-row">
      <textarea id="inbox-text" rows="1" placeholder="Type it here"></textarea>
      <button class="btn" id="inbox-add">Add</button>
    </div>
    <ul class="notes" id="notes"></ul>
  </div>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const DOC = /*__DATA__*/null;
const LABEL = { todo: "To buy", ordered: "Ordered", done: "Arrived" };
const NEXT_BUY = { todo: "ordered", ordered: "done", done: "todo" };
const remote = {};          // task id -> {s, at} from the database
let notes = [];             // inbox entries
let db = null, dbState = "loading", filter = "open";
const pending = {};         // task id -> promise chain, one write at a time per document
const ALL = [];
DOC.sections.forEach(s => s.groups.forEach(g => g.tasks.forEach(t => ALL.push(t))));
const BY_ID = Object.fromEntries(ALL.map(t => [t.id, t]));

const store = {
  get(k, d) { try { const v = localStorage.getItem("qt:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("qt:" + k, JSON.stringify(v)); } catch {} }
};
const closed = new Set(store.get("closed", ["later"]));
const opened = new Set();
filter = store.get("filter", "open");

const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const plain = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; };
const eff = t => (remote[t.id] && remote[t.id].s) || t.state;
const when = iso => { try { return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" }); } catch { return ""; } };
const canWrite = () => dbState === "ready";

function counts(list) {
  const c = { done: 0, ordered: 0, todo: 0, n: list.length };
  list.forEach(t => c[eff(t)]++);
  return c;
}
function bar(c, cls) {
  const w = x => (100 * x / Math.max(c.n, 1)).toFixed(2) + "%";
  return `<i class="d" style="width:${w(c.done)}"></i><i class="o" style="width:${w(c.ordered)}"></i>`;
}

function render() {
  const c = counts(ALL.filter(t => !t.id.startsWith("later-")));
  $("meter").innerHTML = bar(c);
  $("counts").innerHTML =
    `<span><span class="dot" style="background:var(--done)"></span><b>${c.done}</b> done</span>` +
    `<span><span class="dot" style="background:var(--ordered)"></span><b>${c.ordered}</b> on the way</span>` +
    `<span><span class="dot" style="background:var(--muted)"></span><b>${c.todo}</b> open</span>`;
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));

  const list = $("list"); list.textContent = "";
  DOC.sections.forEach(s => {
    const tasks = s.groups.flatMap(g => g.tasks);
    const sec = el("section", "sec" + (closed.has(s.id) ? " closed" : "")); sec.id = "s-" + s.id;
    const sc = counts(tasks);
    const head = el("button", "sec-head");
    head.setAttribute("aria-expanded", String(!closed.has(s.id)));
    head.innerHTML = `<h2>${s.title}</h2>` + (tasks.length ? `<span class="n">${sc.done}/${sc.n}</span>` : "") + `<span class="chev"></span>`;
    head.onclick = () => { closed.has(s.id) ? closed.delete(s.id) : closed.add(s.id); store.set("closed", [...closed]); render(); };
    sec.append(head);
    const body = el("div", "sec-body");
    if (tasks.length) { const b = el("div", "sec-bar", bar(sc)); body.append(b); }
    if (s.note) body.append(el("p", "sec-note", s.note));
    if (s.list && s.list.length) { const ol = el("ol", "rules"); s.list.forEach(x => ol.append(el("li", null, x))); body.append(ol); }
    let shown = 0;
    s.groups.forEach(g => {
      const vis = g.tasks.filter(t => filter === "all" || (filter === "done" ? eff(t) === "done" : eff(t) !== "done"));
      if (!vis.length) return;
      if (g.title) body.append(el("h3", null, g.title));
      const ul = el("ul", "tasks");
      vis.forEach(t => { ul.append(row(t)); shown++; });
      body.append(ul);
    });
    if (tasks.length && !shown) body.append(el("p", "empty", filter === "done" ? "Nothing ticked here yet." : "All done here."));
    sec.append(body);
    list.append(sec);
  });
  renderNotes();
}

function row(t) {
  const s = eff(t);
  const li = el("li", "task " + s); li.id = "t-" + t.id;
  let ctl;
  if (t.buy) {
    ctl = el("button", "pill", LABEL[s]);
    ctl.setAttribute("aria-label", `${plain(t.title)}: ${LABEL[s]}. Tap for ${LABEL[NEXT_BUY[s]]}`);
    ctl.onclick = () => change(t, NEXT_BUY[s]);
  } else {
    ctl = el("button", "tick", '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>');
    ctl.setAttribute("aria-label", (s === "done" ? "Mark not done: " : "Mark done: ") + plain(t.title));
    ctl.setAttribute("aria-pressed", String(s === "done"));
    ctl.onclick = () => change(t, s === "done" ? "todo" : "done");
  }
  ctl.disabled = !canWrite();
  const main = el("div", "t-main");
  const hasMore = t.detail.length > 0;
  const isOpen = opened.has(t.id);
  const title = el(hasMore ? "button" : "div", "t-title", t.title + (hasMore && !isOpen ? '<span class="more">more</span>' : ""));
  if (hasMore) { title.setAttribute("aria-expanded", String(isOpen)); title.onclick = () => { isOpen ? opened.delete(t.id) : opened.add(t.id); render(); }; }
  main.append(title);
  if (hasMore && isOpen) {
    const d = el("div", "t-detail"); t.detail.forEach(x => d.append(el("p", null, x))); main.append(d);
  }
  const r = remote[t.id];
  if (r && r.at && s !== "todo") main.append(el("div", "t-when", (s === "ordered" ? "Ordered " : t.buy ? "Arrived " : "Done ") + when(r.at)));
  li.append(ctl, main);
  return li;
}

let undoFn = null, toastTimer = 0;
function toast(msg, undo) {
  const t = $("toast"); t.textContent = ""; t.append(el("span", null, msg));
  undoFn = undo || null;
  if (undo) { const b = el("button", null, "Undo"); b.onclick = () => { const f = undoFn; hideToast(); f && f(); }; t.append(b); }
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() { $("toast").hidden = true; undoFn = null; }

function change(t, s, silent) {
  if (!canWrite()) return;
  const before = remote[t.id] ? { ...remote[t.id] } : null;
  const at = new Date().toISOString();
  remote[t.id] = { s, at };
  render();
  const write = () => db.collection("status").doc(t.id).set({ s, at, title: plain(t.title) });
  pending[t.id] = (pending[t.id] || Promise.resolve()).then(write).then(
    () => { if (!silent) toast(`${plain(t.title).slice(0, 40)} → ${t.buy ? LABEL[s] : s === "done" ? "done" : "not done"}`, () => change(t, before ? before.s : t.state, true)); },
    e => { if (before) remote[t.id] = before; else delete remote[t.id]; render(); setStatus("Not saved: " + (e && e.message || "try again"), true); });
}

function renderNotes() {
  const ul = $("notes"); ul.textContent = "";
  notes.forEach(n => {
    const li = el("li"); const sp = el("span"); sp.textContent = n.text;
    const sm = el("small", null, ""); sm.textContent = "Added " + when(n.at); sp.append(sm);
    const x = el("button", "x", "×"); x.setAttribute("aria-label", "Remove: " + n.text); x.disabled = !canWrite();
    x.onclick = async () => {
      try { await db.collection("inbox").doc(n.id).delete();
        toast("Note removed", () => db.collection("inbox").doc(n.id).set({ text: n.text, at: n.at }).catch(() => {})); }
      catch (e) { setStatus("Not removed: " + (e && e.message || "try again"), true); }
    };
    li.append(sp, x); ul.append(li);
  });
  $("inbox-add").disabled = !canWrite(); $("inbox-text").disabled = !canWrite();
}

async function addNote() {
  const ta = $("inbox-text"); const text = ta.value.trim();
  if (!text || !canWrite()) return;
  $("inbox-add").disabled = true;
  try { await db.collection("inbox").add({ text, at: new Date().toISOString() }); ta.value = ""; toast("Added. Claude files it on Sunday."); }
  catch (e) { setStatus("Not added: " + (e && e.message || "try again"), true); }
  $("inbox-add").disabled = false;
}

function setStatus(msg, bad) { const s = $("status"); s.textContent = msg; s.classList.toggle("bad", !!bad); }

document.querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; store.set("filter", filter); render(); });
$("inbox-add").onclick = addNote;
$("inbox-text").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) addNote(); });
if (DOC.next) { $("next").hidden = false; $("next-text").innerHTML = DOC.next; }
$("foot").textContent = "List from tasks.md, " + (DOC.updated || "") + ". Your ticks are saved here and copied into the repo every Sunday.";
render();

(async () => {
  db = window.claude && window.claude.use ? await window.claude.use("db").catch(() => null) : null;
  if (!db) { dbState = "off"; setStatus("Ticks can't be saved in this view. Open the page signed in to claude.ai.", true); render(); return; }
  const timer = setTimeout(() => { if (dbState === "loading") setStatus("Can't reach your saved ticks yet. Showing the list as of " + (DOC.updated || "the last sync") + ".", true); }, 10000);
  db.collection("status").onSnapshot(snap => {
    for (const k of Object.keys(remote)) delete remote[k];
    snap.docs.forEach(d => { const v = d.data(); if (v && BY_ID[d.id]) remote[d.id] = { s: v.s, at: v.at }; });
    if (!snap.metadata.fromCache) { clearTimeout(timer); }
    if (dbState !== "ready") { dbState = "ready"; setStatus(""); }
    render();
  }, e => { clearTimeout(timer); dbState = "off"; setStatus("Ticks can't be saved right now (" + e.code + "). Reload later.", true); render(); });
  db.collection("inbox").orderBy("at").onSnapshot(snap => {
    notes = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderNotes();
  }, () => {});
})();
</script>
