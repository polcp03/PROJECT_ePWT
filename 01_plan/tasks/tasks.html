Normally open: continuity only when braking. Only the front switch is wired (GPIO 32); the", "rear one fails, GPIO 33 stays reserved."]}, {"id": "rollout", "title": "Roll-out over 10 m → real rolling radius", "state": "todo", "buy": false, "detail": ["With you on it, count magnets (or turns) over 10 measured metres. Replaces the assumed", "<code>r_roll<\/code> and decides whether the VESC's wheel diameter is 0.30 or 0.31 m. Every speed channel", "depends on this number."]}, {"id": "cg", "title": "Load per axle and centre-of-gravity height", "state": "todo", "buy": false, "detail": ["Scale under each axle on level ground, with and without you. For the height, lift one axle a", "known amount and see how much weight moves to the other. **Derive the formula yourself before", "measuring**: it is a moment balance."]}]}], "list": []}, {"id": "emc", "title": "5 · Wiring against noise (EMC)", "note": "Why and the numbers: <code>03_hardware/emc-study.md<\/code>. Plan approved 6 Nov: DEC-008.", "groups": [{"title": "Free: do it while wiring", "tasks": [{"id": "emc-dc-pair", "title": "Battery + and − together along the whole 40 cm run", "state": "todo", "buy": false, "detail": ["Zip-tied every 5 cm, or twisted."]}, {"id": "emc-phases", "title": "The three phases in one tight bundle, as short as the layout allows", "state": "todo", "buy": false, "detail": []}, {"id": "emc-twist", "title": "Every low-voltage signal twisted with its own return", "state": "todo", "buy": false, "detail": ["Throttle, brake, wheel Hall, 12 V supply. They cross power cables at 90°, never alongside."]}, {"id": "emc-lv-box", "title": "Low-voltage box under the chassis plate", "state": "todo", "buy": false, "detail": ["Its cables leave on the side away from the VESC's."]}]}, {"title": "Build", "tasks": [{"id": "emc-hall-caps", "title": "Rotor Halls: three 10 nF to Hall GND, at the VESC's Hall plug", "state": "todo", "buy": false, "detail": []}, {"id": "emc-vesc-box", "title": "Aluminium box for the VESC (you make it)", "state": "todo", "buy": false, "detail": ["1.5–2 mm, bolted to the chassis plate on <strong>bare<\/strong> steel (scrape the paint, toothed washer,", "protect the joint afterwards). Power cables out one side, CAN and Halls out the far side."]}, {"id": "emc-wheel-hall", "title": "Wheel Hall on the shielded cable", "state": "todo", "buy": false, "detail": ["Shield to VCU ground at the VCU end only. Filter 10 kΩ + <strong>1 nF<\/strong> (C9), not 100 nF."]}, {"id": "emc-vcu-inputs", "title": "VCU input filters and TVS", "state": "todo", "buy": false, "detail": ["Throttle RC 1 kΩ + 100 nF, brakes 10 kΩ + 100 nF, 100 nF at every module, SMBJ16A on the 12 V input."]}, {"id": "emc-can", "title": "CAN: twisted pair plus a GND wire, then measure 60 Ω", "state": "todo", "buy": false, "detail": ["Measure CAN-H to CAN-L with everything off. The 88 Ω reading is still unexplained."]}, {"id": "emc-bond", "title": "High-frequency bond: 2 × 10 nF + 1 MΩ, VESC power ground → chassis", "state": "todo", "buy": false, "detail": ["Leads under 2 cm. <strong>Never a wire<\/strong>: a wire turns a chafed positive cable into a pack short."]}]}, {"title": "Test", "tasks": [{"id": "req-vcu-02", "title": "Write the number in REQ-VCU-02", "state": "todo", "buy": false, "detail": ["How many mV of throttle noise you accept at 40 A, and why. Before EXP-004."]}, {"id": "exp-004", "title": "EXP-004: one change at a time, at 5, 20 and 40 A, wheels in the air", "state": "todo", "buy": false, "detail": ["Baseline → throttle RC → Hall capacitors → bond → ferrite. Record throttle ADC peak-to-peak,", "CAN errors, Hall errors in VESC Tool and resets."]}]}], "list": []}, {"id": "tests", "title": "6 · Tests that give information", "note": "Each test answers a question of the model. VESC signals over CAN: motor and battery current, erpm, duty, voltage. Plus wheel, IMU and NTC once fitted.", "groups": [{"title": "", "tasks": [{"id": "test-a", "title": "A · Motor constant, wheel in the air (C04)", "state": "todo", "buy": false, "detail": ["Throttle in held steps. If the model is right, duty × voltage against electrical speed is a", "straight line whose slope is λm. Compare with the C00 back-EMF. <strong>Predict first<\/strong> whether the", "line goes through zero, and why not quite."]}, {"id": "test-b", "title": "B · Resistance against temperature (C04, needs the NTC)", "state": "todo", "buy": false, "detail": ["Short loaded runs, writing down motor temperature. Copper resistance rises ~0.4 % per degree."]}, {"id": "test-c", "title": "C · Coast-down: rolling and air drag (C05)", "state": "todo", "buy": false, "detail": ["From top safe speed, release the throttle and let it roll to a stop. Fit <code>a + b·v + c·v²<\/code>", "(SAE J2263). Level ground, no wind, <strong>both directions<\/strong>, three runs each, same tyre pressure."]}, {"id": "test-d", "title": "D · Full-throttle acceleration (C05)", "state": "todo", "buy": false, "detail": ["From standstill. Current and speed give wheel force; the IMU gives acceleration. The C01 model", "must predict the curve. Above 9 km/h it sits at 40 A of battery: the BMS limit."]}, {"id": "test-e", "title": "E · Slip", "state": "todo", "buy": false, "detail": ["Rear wheel (erpm ÷ 3 ÷ 8.364) against the front (Hall). Straight, no wheelspin: the", "difference is the radius error. The base of traction control."]}, {"id": "test-f", "title": "F · Halls against the observer, under load", "state": "todo", "buy": false, "detail": ["With you on it, gentle and full starts, logging id, iq, erpm and duty. Pass: id ripple", "&lt; 0.5 A above 2000 erpm and no jerk through 1000–2000. If it fails, raise the handover 500 erpm", "at a time, one change at a time."]}, {"id": "test-g", "title": "G · Throttle noise under load (REQ-VCU-02)", "state": "todo", "buy": false, "detail": ["On the bench at 5 A with no filter the throttle jumped up to +80 mV. Repeat under load with the", "RC filter fitted, logging the raw ADC."]}]}], "list": []}, {"id": "vcu", "title": "7 · Vehicle control unit v0 (Dec–Jan)", "note": "The ESP32 reads the throttle and sends the current command to the VESC over CAN. No control yet: only pass the command on, with protections.", "groups": [{"title": "", "tasks": [{"id": "vcu-can-timeout", "title": "CAN timeout in the VESC", "state": "done", "buy": false, "detail": ["5 Nov: 100 ms, measured 105–121 ms with the wheel in the air (REQ-VCU-03 verified). Never disabled."]}, {"id": "vcu-throttle-bench", "title": "Throttle on the ESP32, on the bench", "state": "done", "buy": false, "detail": ["5 Nov: powered from 3.3 V, no divider, GPIO 35. Outside 600–2800 mV → zero torque."]}, {"id": "vcu-throttle-board", "title": "Throttle on the board, with the RC filter and the 100 kΩ", "state": "todo", "buy": false, "detail": []}, {"id": "vcu-brake", "title": "Brake input: front brake on GPIO 32; brake + throttle → zero torque", "state": "todo", "buy": false, "detail": ["From v0. It is normally open, so a cut wire reads as \"not braking\": think about what that means."]}, {"id": "vcu-ground-loop", "title": "Ground loop check with the ESP32 commanding torque", "state": "todo", "buy": false, "detail": ["EXP-001 matters again."]}]}], "list": []}, {"id": "decide", "title": "8 · Decisions that are yours", "note": "", "groups": [{"title": "", "tasks": [{"id": "dec-estop", "title": "The VCU's emergency stop: what it is and where it goes", "state": "todo", "buy": false, "detail": []}, {"id": "dec-wheel-lock", "title": "Front wheel locks under hard braking: what happens to the speed reference?", "state": "todo", "buy": false, "detail": ["Half answered on 1 Nov: mistake #11, asked again on Saturday 7 Nov."]}, {"id": "dec-battery-limit", "title": "<code>l_in_current_max<\/code>: stay at 40 A (the BMS limit) or go lower", "state": "todo", "buy": false, "detail": []}, {"id": "dec-grounding", "title": "Grounding plan", "state": "done", "buy": false, "detail": ["Decided 6 Nov: DEC-008 (floating at DC, 20 nF bond at the inverter, IMU on the VCU board)."]}]}], "list": []}, {"id": "later", "title": "Later", "note": "Not now. Listed so they are not in your head.", "groups": [{"title": "", "tasks": [{"id": "later-imu-wheel", "title": "IMU and wheel on the card, filter chosen on the PC from real data", "state": "todo", "buy": false, "detail": []}, {"id": "later-traction", "title": "Traction control: first in Simulink, then on the ESP32", "state": "todo", "buy": false, "detail": []}, {"id": "later-validated", "title": "End of 2026: model validated against the vehicle", "state": "todo", "buy": false, "detail": []}]}], "list": []}, {"id": "safety", "title": "Safety, every test with current", "note": "Not tasks: rules. 13S5P Li-ion pack, BMS cuts at 40 A continuous.", "groups": [], "list": ["Current limit set in the VESC before starting.", "Pack temperature by hand when you finish.", "Never charge unattended.", "Wheels in the air first; on the ground only once that works."]}], "next": "wait for the parts, then get the logger recording on the quad again (section 3).", "updated": "6 Nov 2026"};
const LABEL = { todo: "To buy", ordered: "Ordered", done: "Arrived" };
const NEXT_BUY = { todo: "ordered", ordered: "done", done: "todo" };
const remote = {};          // task id -> {s, at} from the database
let notes = [];             // inbox entries
let db = null, dbState = "loading", filter = "open";
const pending = {};         // task id -> promise chain, one write at a time per document
const ALL = [];
DOC.sections.forEach(s => s.groups.forEach(g => g.tasks.forEach(t => ALL.push(t))));
const BY_ID = Object.fromEntries(ALL.map(t => [t.id, t]));

const store = {
  get(k, d) { try { const v = localStorage.getItem("qt:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("qt:" + k, JSON.stringify(v)); } catch {} }
};
const closed = new Set(store.get("closed", ["later"]));
const opened = new Set();
filter = store.get("filter", "open");

const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const plain = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; };
const eff = t => (remote[t.id] && remote[t.id].s) || t.state;
const when = iso => { try { return new Date(iso).toLocaleDateString(undefined, { day: "numeric", month: "short" }); } catch { return ""; } };
const canWrite = () => dbState === "ready";

function counts(list) {
  const c = { done: 0, ordered: 0, todo: 0, n: list.length };
  list.forEach(t => c[eff(t)]++);
  return c;
}
function bar(c, cls) {
  const w = x => (100 * x / Math.max(c.n, 1)).toFixed(2) + "%";
  return `<i class="d" style="width:${w(c.done)}"></i><i class="o" style="width:${w(c.ordered)}"></i>`;
}

function render() {
  const c = counts(ALL.filter(t => !t.id.startsWith("later-")));
  $("meter").innerHTML = bar(c);
  $("counts").innerHTML =
    `<span><span class="dot" style="background:var(--done)"></span><b>${c.done}</b> done</span>` +
    `<span><span class="dot" style="background:var(--ordered)"></span><b>${c.ordered}</b> on the way</span>` +
    `<span><span class="dot" style="background:var(--muted)"></span><b>${c.todo}</b> open</span>`;
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));

  const list = $("list"); list.textContent = "";
  DOC.sections.forEach(s => {
    const tasks = s.groups.flatMap(g => g.tasks);
    const sec = el("section", "sec" + (closed.has(s.id) ? " closed" : "")); sec.id = "s-" + s.id;
    const sc = counts(tasks);
    const head = el("button", "sec-head");
    head.setAttribute("aria-expanded", String(!closed.has(s.id)));
    head.innerHTML = `<h2>${s.title}</h2>` + (tasks.length ? `<span class="n">${sc.done}/${sc.n}</span>` : "") + `<span class="chev"></span>`;
    head.onclick = () => { closed.has(s.id) ? closed.delete(s.id) : closed.add(s.id); store.set("closed", [...closed]); render(); };
    sec.append(head);
    const body = el("div", "sec-body");
    if (tasks.length) { const b = el("div", "sec-bar", bar(sc)); body.append(b); }
    if (s.note) body.append(el("p", "sec-note", s.note));
    if (s.list && s.list.length) { const ol = el("ol", "rules"); s.list.forEach(x => ol.append(el("li", null, x))); body.append(ol); }
    let shown = 0;
    s.groups.forEach(g => {
      const vis = g.tasks.filter(t => filter === "all" || (filter === "done" ? eff(t) === "done" : eff(t) !== "done"));
      if (!vis.length) return;
      if (g.title) body.append(el("h3", null, g.title));
      const ul = el("ul", "tasks");
      vis.forEach(t => { ul.append(row(t)); shown++; });
      body.append(ul);
    });
    if (tasks.length && !shown) body.append(el("p", "empty", filter === "done" ? "Nothing ticked here yet." : "All done here."));
    sec.append(body);
    list.append(sec);
  });
  renderNotes();
}

function row(t) {
  const s = eff(t);
  const li = el("li", "task " + s); li.id = "t-" + t.id;
  let ctl;
  if (t.buy) {
    ctl = el("button", "pill", LABEL[s]);
    ctl.setAttribute("aria-label", `${plain(t.title)}: ${LABEL[s]}. Tap for ${LABEL[NEXT_BUY[s]]}`);
    ctl.onclick = () => change(t, NEXT_BUY[s]);
  } else {
    ctl = el("button", "tick", '<svg viewBox="0 0 16 16" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>');
    ctl.setAttribute("aria-label", (s === "done" ? "Mark not done: " : "Mark done: ") + plain(t.title));
    ctl.setAttribute("aria-pressed", String(s === "done"));
    ctl.onclick = () => change(t, s === "done" ? "todo" : "done");
  }
  ctl.disabled = !canWrite();
  const main = el("div", "t-main");
  const hasMore = t.detail.length > 0;
  const isOpen = opened.has(t.id);
  const title = el(hasMore ? "button" : "div", "t-title", t.title + (hasMore && !isOpen ? '<span class="more">more</span>' : ""));
  if (hasMore) { title.setAttribute("aria-expanded", String(isOpen)); title.onclick = () => { isOpen ? opened.delete(t.id) : opened.add(t.id); render(); }; }
  main.append(title);
  if (hasMore && isOpen) {
    const d = el("div", "t-detail"); t.detail.forEach(x => d.append(el("p", null, x))); main.append(d);
  }
  const r = remote[t.id];
  if (r && r.at && s !== "todo") main.append(el("div", "t-when", (s === "ordered" ? "Ordered " : t.buy ? "Arrived " : "Done ") + when(r.at)));
  li.append(ctl, main);
  return li;
}

let undoFn = null, toastTimer = 0;
function toast(msg, undo) {
  const t = $("toast"); t.textContent = ""; t.append(el("span", null, msg));
  undoFn = undo || null;
  if (undo) { const b = el("button", null, "Undo"); b.onclick = () => { const f = undoFn; hideToast(); f && f(); }; t.append(b); }
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 5000);
}
function hideToast() { $("toast").hidden = true; undoFn = null; }

function change(t, s, silent) {
  if (!canWrite()) return;
  const before = remote[t.id] ? { ...remote[t.id] } : null;
  const at = new Date().toISOString();
  remote[t.id] = { s, at };
  render();
  const write = () => db.collection("status").doc(t.id).set({ s, at, title: plain(t.title) });
  pending[t.id] = (pending[t.id] || Promise.resolve()).then(write).then(
    () => { if (!silent) toast(`${plain(t.title).slice(0, 40)} → ${t.buy ? LABEL[s] : s === "done" ? "done" : "not done"}`, () => change(t, before ? before.s : t.state, true)); },
    e => { if (before) remote[t.id] = before; else delete remote[t.id]; render(); setStatus("Not saved: " + (e && e.message || "try again"), true); });
}

function renderNotes() {
  const ul = $("notes"); ul.textContent = "";
  notes.forEach(n => {
    const li = el("li"); const sp = el("span"); sp.textContent = n.text;
    const sm = el("small", null, ""); sm.textContent = "Added " + when(n.at); sp.append(sm);
    const x = el("button", "x", "×"); x.setAttribute("aria-label", "Remove: " + n.text); x.disabled = !canWrite();
    x.onclick = async () => {
      try { await db.collection("inbox").doc(n.id).delete();
        toast("Note removed", () => db.collection("inbox").doc(n.id).set({ text: n.text, at: n.at }).catch(() => {})); }
      catch (e) { setStatus("Not removed: " + (e && e.message || "try again"), true); }
    };
    li.append(sp, x); ul.append(li);
  });
  $("inbox-add").disabled = !canWrite(); $("inbox-text").disabled = !canWrite();
}

async function addNote() {
  const ta = $("inbox-text"); const text = ta.value.trim();
  if (!text || !canWrite()) return;
  $("inbox-add").disabled = true;
  try { await db.collection("inbox").add({ text, at: new Date().toISOString() }); ta.value = ""; toast("Added. Claude files it on Sunday."); }
  catch (e) { setStatus("Not added: " + (e && e.message || "try again"), true); }
  $("inbox-add").disabled = false;
}

function setStatus(msg, bad) { const s = $("status"); s.textContent = msg; s.classList.toggle("bad", !!bad); }

document.querySelectorAll(".chip").forEach(b => b.onclick = () => { filter = b.dataset.f; store.set("filter", filter); render(); });
$("inbox-add").onclick = addNote;
$("inbox-text").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) addNote(); });
if (DOC.next) { $("next").hidden = false; $("next-text").innerHTML = DOC.next; }
$("foot").textContent = "List from tasks.md, " + (DOC.updated || "") + ". Your ticks are saved here and copied into the repo every Sunday.";
render();

(async () => {
  db = window.claude && window.claude.use ? await window.claude.use("db").catch(() => null) : null;
  if (!db) { dbState = "off"; setStatus("Ticks can't be saved in this view. Open the page signed in to claude.ai.", true); render(); return; }
  const timer = setTimeout(() => { if (dbState === "loading") setStatus("Can't reach your saved ticks yet. Showing the list as of " + (DOC.updated || "the last sync") + ".", true); }, 10000);
  db.collection("status").onSnapshot(snap => {
    for (const k of Object.keys(remote)) delete remote[k];
    snap.docs.forEach(d => { const v = d.data(); if (v && BY_ID[d.id]) remote[d.id] = { s: v.s, at: v.at }; });
    if (!snap.metadata.fromCache) { clearTimeout(timer); }
    if (dbState !== "ready") { dbState = "ready"; setStatus(""); }
    render();
  }, e => { clearTimeout(timer); dbState = "off"; setStatus("Ticks can't be saved right now (" + e.code + "). Reload later.", true); render(); });
  db.collection("inbox").orderBy("at").onSnapshot(snap => {
    notes = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderNotes();
  }, () => {});
})();
</script>
