e = λm, intercept = voltage offset), a plot of λm against erpm saved to 04_model/results/", "failure: fewer than ~20 samples → says so and gives no number, instead of a number from three points"], "traps": ["\"it reads the log and gives λm\" (no filter, no number, no failure case)", "keeping coast samples with I_motor = 0.0 (see Check k2)", "using Vbus/2 or line-to-line scaling"], "solution": "<p>Example: \"lambda_from_can.py &lt;log.csv&gt;. Reads erpm, I_motor, duty, V_in with can_log_decode.load(). Keeps samples with I_motor &gt; 0.5 A, erpm &gt; 2000 and |d erpm/dt| &lt; 3000 erpm/s. For each: |v| = duty·V_in/√3, vq = √(|v|² − (ωe·Lq·I)²), λm = (vq − Rs·I)/ωe. Prints n, median and p10–p90 of λm in mWb and a fit of vq vs ωe with its intercept; saves λm vs erpm as a PNG in 04_model/results/. Under 20 samples it prints 'not enough steady data' and no λm.\"<\/p>", "prompt_text": "Paste your five-line contract here before you send it to the AI."}, "b2": {"kind": "check", "prompt": "<p>What is your acceptance criterion, with its number? Why that number?<\/p>", "key": ["on synthetic data with known λm = 16.855 mWb, the script returns it within a stated tolerance, e.g. ±0.5 % (tighter than the effect being measured)", "and it rejects the I = 0 coast samples and the transients (the test includes them on purpose)", "the tolerance is set by the quantisation in the frames: duty in steps of 0.001 and V_in in steps of 0.1 V (0.2 %) at full speed", "a test that only checks \"it runs\" or \"the number is plausible\" is not a test (his mistake #12)"], "traps": ["testing only on log_017 itself: then the script and the expected value come from the same place"], "solution": "<p>For example: \"On a synthetic log generated with λm = 16.855 mWb, 0.001 duty steps and 0.1 V steps, the script returns 16.855 ± 0.08 mWb (±0.5 %) and keeps none of the I = 0 or accelerating samples.\" The number comes from the frame resolution, not from hope.<\/p>", "prompt_text": "What is your acceptance criterion, with its number? Why that number?"}, "k1": {"kind": "check", "prompt": "<p>What did the script give on log_017: samples kept, median λm, 10–90 % spread, the fit's slope and intercept, the speed range? How far is it from 16.855 mWb?<\/p>", "key": ["about 50–100 samples kept, depending on the steadiness threshold (≈ 100 at 3000 erpm/s, ≈ 50 at 1500, ≈ 30 at 800)", "median λm ≈ 16.9–17.0 mWb, 10–90 % spread ≈ 16.3–17.8 mWb", "fit of vq vs ωe: slope ≈ 17.1–17.4 mWb, intercept ≈ 0 V (−0.2 to 0 V)", "2000–14 800 erpm, i.e. about 670–4930 rpm mechanical", "median within about +0.3 to +1 % of 16.855 mWb (fit +1.6 to +3 %); spread about ±5 %, far wider than the 0.17 % of the scope captures"], "traps": ["reporting one sample or a mean dominated by transients as \"the\" λm", "claiming agreement to 0.1 % from a spread of ±5 %"], "solution": "<p>Expected (computed on this file with I &gt; 0.5 A, erpm &gt; 2000, |d erpm/dt| &lt; 3000 erpm/s): 102 samples, median 17.0 mWb, p10–p90 16.3–17.8 mWb, fit slope 17.1 mWb with ~0 V intercept, over 670–4930 rpm mechanical. The median is about 1 % above the scope's 16.855 mWb. It agrees, but at the ±5 % level of this recording, not at the 0.2 % level of the scope.<\/p>", "prompt_text": "What did the script give on log_017: samples kept, median λm, 10–90 % spread, the fit's slope and intercept, the speed range? How far is it from 16.855 mWb?"}, "k2": {"kind": "check", "prompt": "<p>Run it once keeping the samples with I_motor exactly 0.0 (coasting after a blip). What λm do they give, and why do you throw them out?<\/p>", "key": ["they read low, about 13 mWb at 2000–4000 erpm rising to about 16 mWb at 14 000 erpm (6–20 % low), not flat with speed", "exactly 0.0 A is the sign that the VESC has released the motor: no current control, no commanded voltage", "then duty is not the command the formula assumes; it is most likely built from the measured phase voltages, through filters (an inference, not checked in the firmware)", "the filter must keep only current-controlled samples"], "traps": ["\"zero current is the cleanest case, R·i = 0\": true only if the controller is still driving at 0 A"], "solution": "<p>They give about 13 mWb at low speed, rising to about 16 mWb, 6–20 % low, and the error changes with speed. A current of exactly 0.0 A in hundreds of samples means the motor is released, so duty no longer is the voltage the controller commanded. Out. What duty means then is an open question for the firmware, not something to assume.<\/p>", "prompt_text": "Run it once keeping the samples with I_motor exactly 0.0 (coasting after a blip). What λm do they give, and why do you throw them out?"}, "k3": {"kind": "check", "prompt": "<p>Name the factors you are not sure of in this estimate, and which way each one pushes λm.<\/p>", "key": ["V_in arrives in a different frame (status 5) up to ~20 ms from duty: during a sag (50.8 → 47 V in a blip) that alone is several % either way; steady samples limit it", "dead time: the VESC reports the commanded voltage; 0.12 µs × 30 kHz × Vbus ≈ 0.19 V more is applied, which would push λm up by about 5 % at 2000 erpm and 0.8 % at 14 000 erpm; the fit intercept ≈ 0 V says it is not visible in this data", "I_motor is the filtered total current (signed |i|), not iq; it lags in transients and makes Rs·I and vd slightly wrong; small at steady state", "transients left in: L·di/dt and acceleration bias the estimate high (the accelerating samples give 19–23 mWb)"], "traps": ["listing factors without the direction or the size"], "solution": "<p>Bus voltage from a different frame (several % in a sag), dead time (+0.19 V: +5 % at 2000 erpm, +0.8 % at 14 000 erpm; not visible, intercept ≈ 0), a filtered total current used as iq (small at steady state), and leftover transients (push high). The ±5 % spread is the recording, not the method: it was a blip test, not a steady hold.<\/p>", "prompt_text": "Name the factors you are not sure of in this estimate, and which way each one pushes λm."}, "c1": {"kind": "case", "prompt": "<p>You want this number to ±1 % next time. What recording do you ask your logger and VESC for, before you even ride?<\/p>", "key": ["steady holds: 3–5 constant speeds (e.g. 1000, 2000, 3000, 4000, 4800 rpm), at least 5 s each, wheels in the air, in current or speed control so I_motor never hits 0.0", "both directions of torque at each speed (small positive and small negative current), so dead time and Rs·i cancel in the average", "higher status rate if the VESC allows, and V_in in the same frame time window", "write the expected value and band before the test (rule 3b in 04_model/CLAUDE.md)"], "traps": ["\"ride the quad and log\": the load and the noise add error without adding information about λm"], "solution": "<p>Ask for steady holds at 4–5 speeds, 5 s each, with small positive and negative current at each, so the dead-time and resistive errors change sign and cancel. Freeze the prediction (16.855 mWb ± your band) before recording. A recording made for the question beats a recording made for something else.<\/p>", "prompt_text": "You want this number to ±1 % next time. What recording do you ask your logger and VESC for, before you even ride?"}, "c2": {"kind": "error", "prompt": "<p>\"The CAN log gives 17.0 mWb and the scope 16.855 mWb, so the CAN log proves the scope was 1 % low. I will change mot.lambda_m to 17.0.\"<\/p>", "key": ["wrong direction of trust: the scope captures agree to 0.17 % and the no-load telemetry route gave 16.858 mWb; this log has a ±5 % spread", "a 1 % difference inside a ±5 % spread is not a finding", "changing the parameter to fit a log and then \"validating\" with the same log validates nothing (rule 3b, 04_model/CLAUDE.md)", "the right action: record the agreement and its band, keep 16.855, and design a better test if 1 % matters"], "traps": [], "solution": "<p>The CAN estimate agrees with the scope within its own ±5 % spread; it cannot overrule a method that is 30 times tighter. Keep 16.855 mWb, write down \"agrees within +1 % median, ±5 % spread, log_017\", and if 1 % matters, record steady holds.<\/p>", "prompt_text": "\"The CAN log gives 17.0 mWb and the scope 16.855 mWb, so the CAN log proves the scope was 1 % low. I will change mot.lambda_m to 17.0.\""}, "z0": {"kind": "explain", "prompt": "<p>In at most 5 lines, to an interviewer: how did you get λm out of a CAN log, and how good is it?<\/p>", "key": ["steady-state q-axis equation: λm = (vq − Rs·iq)/ωe with id = 0", "voltage from the VESC's duty: |v| = duty·Vbus/√3, verified against a VESC Tool log (0.05 %)", "filtered to current-controlled, quasi-steady samples; rejected released-motor samples that read 6–20 % low", "result ≈ 17.0 mWb median, ±5 % spread, within about 1 % of the scope's 16.855 mWb"], "traps": [], "solution": "<p>At steady state with id = 0, vq = Rs·iq + ωe·λm. The VESC reports duty, and in its FOC |v| = duty·Vbus/√3, which I checked against its own voltage log to 0.05 %. I kept only current-controlled, near-steady samples (released-motor samples read 6–20 % low) and got a median of 17.0 mWb, ±5 % spread, about 1 % above my scope measurement. It agrees, at the level a blip recording allows.<\/p>", "prompt_text": "In at most 5 lines, to an interviewer: how did you get λm out of a CAN log, and how good is it?"}, "g1": {"kind": "case", "prompt": "<p><strong>C03 gate.<\/strong> Draft REQ-MOD-001: the acceptance criterion of your motor model, with a number, that C04 will verify against the CAN logs. One sentence for the need, then the requirement (what, how much, over what range, under what conditions), then how it will be verified. A session writes it into <code>00_sistema/<\/code> after you.<\/p>", "key": ["the need behind it: the model must predict motor torque and voltage well enough to design the current loop and the vehicle model; Kt ∝ λm, so the torque error is the λm error", "a quantity, a tolerance and a range: e.g. \"the model's back-EMF constant agrees with λm estimated from on-vehicle CAN logs within ±3 % (median) over 1000–4900 rpm mechanical\"", "conditions: steady-speed, current-controlled samples (I ≠ 0), id = 0, a log NOT used to set the parameter", "the tolerance is justified both ways: wider than what the measurement can resolve (median ±1 % here), tighter than what the use needs (e.g. torque within ±5 %)", "verification: the lambda_from_can.py script with its passing acceptance test, run on a new steady-hold recording, result written in the verification matrix"], "traps": ["no number, or a number with no range and conditions", "a tolerance tighter than the data can show (±0.2 % from a ±5 % log)", "calling it validation of the whole model (it is one parameter, light load)", "verifying with the same log used to tune the parameter"], "solution": "<p>Example. Need: the model must predict torque per amp within 5 % for current-loop and vehicle design. REQ-MOD-001: \"Over 1000–4900 rpm mechanical, at steady speed with id = 0 and |I| ≥ 1 A, the motor model's back-EMF constant shall agree with λm estimated from the VESC CAN log within ±3 % (median of at least 50 samples), using a recording not used to set the model.\" Verification: lambda_from_can.py, after passing its synthetic test, on a steady-hold recording in C04; result into the verification matrix.<\/p>", "prompt_text": "**C03 gate.** Draft REQ-MOD-001: the acceptance criterion of your motor model, with a number, that C04 will verify against the CAN logs. One sentence for the need, then the requirement (what, how much, over what range, under what conditions), then how it will be verified. A session writes it into `00_sistema/` after you."}, "z1": {"kind": "doubt", "prompt": "<p>What is still unclear, about the physics or the script? Write it as it is.<\/p>", "key": [], "traps": [], "solution": "", "prompt_text": "What is still unclear, about the physics or the script? Write it as it is."}}, "hasScene": false}, {"id": "C03-SA", "cycle": "C03", "title": "Simulink A: your motor's dq model", "date": "2026-11-10", "slot": "1", "minutes": "60", "lede": "Today you build the motor half of your digital twin with your own hands: two integrators, your measured Rs, Ld, Lq and λm, and the rotor spun at a fixed speed. Then you hit it with voltage steps and check three numbers you can already predict on paper.", "sources": "04_model/params/motor_params.m (VESC dq equations, mcpwm_foc.c and virtual_motor.c as quoted there) · Franklin, Powell & Emami-Naeini, Feedback Control of Dynamic Systems 8e, §3.3, Fig. 3.14 (first-order time constant) · Hughes & Drury, Electric Motors and Drives 5e, §9.5.1 pp. 342–344 (torque from the q-axis current)", "html": "\n<section class=\"sec\" id=\"s-predict\"><h2>Predict<\/h2>\n<p>No theory today: you learnt it in L3a, L3b, K1 and K2. Write the numbers <em>before<\/em> you build. At the end you compare the model against your own predictions, not against a key you read first.<\/p>\n<div class=\"qa\" data-q=\"r1\"><\/div>\n\n<div class=\"qa\" data-q=\"p1\"><\/div>\n\n<div class=\"qa\" data-q=\"p2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-build\"><h2>Build<\/h2>\n<p>Rule from <code>04_model/CLAUDE.md<\/code>: <strong>you place the blocks<\/strong>, the agent does not. Numbers live in <code>params/motor_params.m<\/code>; blocks reference variables (<code>mot.Rs<\/code>), never literals. Nothing like this exists in the repo yet: <code>models/<\/code> has only the vehicle models <code>longitudinal_L1.slx<\/code> and <code>longitudinal_L2.slx<\/code>. Today's file is new.<\/p>\n<article class=\"idea\"><span class=\"n\">1<\/span><div><h3>Set up the file and the parameters<\/h3>\n<p>Open MATLAB, <code>cd<\/code> to <code>PROJECT_ePWT/04_model<\/code>. New blank model, save it as <code>models/pmsm_dq.slx<\/code>. In <em>Model Settings → Model Properties → Callbacks → InitFcn<\/em> write <code>run(fullfile(fileparts(get_param(bdroot,'FileName')),'..','params','motor_params.m'))<\/code>, so every simulation loads your measured numbers fresh. Solver: <code>ode23t<\/code> (the electrical states are fast), max step <code>1e-5<\/code>, stop time <code>0.03<\/code>.<\/p>\n<div class=\"eq\">Inputs: vd, vq [V], ωe [rad/s]   States: id, iq [A]   Output: Te [N·m]<\/div>\n<p>Do not use the Simscape PMSM block or a Motor Control Blockset example. The roadmap rule: build it from the equations first; compare with the reference block later (C04). The difference between yours and theirs is the lesson.<\/p>\n<p class=\"src\">04_model/CLAUDE.md (rules 1 and 4) · 01_plan/roadmap.md (\"Lo que cambia ahora que sé qué toolboxes tengo\")<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">2<\/span><div><h3>Write the two current equations with integrators<\/h3>\n<p>These are the VESC firmware's equations, quoted at the top of <code>motor_params.m<\/code>, solved for the derivatives:<\/p>\n<div class=\"eq\">did/dt = (vd − Rs·id + ωe·Lq·iq) / Ld<\/div>\n<div class=\"eq\">diq/dt = (vq − Rs·iq − ωe·(Ld·id + λm)) / Lq<\/div>\n<p>Build each with an <strong>Integrator<\/strong> whose output is the current, a <strong>Sum<\/strong> for the bracket and a <strong>Gain<\/strong> <code>1/mot.Ld<\/code> (or <code>1/mot.Lq<\/code>). Feed <code>mot.Rs·i<\/code> back from the integrator output. The cross terms are <strong>Product<\/strong> blocks of ωe with <code>mot.Lq·iq<\/code> and <code>mot.Ld·id<\/code>. Back-EMF term <code>ωe·mot.lambda_m<\/code> goes into the q sum with a minus sign. Name every signal (id, iq, vd, vq, we, E).<\/p>\n<aside class=\"mine\"><span>In your motor<\/span>Put the back-EMF <code>E = ωe·λm<\/code> on its own named line before the sum. Tomorrow you will want to see, on a scope, how much of vq is fighting the back-EMF and how much is pushing current.<\/aside>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">3<\/span><div><h3>Add the torque and the inputs<\/h3>\n<p>Torque, from the same file: <code>Te = 1.5·p·(λm + (Ld − Lq)·id)·iq<\/code>. One Sum, two Products, one Gain <code>1.5*mot.p<\/code>.<\/p>\n<p>Inputs: <strong>Step<\/strong> blocks for vd and vq (step time 1 ms, so you see the zero before), a <strong>Constant<\/strong> for ωe. Write ωe from rpm in the block: <code>mot.p*2*pi*rpm_test/60<\/code> with <code>rpm_test<\/code> defined in the workspace. One <strong>Scope<\/strong> with id, iq and Te; log the signals too (right-click → Log selected signals) so you can read numbers with the Data Inspector cursors.<\/p>\n<p class=\"src\">Hughes §9.5.1, pp. 342–344 (torque proportional to the q-axis current)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">4<\/span><div><h3>Run the three tests<\/h3>\n<p>1. <strong>Locked rotor, voltage step.<\/strong> <code>rpm_test = 0<\/code>, vd = 0, vq step 0 → 1 V. Read the final iq and the time at which iq reaches 63 % of it (measure from the step at 1 ms). Then swap: vd = 1 V, vq = 0, and read τd. 2. <strong>Back-EMF at 4000 rpm.<\/strong> <code>rpm_test = 4000<\/code>, vd = 0, vq = <code>mot.p*2*pi*4000/60*mot.lambda_m<\/code> (the voltage you predicted) from t = 0, no step. Look at id and iq. Then set vq = 0 (a short circuit at the motor terminals) and read where id and iq settle. 3. <strong>Torque at iq = 50 A.<\/strong> Back to <code>rpm_test = 0<\/code>. Find the vq that gives iq = 50 A at steady state, apply it, read Te.<\/p>\n<div class=\"labbox\" data-lab=\"rl\" data-title=\"One phase is an R-L circuit\"><\/div>\n<p class=\"src\">Franklin, Powell &amp; Emami-Naeini 8e, §3.3, Fig. 3.14 (time constant of a first-order response)<\/p>\n<\/div><\/article>\n<\/section>\n<section class=\"sec\" id=\"s-check\"><h2>Check<\/h2>\n<p>Report what <em>your<\/em> model gave. The grader compares it with the expected values; if they disagree, the reason is the lesson.<\/p>\n<div class=\"qa\" data-q=\"k1\"><\/div>\n\n<div class=\"qa\" data-q=\"k2\"><\/div>\n\n<div class=\"qa\" data-q=\"k3\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-judgement\"><h2>Judgement<\/h2>\n\n<div class=\"qa\" data-q=\"c1\"><\/div>\n\n<div class=\"qa\" data-q=\"c2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-close\"><h2>Close<\/h2>\n\n<div class=\"qa\" data-q=\"z0\"><\/div>\n\n<div class=\"qa\" data-q=\"z1\"><\/div>\n\n<\/section>", "questions": {"r1": {"kind": "recall", "prompt": "<p>From C02: your VESC is in current control. Who sets the phase current: the load, or the throttle? And today the model has <strong>voltage<\/strong> as its input. Who sets the current in today's model?<\/p>", "key": ["in the VESC (current mode) the throttle asks for amps; the controller adjusts the voltage to get them, if there is voltage left over the back-EMF", "in today's open-loop model nobody asks for a current: the voltage you apply and the motor's own R, L and back-EMF decide it (i = (v − E)/R at steady state)", "this is why tomorrow you need a current loop: to turn a voltage-input plant into a current-input system"], "traps": ["\"the load decides the current\" in current mode (his mistake #2 in errores.md)", "thinking the dq model \"knows\" the 120 A limit: the plant has no limit, only the controller does"], "solution": "<p>In the VESC the throttle asks for amps and the current loop finds the voltage. Today's model has no loop: you apply a voltage and the current is whatever R, L and the back-EMF make it (steady state i = (v − E)/R). Closing the loop tomorrow is what turns this voltage-driven plant into the current-driven one your VESC gives you.<\/p>", "prompt_text": "From C02: your VESC is in current control. Who sets the phase current: the load, or the throttle? And today the model has **voltage** as its input. Who sets the current in today's model?"}, "p1": {"kind": "predict", "prompt": "<p>Rotor locked (ωe = 0). You apply vq = 1 V as a step, vd = 0. Predict: final iq, time constant, and iq after one time constant. Use Lq = 112.77 µH and Rs = 28.02 mΩ.<\/p>", "key": ["final iq = 1 V / 28.02 mΩ = 35.7 A", "τq = Lq / Rs = 112.77 µH / 28.02 mΩ = 4.02 ms", "after one τ: 63 % of 35.7 A = 22.6 A", "id stays at 0: with ωe = 0 there is no cross-coupling between the axes"], "traps": ["using Ld for the q axis", "\"τ = 3.82 ms\" copied from the comment in motor_params.m: that comment is wrong (Judgement)", "forgetting milli in mΩ and getting 35 mA"], "solution": "<p>iq∞ = 1 / 0.02802 = 35.7 A. τq = 112.77e-6 / 0.02802 = 4.02 ms. At t = τ, iq = 0.632 × 35.7 = 22.6 A. id stays 0 because the coupling terms ωe·L·i vanish at standstill.<\/p>", "prompt_text": "Rotor locked (ωe = 0). You apply vq = 1 V as a step, vd = 0. Predict: final iq, time constant, and iq after one time constant. Use Lq = 112.77 µH and Rs = 28.02 mΩ."}, "p2": {"kind": "predict", "prompt": "<p>Rotor spun at 4000 rpm by a dyno. What peak phase back-EMF do you expect? And the torque at iq = 50 A, id = 0?<\/p>", "key": ["ωe = p · 2π · 4000 / 60 = 3 × 418.9 = 1256.6 rad/s", "E = ωe · λm = 1256.6 × 0.016855 = 21.2 V peak phase (amplitude-invariant: it is what vq must supply)", "Te = 1.5 · p · λm · iq = 1.5 × 3 × 0.016855 × 50 = 3.79 N·m", "with id = 0 the reluctance term (Ld − Lq)·id is zero"], "traps": ["using mechanical rad/s (418.9) and getting 7.1 V", "forgetting the 1.5 or the p in the torque", "giving the line-to-line value (×√3 = 36.7 V): the dq model speaks peak phase"], "solution": "<p>ωe = 3 × 4000 × 2π / 60 = 1256.6 rad/s, so E = 1256.6 × 0.016855 = 21.2 V peak phase. Te = 1.5 × 3 × 0.016855 × 50 = 3.79 N·m (Kt = 0.0758 N·m/A).<\/p>", "prompt_text": "Rotor spun at 4000 rpm by a dyno. What peak phase back-EMF do you expect? And the torque at iq = 50 A, id = 0?"}, "k1": {"kind": "check", "prompt": "<p>Test 1: what final iq and what τq did your model give? And τd? Do they match your prediction? Paste the numbers with units.<\/p>", "key": ["iq final ≈ 35.7 A (1 V / 28.02 mΩ), within 1 %", "τq ≈ 4.02 ms (63 % point, 22.6 A, at about t = 5.0 ms counting the 1 ms step delay)", "τd ≈ 3.54 ms with vd = 1 V (Ld/Rs = 99.23 µH / 28.02 mΩ)", "id stays exactly 0 in the q test (ωe = 0, no coupling)"], "traps": ["reading the 63 % time from t = 0 instead of from the step at 1 ms (gives 5.0 ms)", "a final current that never settles: the stop time (30 ms ≈ 7τ) is fine, but a missing Rs feedback makes iq ramp without limit", "iq ending at 35.7 mA or 35 700 A: a units slip in the Gain"], "solution": "<p>iq → 35.7 A, 63 % (22.6 A) reached 4.02 ms after the step: τq = Lq/Rs. With vd = 1 V, id → 35.7 A and τd = 3.54 ms. If iq ramps forever, the −Rs·iq feedback is missing; if τ is 3.5 ms in the q test, you wired Ld.<\/p>", "prompt_text": "Test 1: what final iq and what τq did your model give? And τd? Do they match your prediction? Paste the numbers with units."}, "k2": {"kind": "check", "prompt": "<p>Test 2 at 4000 rpm: with vq = ωe·λm, what did id and iq do? And with vq = 0, where did they settle? What does the sign of the torque tell you?<\/p>", "key": ["with vq = ωe·λm = 21.2 V and vd = 0, both currents stay at about 0: the applied voltage exactly balances the back-EMF", "short circuit (vq = vd = 0): steady id ≈ −163 A, iq ≈ −32 A, |i| ≈ 166 A", "torque ≈ −2.8 N·m: negative, a brake; the shorted motor drags the dyno", "id is the big one: at speed the current is limited by ωe·Ld, not by Rs (≈ −λm/Ld = −170 A as speed grows)"], "traps": ["expecting short-circuit current = E/Rs = 21.2/0.028 = 756 A (ignores the inductance at 200 Hz)", "currents that grow without limit at speed: a sign error in a cross term"], "solution": "<p>With vq = E, the voltage cancels the back-EMF and no current flows. Shorted, the currents settle at id ≈ −163 A, iq ≈ −32 A and Te ≈ −2.8 N·m: a braking torque. The current is limited by the reactance ωe·Ld (0.125 Ω at 4000 rpm), far above Rs, so it tends to −λm/Ld ≈ −170 A. That is more than your 120 A motor limit: a shorted phase pair at speed is a real hazard.<\/p>", "prompt_text": "Test 2 at 4000 rpm: with vq = ωe·λm, what did id and iq do? And with vq = 0, where did they settle? What does the sign of the torque tell you?"}, "k3": {"kind": "calc", "prompt": "<p>Test 3: what vq did you need for iq = 50 A at standstill, and what Te did the model give? If you had to hold iq = 50 A, id = 0 at 4000 rpm open loop, what vd and vq would you need?<\/p>", "key": ["standstill: vq = Rs·50 = 1.40 V; Te = 3.79 N·m (Kt = 0.0758 N·m/A)", "at 4000 rpm: vq = Rs·iq + ωe·λm = 1.40 + 21.18 = 22.6 V", "and vd = −ωe·Lq·iq = −1256.6 × 112.77e-6 × 50 = −7.1 V: without it, the cross-coupling pushes id away from 0", "|v| = √(22.6² + 7.1²) = 23.7 V, under the 30 V that 52 V gives with SVPWM"], "traps": ["forgetting vd at speed (the \"q axis only\" habit)", "Te ≠ 3.79 N·m: the 1.5, the p, or λm in mWb instead of Wb"], "solution": "<p>At standstill vq = 0.02802 × 50 = 1.40 V and Te = 1.5 × 3 × 0.016855 × 50 = 3.79 N·m. At 4000 rpm you need vq = 1.40 + 21.18 = 22.6 V and vd = −7.1 V to cancel the coupling term ωe·Lq·iq; |v| = 23.7 V, still inside the 30 V circle. Holding the voltages by hand against coupling and back-EMF at every speed is exactly the job the current loop takes over tomorrow.<\/p>", "prompt_text": "Test 3: what vq did you need for iq = 50 A at standstill, and what Te did the model give? If you had to hold iq = 50 A, id = 0 at 4000 rpm open loop, what vd and vq would you need?"}, "c1": {"kind": "error", "prompt": "<p><code>motor_params.m<\/code> says <code>tau_e_q = Lq/Rs  % 3.82 ms<\/code> and <code>tau_e_d  % 3.49 ms<\/code>. Your model says something else. Which one is wrong, how do you know, and what do you do about it?<\/p>", "key": ["the comments are wrong: 112.77 µH / 28.02 mΩ = 4.02 ms and 99.23 µH / 28.02 mΩ = 3.54 ms", "the code computes it right (Lq/Rs); only the hand-written comment is stale, probably from older L or R values", "the model agrees with the hand calculation, two independent routes", "fix the comment in a commit with the reason, so the next reader does not take 3.82 ms as truth"], "traps": ["trusting the comment because it is in the \"source of truth\" file", "changing Lq to make 3.82 ms come out"], "solution": "<p>The comments are stale: Lq/Rs = 4.02 ms and Ld/Rs = 3.54 ms, and both your hand calculation and your model agree. The code is fine; only the text beside it is wrong. Fix the comment in a small commit that says why. A number written by hand in a comment is not a measurement.<\/p>", "prompt_text": "`motor_params.m` says `tau_e_q = Lq/Rs % 3.82 ms` and `tau_e_d % 3.49 ms`. Your model says something else. Which one is wrong, how do you know, and what do you do about it?"}, "c2": {"kind": "case", "prompt": "<p>A mentor asks: \"Your model has the rotor at a fixed speed. Isn't that cheating? The real rotor slows down when current flows.\" Defend the choice or concede it, with numbers.<\/p>", "key": ["electrical time constants are about 4 ms; the mechanical one is J/b = 1.12 s (motor alone, measured), hundreds of times slower", "over a 30 ms current test the speed barely moves, so a fixed ωe is a good approximation for current-loop work", "it is a hypothesis with a limit: for launch, coast-down or speed control you must add J·dω/dt = Te − Tload", "say what the model does not capture: no saturation (L falls with current), no harmonics (THD 9.4 %), no iron loss, Rs at an unknown temperature"], "traps": ["\"it is fine because everyone does it\" without the time-scale argument", "forgetting that the vehicle model of C01 already has the mechanics: connect them later, not now"], "solution": "<p>Defend it with time scales: the current settles in about 4 ms, the motor's own mechanics have J/b = 1.12 s, so over a 30 ms test the speed is effectively constant. Concede the limit: anything about acceleration needs J·dω/dt = Te − Tload (your C01 vehicle model). And name what the model leaves out: L that drops with current, the 9.4 % back-EMF harmonics, iron loss, and a resistance at an unknown temperature.<\/p>", "prompt_text": "A mentor asks: \"Your model has the rotor at a fixed speed. Isn't that cheating? The real rotor slows down when current flows.\" Defend the choice or concede it, with numbers."}, "z0": {"kind": "explain", "prompt": "<p>In at most 5 lines, as to an interviewer: what did you build today, which three numbers did it reproduce, and what does it not capture?<\/p>", "key": ["a dq model of his PMSM from the VESC equations, his measured parameters loaded from a .m file", "τq ≈ 4.0 ms (and τd ≈ 3.5 ms), E = 21.2 V at 4000 rpm, Te = 3.79 N·m at 50 A", "fixed speed is valid because electrical ≪ mechanical time constants", "not captured: saturation, harmonics, temperature, the inverter"], "traps": [], "solution": "<p>I built a dq model of my PMSM from the VESC firmware equations, with my measured Rs, Ld, Lq and λm loaded from a parameter file. It reproduces the hand calculations: τq = 4.0 ms, 21.2 V back-EMF at 4000 rpm, 3.79 N·m at 50 A of iq. Speed is held fixed, which is fine for current dynamics (4 ms against 1.1 s mechanical). It ignores saturation, back-EMF harmonics, temperature and the inverter.<\/p>", "prompt_text": "In at most 5 lines, as to an interviewer: what did you build today, which three numbers did it reproduce, and what does it not capture?"}, "z1": {"kind": "doubt", "prompt": "<p>What is still unclear, or what did Simulink do that you did not expect? Write it as it is; Claude explains it now, and it goes to the \"what I don't get\" part of the review.<\/p>", "key": [], "traps": [], "solution": "", "prompt_text": "What is still unclear, or what did Simulink do that you did not expect? Write it as it is; Claude explains it now, and it goes to the \"what I don't get\" part of the review."}}, "hasScene": false}, {"id": "C03-SB", "cycle": "C03", "title": "Simulink B: close the current loop", "date": "2026-11-11", "slot": "1", "minutes": "60", "lede": "Yesterday your model needed you to hold the voltages by hand. Today two PI controllers do it, with the gains you calculated on 6 November, a 30 V wall from your 52 V bus, and a step to 60 A. Then the rotor spins, and you find out what your hand prediction forgot.", "sources": "04_model/params/motor_params.m (VESC PI form and gains, mcpwm_foc.c as quoted there) · Åström & Murray, Feedback Systems 2e, §9.5 pp. 9-27–9-28 (PI by pole/zero cancellation and its slow disturbance response), §11.4 pp. 11-15–11-17 (integral windup and anti-windup) · Franklin, Powell & Emami-Naeini 8e, §3.4.1, eq. (3.68) (rise time)", "html": "\n<section class=\"sec\" id=\"s-predict\"><h2>Predict<\/h2>\n<p>Write these before opening Simulink. Use the ωc and gains from your own X1 sheet (6 November).<\/p>\n<div class=\"qa\" data-q=\"r1\"><\/div>\n\n<div class=\"qa\" data-q=\"p1\"><\/div>\n\n<div class=\"qa\" data-q=\"p2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-build\"><h2>Build<\/h2>\n<p>Open yesterday's <code>models/pmsm_dq.slx<\/code> and <strong>save as<\/strong> <code>models/pmsm_dq_cl.slx<\/code> (keep A untouched as the open-loop reference). Gains go in a new block of <code>params/motor_params.m<\/code> or in a new <code>params/current_loop_params.m<\/code> (<code>cl.wc<\/code>, <code>cl.Kp_d<\/code>, <code>cl.Kp_q<\/code>, <code>cl.Ki<\/code>), tagged as your design, not CONFIG. Stop time 0.06 s.<\/p>\n<article class=\"idea\"><span class=\"n\">1<\/span><div><h3>Two PI controllers in front of the plant<\/h3>\n<p>For each axis: error = i_ref − i (Sum), then a <strong>PID Controller<\/strong> block set to <em>PI<\/em>, <em>parallel form<\/em>, P = <code>cl.Kp_q<\/code> (or <code>cl.Kp_d<\/code>), I = <code>cl.Ki<\/code>, <em>continuous time<\/em>. Output is vq (or vd) into yesterday's plant. id_ref = 0 (a Constant); iq_ref is a Step 0 → 60 A at t = 0.03 s, so the loop has 30 ms to settle first.<\/p>\n<div class=\"eq\">v = Kp·e + Ki·∫e dt    (the VESC form: v_int += e·Ki·dt; v = v_int + e·Kp)<\/div>\n<p class=\"src\">motor_params.m, section 3 (VESC PI form, mcpwm_foc.c:4639–4644 as quoted there)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">2<\/span><div><h3>The 30 V wall<\/h3>\n<p>With SVPWM the largest sine your 52 V bus can make is Vbus/√3 = 30.0 V peak phase. Model it with the PID block's <em>Output saturation<\/em>: upper 30, lower −30, on both axes. Leave <em>Anti-windup method<\/em> on <strong>none<\/strong> for now.<\/p>\n<aside class=\"mine\"><span>In your motor<\/span>Per-axis clamping is a simplification. The real limit is on the length of the voltage arrow, √(vd² + vq²) ≤ 30 V; the VESC limits the vector. Per axis, vd and vq can both be at 29 V and the arrow is 41 V, which the inverter cannot make. Note it; fix it only if time is left.<\/aside>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">3<\/span><div><h3>Run the steps and measure<\/h3>\n<p>1. <strong>Locked rotor<\/strong> (<code>rpm_test = 0<\/code>): measure 10–90 % rise time of iq, overshoot, peak vq. 2. <strong>4000 rpm<\/strong>, same step. Same three numbers, plus the largest id excursion. 3. <strong>5000 rpm<\/strong>, same step: watch vq sitting on the 30 V wall and what iq does when it comes off.<\/p>\n<p>Use the Data Inspector cursors for the 6 A and 54 A crossing times (10 % and 90 % of 60 A).<\/p>\n<div class=\"labbox\" data-lab=\"piloop\" data-title=\"Closing the current loop\"><\/div>\n\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">4<\/span><div><h3>If time is left: anti-windup, then decoupling<\/h3>\n<p><strong>Anti-windup:<\/strong> set the PID block's method to <em>clamping<\/em> (the integrator stops while the output is saturated) and rerun 5000 rpm.<\/p>\n<p><strong>Decoupling:<\/strong> add the feed-forward that the VESC leaves switched off. After each PI, add the term the plant will subtract:<\/p>\n<div class=\"eq\">vd = PI_d − ωe·Lq·iq    vq = PI_q + ωe·(Ld·id + λm)<\/div>\n<p>Rerun 4000 rpm. The PI now sees the bare R-L again.<\/p>\n<p class=\"src\">Åström &amp; Murray §11.4, pp. 11-15–11-17 (windup, clamping and back-calculation)<\/p>\n<\/div><\/article>\n<\/section>\n<section class=\"sec\" id=\"s-check\"><h2>Check<\/h2>\n\n<div class=\"qa\" data-q=\"k1\"><\/div>\n\n<div class=\"qa\" data-q=\"k2\"><\/div>\n\n<div class=\"qa\" data-q=\"k3\"><\/div>\n\n<div class=\"qa\" data-q=\"k4\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-judgement\"><h2>Judgement<\/h2>\n\n<div class=\"qa\" data-q=\"c1\"><\/div>\n\n<div class=\"qa\" data-q=\"c2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-close\"><h2>Close<\/h2>\n\n<div class=\"qa\" data-q=\"z0\"><\/div>\n\n<div class=\"qa\" data-q=\"z1\"><\/div>\n\n<\/section>", "questions": {"r1": {"kind": "recall", "prompt": "<p>From X1: write your Kp and Ki for the q axis and the d axis, the ωc you chose, and why Ki/Kp = Rs/L is a special choice.<\/p>", "key": ["Kp = ωc·L and Ki = ωc·Rs, per axis: q uses Lq = 112.77 µH, d uses Ld = 99.23 µH", "with ωc = 2000 rad/s (the VESC's own): Kp,q = 0.226 V/A, Kp,d = 0.198 V/A, Ki = 56.0 V/(A·s) on both", "Ki/Kp = Rs/L puts the PI zero exactly on the plant pole (pole/zero cancellation): the loop becomes ωc/s and the closed loop a first-order lag with bandwidth ωc", "the VESC uses exactly this rule (kp = L·bw, ki = R·bw, bw = 2000 rad/s, motor_params.m)"], "traps": ["using Lq on the d axis too (only a small error: 14 %, but say it)", "confusing ωc in rad/s with Hz (2000 rad/s = 318 Hz)"], "solution": "<p>Kp = ωc·L, Ki = ωc·Rs. With ωc = 2000 rad/s: Kp,q = 0.226, Kp,d = 0.198 V/A, Ki = 56.0 V/(A·s). The PI zero at Ki/Kp = Rs/L cancels the plant pole, the open loop is ωc/s and the closed loop is a first-order lag with time constant 1/ωc = 0.5 ms. Your VESC runs the same rule (kp 0.2119, ki 56.2 with its averaged L).<\/p>", "prompt_text": "From X1: write your Kp and Ki for the q axis and the d axis, the ωc you chose, and why Ki/Kp = Rs/L is a special choice."}, "p1": {"kind": "predict", "prompt": "<p>Rotor locked. Step iq_ref 0 → 60 A. Predict the 10–90 % rise time, the overshoot, and the largest vq the PI asks for. Will it hit the 30 V wall?<\/p>", "key": ["first-order closed loop: rise 10–90 % = ln 9 / ωc = 2.2/ωc = 1.10 ms at ωc = 2000 rad/s", "no overshoot (first order)", "largest vq at the instant of the step: Kp·60 = 0.226 × 60 = 13.5 V", "13.5 V < 30 V: no saturation at standstill"], "traps": ["using the second-order rule 1.8/ωn: this loop is first order", "saying it saturates because 60 A \"is a lot\": compute Kp·error"], "solution": "<p>tr = ln 9 / 2000 = 1.10 ms, no overshoot, and the peak voltage is Kp·60 = 13.5 V at t = 0+, then it falls to Rs·60 = 1.7 V. Far from 30 V.<\/p>", "prompt_text": "Rotor locked. Step iq_ref 0 → 60 A. Predict the 10–90 % rise time, the overshoot, and the largest vq the PI asks for. Will it hit the 30 V wall?"}, "p2": {"kind": "predict", "prompt": "<p>Same step at 4000 rpm, no decoupling (your VESC has <code>foc_cc_decoupling = DISABLED<\/code>). Will the rise time be the same as at standstill? Guess, with one reason.<\/p>", "key": ["no: slower, because the controller was designed for the R-L plant only", "the back-EMF (21.2 V) and the cross-coupling terms ωe·L·i are disturbances the PI has to fight", "pole/zero cancellation leaves the slow plant pole (Rs/Lq ≈ 250 rad/s, τ ≈ 4 ms) in the disturbance response", "also: vq now starts near 21 V, so Kp·60 = 13.5 V on top reaches 34.7 V, over the 30 V wall"], "traps": ["\"same, the PI does not care about speed\" (it does not, but the plant does)"], "solution": "<p>Slower. The PI was tuned for R-L alone; at speed the plant also has the back-EMF and the cross-coupling ωe·L·i between the axes, and a cancellation design rejects disturbances only with the slow plant pole (τ ≈ 4 ms). And 21.2 V + 13.5 V = 34.7 V asks for more than the 30 V you have.<\/p>", "prompt_text": "Same step at 4000 rpm, no decoupling (your VESC has `foc_cc_decoupling = DISABLED`). Will the rise time be the same as at standstill? Guess, with one reason."}, "k1": {"kind": "check", "prompt": "<p>Locked rotor: your rise time, overshoot and peak vq. Compare with your hand prediction.<\/p>", "key": ["rise 10–90 % ≈ 1.10 ms (ln 9 / ωc for ωc = 2000 rad/s; 2.2/ωc in general)", "no overshoot", "peak vq ≈ 13.5 V (Kp·60) at the step, falling to Rs·60 = 1.7 V; never saturated", "agreement with the hand value within a few % means the cancellation worked"], "traps": ["a rise time near 4 ms: Ki/Kp is not Rs/L, so the zero is not on the pole", "overshoot appearing: a gain typo, or Ld and Lq swapped between axes"], "solution": "<p>About 1.10 ms, no overshoot, 13.5 V peak. The closed loop behaves like the first-order lag your X1 sheet predicted: the PI zero sits on the plant pole and the loop is ωc/s.<\/p>", "prompt_text": "Locked rotor: your rise time, overshoot and peak vq. Compare with your hand prediction."}, "k2": {"kind": "check", "prompt": "<p>At 4000 rpm, no decoupling: rise time, overshoot, how long vq sat at 30 V, and the largest id. Why is it slower than at standstill? Is it the saturation?<\/p>", "key": ["rise ≈ 3.3 ms, about 3× slower than at standstill; overshoot about 4–5 %", "vq at 30 V for only about 0.3 ms; id jumps to about +24 A while iq rises", "it is mostly the cross-coupling, not the wall: with the saturation removed the rise is still about 3.4 ms", "rising iq pushes the d axis through ωe·Lq·iq (8.5 V at 60 A), id swings, and ωe·Ld·id feeds back into the q axis"], "traps": ["blaming the saturation without testing it (take the limit off and rerun: that is the experiment)", "saying the back-EMF slows the step: it is constant at fixed speed, the integrator already holds it before the step"], "solution": "<p>About 3.3 ms and 4–5 % overshoot. vq touches 30 V for only ~0.3 ms, and removing the limit leaves the rise almost the same, so the wall is not the cause. The cause is the coupling: iq rising puts ωe·Lq·iq ≈ 8.5 V into the d axis, id kicks to ~+24 A, and ωe·Ld·id fights the q axis. The PI was designed for an uncoupled R-L that only exists at standstill.<\/p>", "prompt_text": "At 4000 rpm, no decoupling: rise time, overshoot, how long vq sat at 30 V, and the largest id. Why is it slower than at standstill? Is it the saturation?"}, "k3": {"kind": "check", "prompt": "<p>At 5000 rpm without anti-windup: how long was vq saturated, what was the overshoot? With clamping? Explain what the integrator was doing while vq sat at 30 V.<\/p>", "key": ["without anti-windup: vq saturated about 22 ms, iq overshoots about 35 % (to ≈ 81 A), rise ≈ 10 ms", "with clamping: overshoot ≈ 2 %, saturated ≈ 7 ms", "while saturated the error stays large, so the integrator keeps charging; when iq gets close, the stored integral holds vq at the wall too long and iq overshoots", "at 5000 rpm the steady voltage arrow is 30.1 V (vq = 28.2 V, vd = −10.6 V): 60 A is right at the edge, so with a vector limit it would not even be reachable"], "traps": ["\"anti-windup makes it faster\": here it barely changes the rise; it removes the overshoot", "missing that the 60 A target is barely feasible at 5000 rpm (L3b, the voltage ellipse)"], "solution": "<p>Without anti-windup vq sits at 30 V for ~22 ms, the integrator winds up, and iq overshoots ~35 %. Clamping stops the integrator while saturated: overshoot ~2 %. Underneath it is L3b again: at 5000 rpm, 60 A needs a 30.1 V arrow (vq 28.2 V, vd −10.6 V), so you are asking for a point on the edge of the voltage ellipse. Per-axis clamping hides that; a vector limit would show it.<\/p>", "prompt_text": "At 5000 rpm without anti-windup: how long was vq saturated, what was the overshoot? With clamping? Explain what the integrator was doing while vq sat at 30 V."}, "k4": {"kind": "check", "prompt": "<p>If you added decoupling: rise time at 4000 rpm now? What does that prove, and why might the VESC still leave it off?<\/p>", "key": ["rise ≈ 1.1 ms again (≈ 1.3 ms with clamping), almost no overshoot, id stays near 0", "proves the slowdown was the coupling and back-EMF the design ignored, not the gains", "the feed-forward uses ωe, L and λm: it is only as good as the speed estimate and the parameters (the VESC believes λm = 15.9 mWb, 5.5 % low)", "a wrong feed-forward injects a disturbance instead of cancelling one; a PI alone is more robust to parameter error"], "traps": ["\"the VESC should always enable it\": no number to back that up"], "solution": "<p>Back to ~1.1 ms with id flat: with feed-forward the PI sees the R-L it was designed for. The catch is that decoupling uses ωe, Ld, Lq and λm, and your VESC believes a λm 5.5 % low; wrong feed-forward adds error. At 2000 rad/s of bandwidth the PI alone is acceptable, which is probably why it is off by default.<\/p>", "prompt_text": "If you added decoupling: rise time at 4000 rpm now? What does that prove, and why might the VESC still leave it off?"}, "c1": {"kind": "case", "prompt": "<p>You are in VESC Tool. Your colleague wants a faster current response for launch control and proposes doubling the current-loop bandwidth to 4000 rad/s. What do you check before typing it in? Use your model.<\/p>", "key": ["at standstill the rise halves to ≈ 0.55 ms and the peak vq at a 60 A step doubles to ≈ 27 V, close to the 30 V wall", "the loop runs in discrete time (15 or 30 kHz, Ts not yet confirmed on the device): the sample delay limits how far ωc can go; a continuous model is optimistic", "noise: higher Kp amplifies current-sensor noise into voltage", "need first: what rise time does launch control actually require? a requirement with a number before the change"], "traps": ["trusting the continuous model's stability at any ωc", "changing a gain without a requirement (the systems-engineering habit)"], "solution": "<p>The model says the rise halves to ~0.55 ms and the voltage peak goes to ~27 V. But the model is continuous; your VESC samples at 15 or 30 kHz (open question in motor_params.m), and the delay eats phase margin as ωc grows. Higher Kp also amplifies sensor noise. And first ask what launch control needs: traction control acts in tens of ms, so a 1.1 ms current loop is probably not the bottleneck.<\/p>", "prompt_text": "You are in VESC Tool. Your colleague wants a faster current response for launch control and proposes doubling the current-loop bandwidth to 4000 rad/s. What do you check before typing it in? Use your model."}, "c2": {"kind": "error", "prompt": "<p>\"I set Kp = ωc·Lq and Ki = ωc·Rs, so my current loop has 2000 rad/s of bandwidth at every speed.\" What is wrong?<\/p>", "key": ["the design assumes the plant is R-L alone; that is true only at standstill or with perfect decoupling", "at 4000 rpm without decoupling the step takes about 3× longer (≈ 3.3 ms instead of 1.1 ms)", "reference tracking can look first-order while disturbance rejection is slow: the cancelled plant pole (τ ≈ 4 ms) stays in it", "near the voltage limit the loop is saturated and there is no bandwidth at all: the loop is open"], "traps": [], "solution": "<p>It is 2000 rad/s for the plant it was designed for: R-L at standstill. At speed the cross-coupling and back-EMF are disturbances, rejected only as fast as the slow, cancelled plant pole allows (Åström &amp; Murray §9.5 show the same trap on a cruise control), and on the 30 V wall the loop is open. Measured in your model: 1.1 ms at 0 rpm, 3.3 ms at 4000 rpm.<\/p>", "prompt_text": "\"I set Kp = ωc·Lq and Ki = ωc·Rs, so my current loop has 2000 rad/s of bandwidth at every speed.\" What is wrong?"}, "z0": {"kind": "explain", "prompt": "<p>In at most 5 lines, to an interviewer: how did you tune the current loop, what did your simulation show at speed, and what would you change?<\/p>", "key": ["pole/zero cancellation: Kp = ωc·L, Ki = ωc·Rs, ωc = 2000 rad/s as in his VESC; 1.1 ms rise at standstill, matching the hand calculation", "at 4000 rpm without decoupling about 3× slower, from cross-coupling, not saturation (checked by removing the limit)", "at 5000 rpm the 30 V wall plus windup gave about 35 % overshoot; clamping fixed it", "decoupling restores 1.1 ms but depends on parameters and the speed estimate"], "traps": [], "solution": "<p>I tuned the PI by pole/zero cancellation, Kp = ωc·L and Ki = ωc·Rs with ωc = 2000 rad/s like my VESC, and got the predicted 1.1 ms rise at standstill. At 4000 rpm without decoupling it was 3× slower; removing the voltage limit showed the cause was cross-coupling, not saturation. At 5000 rpm the 30 V limit wound up the integrator, 35 % overshoot, fixed with clamping. Decoupling restores 1.1 ms but only if λm and L are right.<\/p>", "prompt_text": "In at most 5 lines, to an interviewer: how did you tune the current loop, what did your simulation show at speed, and what would you change?"}, "z1": {"kind": "doubt", "prompt": "<p>What is still unclear, or what did the simulation do that you did not expect? Write it as it is.<\/p>", "key": [], "traps": [], "solution": "", "prompt_text": "What is still unclear, or what did the simulation do that you did not expect? Write it as it is."}}, "hasScene": false}, {"id": "C03-X1", "cycle": "C03", "title": "\"Exercise: Kp and Ki by hand for your motor\"", "date": "2026-11-06", "slot": "2", "minutes": "50", "lede": "One job, start to finish, the way a controls engineer would do it on day one: tune the q-axis current loop of your own motor on paper. Choose a bandwidth, get Kp and Ki, predict the step, check the 30 V, compare with what your VESC chose. On 11 November you check every number here in Simulink.", "sources": "Franklin, Powell & Emami-Naeini, Feedback Control of Dynamic Systems, 8th ed. (ebook, no printed page numbers) §4.3.4 and Example 4.5, §8.5.1–8.5.2 · Åström & Murray, Feedback Systems, 2nd ed. §11.4, pp. 11-15–11-18 · VESC firmware 03_hardware/vesc/_firmware: conf_general.c line 1513, motor/mcpwm_foc.c lines 4639–4695 · 04_model/params/motor_params.m", "html": "\n<section class=\"sec\" id=\"s-job\"><h2>The job<\/h2>\n<p>Your data, all from <code>motor_params.m<\/code>: Rs = 28.02 mΩ, Lq = 112.8 µH (q axis, where the torque current lives), λm = 16.855 mWb, p = 3, 52 V bus, so about 30 V of voltage vector (28.5 V with the VESC's 0.95 max duty), 120 A motor current limit. Control period OPEN: 66.7 µs (15 kHz, assumed) or 33.3 µs (30 kHz). Decoupling off.<\/p>\n<p>The method from K2, in two lines: cancel the plant pole (Ki/Kp = R/L), then the loop is first order with bandwidth ωc = Kp/L. So Kp = ωc·L and Ki = ωc·R. Do every step with numbers and units. A step without a number is not done.<\/p>\n<p>Write your answers here; on <strong>11 November<\/strong> you build this loop in Simulink and check each prediction against the simulated step. Keep them, they are your acceptance criteria.<\/p>\n<\/section>\n<section class=\"sec\" id=\"s-steps\"><h2>Steps<\/h2>\n\n<div class=\"qa\" data-q=\"x1\"><\/div>\n\n<div class=\"qa\" data-q=\"x2\"><\/div>\n\n<div class=\"qa\" data-q=\"x3\"><\/div>\n\n<div class=\"qa\" data-q=\"x4\"><\/div>\n\n<div class=\"qa\" data-q=\"x5\"><\/div>\n\n<div class=\"labbox\" data-lab=\"piloop\" data-title=\"Your gains in the current loop\"><\/div>\n\n<div class=\"qa\" data-q=\"x6\"><\/div>\n\n<div class=\"qa\" data-q=\"x7\"><\/div>\n\n<div class=\"qa\" data-q=\"x8\"><\/div>\n\n<div class=\"qa\" data-q=\"x9\"><\/div>\n\n<\/section>", "questions": {"x1": {"kind": "calc", "prompt": "<p><strong>Step 1. Choose the bandwidth.<\/strong> Pick a target ωc for your q-axis current loop, in rad/s and Hz, and justify it against two limits: (a) the sampling ceiling ωs/20 for the control period you must assume, and (b) the voltage: the proportional kick Kp·Δi of the largest step you will ask (0 → 120 A at standstill) should not exceed 30 V.<\/p>", "key": ["(a) control period is OPEN, so assume 15 kHz: ωs = 2π × 15 000 = 94 250 rad/s, ωs/20 ≈ 4710 rad/s (750 Hz); at 30 kHz it would be 9425 rad/s", "(b) Kp·120 ≤ 30 V → Kp ≤ 0.25 V/A → ωc ≤ 0.25/112.8 µH ≈ 2200 rad/s", "the voltage limit is the tighter one: a choice around 2000 rad/s (318 Hz) is justified; any value 1000–2200 rad/s with this reasoning is fine", "a choice above about 4700 rad/s is wrong until the control period is confirmed"], "traps": ["mixing Hz and rad/s", "using 30 kHz as the loop rate without saying it is open", "picking a number \"because the VESC uses it\" with no limit checked"], "solution": "<p>Sampling: with the period open you take 15 kHz, so ωs/20 ≈ 4710 rad/s. Voltage: a 120 A step with Kp = ωc·Lq asks Kp·120 volts at once; for 30 V that means ωc ≤ 2200 rad/s. The voltage is the tighter limit. A good choice: ωc = 2000 rad/s, 318 Hz, inside both, and the reference numbers below use it.<\/p>", "prompt_text": "**Step 1. Choose the bandwidth.** Pick a target ωc for your q-axis current loop, in rad/s and Hz, and justify it against two limits: (a) the sampling ceiling ωs/20 for the control period you must assume, and (b) the voltage: the proportional kick Kp·Δi of the largest step you will ask (0 → 120 A at standstill) should not exceed 30 V."}, "x2": {"kind": "calc", "prompt": "<p><strong>Step 2. Kp and Ki.<\/strong> With your ωc, compute Kp and Ki, with units. Check that Ki/Kp equals the q-axis R/L, and say in one line what that equality buys you.<\/p>", "key": ["for ωc = 2000 rad/s: Kp = 2000 × 112.77 µH = 0.2255 V/A", "Ki = 2000 × 0.02802 Ω = 56.04 V/(A·s)", "Ki/Kp = 248.5 rad/s = Rs/Lq (τ = 4.02 ms): the PI zero cancels the plant pole", "result: the loop gain is Kp/(Lq·s), a first-order closed loop with no overshoot and no steady error"], "traps": ["swapping them (Kp = ωc·R, Ki = ωc·L)", "using Ld = 99 µH or the average 106 µH for the q loop", "units: Kp in V/A, Ki in V/(A·s)"], "solution": "<p>Kp = 0.2255 V/A, Ki = 56.04 V/(A·s). Ki/Kp = 248.5 rad/s, exactly Rs/Lq. The PI zero sits on the motor's pole, they cancel, and what remains is a pure integrator Kp/(Lq·s): a first-order closed loop, no overshoot, no leftover error.<\/p>", "prompt_text": "**Step 2. Kp and Ki.** With your ωc, compute Kp and Ki, with units. Check that Ki/Kp equals the q-axis R/L, and say in one line what that equality buys you."}, "x3": {"kind": "calc", "prompt": "<p><strong>Step 3. Predict the step.<\/strong> Rotor held still, iq reference steps 0 → 60 A. Predict when the current crosses 6 A and 54 A, and the 10–90 % rise time. Does the answer change for a 0 → 20 A step? Why?<\/p>", "key": ["first-order: i(t) = 60·(1 − e^(−ωc·t))", "10 %: t = ln(1/0.9)/ωc = 0.053 ms; 90 %: t = ln 10/ωc = 1.15 ms", "rise 10–90 % = ln 9/ωc = 1.10 ms", "same for 20 A: a linear loop's timing does not depend on step size, as long as the voltage does not saturate (kick 0.2255 × 60 = 13.5 V here)"], "traps": ["using τ of the motor (4 ms) instead of 1/ωc (0.5 ms)", "saying a larger step is slower (only true once it saturates)"], "solution": "<p>i(t) = 60·(1 − e^(−2000·t)). 6 A at 0.053 ms, 54 A at 1.15 ms: rise 1.10 ms. A 20 A step has the same timing, because the loop is linear and the first voltage, 13.5 V for 60 A, is well below the limit. Notice the loop (0.5 ms) is 8 times faster than the motor's own 4 ms.<\/p>", "prompt_text": "**Step 3. Predict the step.** Rotor held still, iq reference steps 0 → 60 A. Predict when the current crosses 6 A and 54 A, and the 10–90 % rise time. Does the answer change for a 0 → 20 A step? Why?"}, "x4": {"kind": "calc", "prompt": "<p><strong>Step 4. Is 30 V enough?<\/strong> Same 0 → 60 A step. (a) At standstill: the first voltage asked and the steady voltage. (b) At 4000 rpm, starting from iq ≈ 0: the first voltage asked (remember what the integrator already holds) and the steady |v| with the cross-coupling term. Compare with about 28.5 V.<\/p>", "key": ["(a) first sample Kp·60 = 13.5 V; steady Rs·60 = 1.68 V: fits easily", "(b) ωe = 1257 rad/s, back-EMF 21.18 V already in the q integrator; first sample 21.18 + 13.5 = 34.7 V: above 28.5 V, so the start saturates and the rise is slower than 1.10 ms", "(b) steady: vq = 1.68 + 21.18 = 22.86 V, vd = −1257 × 112.8 µH × 60 = −8.50 V, |v| = 24.4 V: fits, about 4 V of margin", "so 60 A is reachable at 4000 rpm, but the transient briefly hits the wall; anti-windup (the VESC's integrator clamp) keeps it clean"], "traps": ["forgetting the back-EMF already sitting in the integrator", "forgetting vd from cross-coupling", "using 30 V and missing that the VESC clamps at 0.95 duty"], "solution": "<p>(a) 13.5 V at once, 1.68 V in steady state: no problem. (b) The integrator already holds about 21.2 V of back-EMF; the step adds 13.5 V: 34.7 V asked, more than 28.5 V, so the first part is voltage-limited. In steady state vq = 22.86 V, vd = −8.50 V, |v| = 24.4 V: inside, with about 4 V to spare. At 4000 rpm the loop gets there, a little late.<\/p>", "prompt_text": "**Step 4. Is 30 V enough?** Same 0 → 60 A step. (a) At standstill: the first voltage asked and the steady voltage. (b) At 4000 rpm, starting from iq ≈ 0: the first voltage asked (remember what the integrator already holds) and the steady |v| with the cross-coupling term. Compare with about 28.5 V."}, "x5": {"kind": "calc", "prompt": "<p><strong>Step 5. Compare with your VESC.<\/strong> Your device has kp = 0.2119 V/A and ki = 56.20 V/(A·s) (motor_params.m, after the 2026-09-07 detections). Compare with your Kp and Ki in %. Which bandwidth did VESC Tool aim for, which inductance did it use, and what is its real bandwidth on your q axis?<\/p>", "key": ["ki: 56.20 vs 56.04, +0.3 %; ki/R = 2006 rad/s", "kp: 0.2119 vs 0.2255, −6 %; kp/106 µH = 1999 rad/s: VESC Tool aimed at 2000 rad/s (tc = 500 µs) with the average L = 106 µH, not Lq", "real q-axis bandwidth = 0.2119/112.8 µH = 1879 rad/s, rise ≈ 1.17 ms", "its zero (265 rad/s) is slightly off the q pole (248.5): about 0.4 % overshoot, negligible", "the old XML (kp 0.102, ki 18.83, bw 1000) is not the device state; confirm live in VESC Tool"], "traps": ["concluding the VESC is \"wrong\" because kp differs by 6 %", "trusting 03_hardware/vesc/MOTOR_1.9.xml as current"], "solution": "<p>ki matches yours to 0.3 %. kp is 6 % lower because VESC Tool used the average inductance, 106 µH: kp/L = 1999 rad/s, so it aimed at exactly 2000 rad/s, tc = 500 µs. On your q axis that is 1879 rad/s and a 1.17 ms rise, with about 0.4 % overshoot from the small zero mismatch. You reached the same design from first principles.<\/p>", "prompt_text": "**Step 5. Compare with your VESC.** Your device has kp = 0.2119 V/A and ki = 56.20 V/(A·s) (motor_params.m, after the 2026-09-07 detections). Compare with your Kp and Ki in %. Which bandwidth did VESC Tool aim for, which inductance did it use, and what is its real bandwidth on your q axis?"}, "x6": {"kind": "lab", "prompt": "<p><strong>Step 6. Put your numbers in the lab<\/strong> (above). Set your Kp and your Ki (or Kp and \"Cancel the pole\"), a 60 A step, 5 ms window. Read the rise time, overshoot and peak voltage. Then a 120 A step: what is the peak voltage now, and is it under 30 V as Step 1 required? Compare with the dashed VESC trace.<\/p>", "key": ["60 A: rise about 1.0 ms in the lab (formula 1.10 ms; the discrete loop differs a little), no overshoot, peak voltage about 13.8 V", "120 A: peak about 27.6 V, under 30 V as designed in Step 1 (the lab adds one sample of current rise before the kick)", "VESC dashed trace a little slower (about 1.07 ms in the lab): its kp was sized for 106 µH", "the lab holds the rotor still and samples at 30 kHz: it does not show the 4000 rpm saturation of Step 4"], "traps": [], "solution": "<p>Your gains: about 1.0 ms, no overshoot, about 13.8 V peak for 60 A. At 120 A the peak is about 27.6 V, still under 30 V, which is exactly what Step 1 bought you. The VESC's trace lags a little because its kp was sized for the average L. The lab cannot show Step 4: no back-EMF, rotor still.<\/p>", "prompt_text": "**Step 6. Put your numbers in the lab** (above). Set your Kp and your Ki (or Kp and \"Cancel the pole\"), a 60 A step, 5 ms window. Read the rise time, overshoot and peak voltage. Then a 120 A step: what is the peak voltage now, and is it under 30 V as Step 1 required? Compare with the dashed VESC trace."}, "x7": {"kind": "error", "prompt": "<p><strong>Step 7. Find the error.<\/strong> A colleague looks at your design: \"1.1 ms is slow. Double Ki, the integral pushes harder, so the current gets there faster.\" Use your numbers: what does doubling Ki do to the zero, the rise time and the overshoot? Which knob would you turn instead, and how far?<\/p>", "key": ["2Ki: the zero moves to 497 rad/s, no longer on the 248.5 rad/s pole: the closed loop becomes second order", "result: rise only from 1.10 to about 0.87 ms, but about 5.5 % overshoot (13 % at 4× Ki), and more windup under saturation", "the speed knob is Kp (bandwidth Kp/L): doubling Kp and Ki together gives 0.55 ms with no overshoot", "but 2Kp means ωc = 4000 rad/s: still under the 4700 rad/s ceiling, yet the 120 A kick becomes 54 V, so big steps saturate; Step 1's limit is why you did not do it"], "traps": ["agreeing that Ki sets speed", "doubling Kp without re-checking the sampling ceiling and the 30 V kick"], "solution": "<p>Doubling Ki moves the zero to 497 rad/s, off the motor's pole, so the cancellation is gone. You gain little speed (1.10 → about 0.87 ms) and buy about 5.5 % overshoot, plus more windup when saturated. Speed is Kp's job: double Kp with Ki and you get 0.55 ms clean. That is still inside the 4700 rad/s ceiling, but a 120 A step would ask 54 V; that is why you stopped at 2000 rad/s.<\/p>", "prompt_text": "**Step 7. Find the error.** A colleague looks at your design: \"1.1 ms is slow. Double Ki, the integral pushes harder, so the current gets there faster.\" Use your numbers: what does doubling Ki do to the zero, the rise time and the overshoot? Which knob would you turn instead, and how far?"}, "x8": {"kind": "explain", "prompt": "<p><strong>Step 8. Explain it.<\/strong> In at most 5 lines, as to an interviewer: how you tuned the current loop of your motor, the numbers, and what you will check in Simulink on 11 November.<\/p>", "key": ["cancellation: Ki/Kp = Rs/Lq = 248.5 rad/s, so Kp = ωc·Lq, Ki = ωc·Rs", "ωc = 2000 rad/s, chosen under the voltage limit (≈ 2200 rad/s for a 120 A kick) and the sampling ceiling (≈ 4700 rad/s at 15 kHz): Kp = 0.2255 V/A, Ki = 56.04 V/(A·s)", "prediction: 1.10 ms rise, no overshoot; at 4000 rpm a 60 A step saturates briefly (34.7 V asked)", "the VESC got the same: kp 0.2119, ki 56.20 (2000 rad/s on the average L)", "in Simulink: step response, rise time, overshoot, voltage, at standstill and at 4000 rpm"], "traps": [], "solution": "<p>The q axis is an R-L plant, 28 mΩ and 113 µH. I put the PI zero on its pole, so Kp = ωc·L and Ki = ωc·R. I chose 2000 rad/s: under the 4700 rad/s sampling ceiling for a 15 kHz loop, and low enough that a 120 A step asks under 30 V. That gives 0.2255 V/A and 56 V/(A·s), a 1.1 ms rise, no overshoot; my VESC chose the same. On 11 November I check rise, overshoot and voltage in Simulink, at standstill and at 4000 rpm.<\/p>", "prompt_text": "**Step 8. Explain it.** In at most 5 lines, as to an interviewer: how you tuned the current loop of your motor, the numbers, and what you will check in Simulink on 11 November."}, "x9": {"kind": "doubt", "prompt": "<p>What is still unclear? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors.<\/p>", "key": [], "traps": [], "solution": "", "prompt_text": "What is still unclear? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors."}}, "hasScene": false}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* Motor3D — Pol's motor as it is built: an interior-magnet PMSM with an inner rotor and an outer
   slotted stator, p = 3. One scene for every lesson; a lesson changes its state with presets.
   Proportions and slot count (18, q = 1) are illustrative: slot count and magnet layout are not
   measured (03_hardware/baseline.md). The air gap is drawn about twice its real size. */
window.Motor3D = (function () {
  const TAU = Math.PI * 2, D2R = Math.PI / 180;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt = (x, d) => (Math.abs(x) < 5e-10 ? 0 : x).toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // geometry, in centimetres-ish scene units
  const P = 3, NS = 18, RSO = 6.0, RB = 3.7, RS = 5.0, R1 = RB + 0.16, W1 = 0.19, W2 = 0.38, OPEN = 0.11;
  const RR = 3.52, RSH = 0.85, L = 5.0, NLAM = 10;
  const RM = 2.85, MA = 1.15, MT = 0.32; // magnet bar: radial position, half length, thickness
  // slot n holds this phase with this sign (q = 1, full pitch, 60 deg phase belts): U+ W- V+ U- W+ V-
  const BELT = [[0, 1], [2, -1], [1, 1], [0, -1], [2, 1], [1, -1]];
  const slotAngle = n => (n + 0.5) * TAU / NS;

  const DEFAULT = { phases: 3, field: true, currents: true, labels: false, rotor: true, vectors: false, spin: true, speed: 0.2, delta: 90, endturns: true, caption: '', dq: false, imag: 0 };

  function mount(host) {
    const vp = host.querySelector('.vp'), labelsEl = host.querySelector('.labels'), hud = host.querySelector('.hud');
    const S = Object.assign({}, DEFAULT, { wt: 30 * D2R });
    if (!window.THREE) { vp.innerHTML = '<p class="fallback">The 3D motor did not load (no connection to the 3D library). The rest of the lesson works.</p>'; return null; }
    const T = THREE;
    let renderer;
    try { renderer = new T.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { vp.innerHTML = '<p class="fallback">This browser has no WebGL, so the 3D motor cannot run here.</p>'; return null; }
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    vp.prepend(renderer.domElement);
    const scene = new T.Scene();
    const cam = new T.PerspectiveCamera(36, 1, 0.1, 200);
    cam.position.set(4.2, -10.5, 23.5); cam.up.set(0, 0, 1); cam.lookAt(0, 0, 0);
    const controls = T.OrbitControls ? new T.OrbitControls(cam, renderer.domElement) : null;
    if (controls) { controls.enableDamping = true; controls.minDistance = 7; controls.maxDistance = 30; controls.enablePan = false; }
    scene.add(new T.HemisphereLight(0xffffff, 0x445048, 0.95));
    const key = new T.DirectionalLight(0xffffff, 0.75); key.position.set(6, -8, 14); scene.add(key);
    const rim = new T.DirectionalLight(0xffffff, 0.35); rim.position.set(-8, 6, -4); scene.add(rim);
    const col = n => new T.Color(css(n) || '#888');

    const mats = {
      steel: new T.MeshStandardMaterial({ color: 0xb9c3c8, metalness: 0.15, roughness: 0.5 }),
      steelDark: new T.MeshStandardMaterial({ color: 0x96a1a7, metalness: 0.15, roughness: 0.55 }),
      shaft: new T.MeshStandardMaterial({ color: 0xd6dadc, metalness: 0.25, roughness: 0.3 }),
      hall: new T.MeshStandardMaterial({ color: 0x1b1e1f, roughness: 0.6 }),
      magN: new T.MeshStandardMaterial({ color: col('--magN'), metalness: 0.1, roughness: 0.4 }),
      magS: new T.MeshStandardMaterial({ color: col('--magS'), metalness: 0.1, roughness: 0.4 }),
    };
    const phaseCol = () => [col('--u'), col('--v'), col('--w')];
    const copperMats = [0, 1, 2].map(k => new T.MeshStandardMaterial({ color: 0xd27b3c, metalness: 0.25, roughness: 0.35, emissive: phaseCol()[k], emissiveIntensity: 0 }));
    const endMats = [0, 1, 2].map(k => new T.MeshStandardMaterial({ color: phaseCol()[k], metalness: 0.2, roughness: 0.5, emissive: phaseCol()[k], emissiveIntensity: 0 }));

    // ---- stator lamination: outer circle, bore with 18 slots ----
    function pt(theta, rad, w) { const c = Math.cos(theta), s = Math.sin(theta); return new T.Vector2(c * rad - s * w, s * rad + c * w); }
    function boreContour() {
      const pts = [];
      for (let n = 0; n < NS; n++) {
        const th = slotAngle(n);
        pts.push(pt(th, RB, -OPEN), pt(th, RB + 0.1, -OPEN), pt(th, R1, -W1), pt(th, RS - 0.28, -W2), pt(th, RS - 0.05, -W2 * 0.62), pt(th, RS + 0.06, 0),
          pt(th, RS - 0.05, W2 * 0.62), pt(th, RS - 0.28, W2), pt(th, R1, W1), pt(th, RB + 0.1, OPEN), pt(th, RB, OPEN));
        const a0 = th + OPEN / RB, a1 = slotAngle(n + 1) - OPEN / RB;
        for (let k = 1; k < 6; k++) { const a = a0 + (a1 - a0) * k / 6; pts.push(new T.Vector2(RB * Math.cos(a), RB * Math.sin(a))); }
      }
      return pts;
    }
    const statorShape = new T.Shape(); statorShape.absarc(0, 0, RSO, 0, TAU, false);
    statorShape.holes.push(new T.Path(boreContour()));
    const lamD = L / NLAM;
    const statorG = new T.Group(); scene.add(statorG);
    const statorGeo = new T.ExtrudeGeometry(statorShape, { depth: lamD - 0.035, bevelEnabled: false, curveSegments: 80 });
    for (let k = 0; k < NLAM; k++) { const m = new T.Mesh(statorGeo, k % 2 ? mats.steel : mats.steelDark); m.position.z = -L / 2 + k * lamD; statorG.add(m); }

    // ---- copper in the slots ----
    function slotFill(th) {
      return new T.Shape([pt(th, R1 + 0.05, -(W1 - 0.04)), pt(th, RS - 0.3, -(W2 - 0.05)), pt(th, RS - 0.08, -W2 * 0.5), pt(th, RS + 0.0, 0), pt(th, RS - 0.08, W2 * 0.5), pt(th, RS - 0.3, W2 - 0.05), pt(th, R1 + 0.05, W1 - 0.04)]);
    }
    const slots = [];
    for (let n = 0; n < NS; n++) {
      const [ph, sign] = BELT[n % 6];
      const geo = new T.ExtrudeGeometry(slotFill(slotAngle(n)), { depth: L + 0.2, bevelEnabled: false });
      const m = new T.Mesh(geo, copperMats[ph]); m.position.z = -L / 2 - 0.1; statorG.add(m);
      slots.push({ n, ph, sign, th: slotAngle(n) });
    }
    // ---- end windings: each coil goes from a + slot to the - slot three slots on ----
    const endG = new T.Group(); statorG.add(endG);
    const rc = (R1 + RS) / 2;
    slots.filter(s => s.sign > 0).forEach(s => {
      [-1, 1].forEach(side => {
        const a0 = s.th, a1 = slotAngle(s.n + 3), z0 = side * (L / 2 + 0.1), pts = [];
        for (let k = 0; k <= 16; k++) { const f = k / 16, a = a0 + (a1 - a0) * f, bulge = Math.sin(Math.PI * f); pts.push(new T.Vector3((rc + 0.25 * bulge) * Math.cos(a), (rc + 0.25 * bulge) * Math.sin(a), z0 + side * (0.15 + 0.75 * bulge))); }
        const tube = new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts), 32, 0.2, 10, false), endMats[s.ph]);

    });
    // ---- Hall sensors at the back, 40 deg mechanical apart = 120 deg electrical ----
    [0, 40, 80].forEach(d => { const a = d * D2R + TAU / NS; const h = new T.Mesh(new T.BoxGeometry(0.35, 0.5, 0.25), mats.hall); h.position.set((RB + 0.25) * Math.cos(a), (RB + 0.25) * Math.sin(a), -L / 2 - 0.15); h.rotation.z = a; statorG.add(h); });

    // ---- rotor: laminated core with interior magnet bars and flux barriers ----
    function pocket(phi) {
      const loc = [[RM - MT / 2, -MA], [RM - MT / 2, MA], [RM + 0.1, MA + 0.3], [RM + 0.32, MA + 0.22], [RM + MT / 2, MA], [RM + MT / 2, -MA], [RM + 0.32, -MA - 0.22], [RM + 0.1, -MA - 0.3]];

    const shaftHole = new T.Path(); shaftHole.absarc(0, 0, RSH, 0, TAU, true); rotorShape.holes.push(shaftHole);
    for (let j = 0; j < 2 * P; j++) rotorShape.holes.push(new T.Path(pocket(j * TAU / (2 * P))));

    const rotorGeo = new T.ExtrudeGeometry(rotorShape, { depth: lamD - 0.035, bevelEnabled: false, curveSegments: 72 });
    for (let k = 0; k < NLAM; k++) { const m = new T.Mesh(rotorGeo, k % 2 ? mats.steel : mats.steelDark); m.position.z = -L / 2 + k * lamD; rotorG.add(m); }
    const magnets = [];
    for (let j = 0; j < 2 * P; j++) {
      const phi = j * TAU / (2 * P);
      const shp = new T.Shape([pt(phi, RM - MT / 2 + 0.02, -MA + 0.02), pt(phi, RM + MT / 2 - 0.02, -MA + 0.02), pt(phi, RM + MT / 2 - 0.02, MA - 0.02), pt(phi, RM - MT / 2 + 0.02, MA - 0.02)]);

    }
    const shaft = new T.Mesh(new T.CylinderGeometry(RSH, RSH, L + 4.5, 40), mats.shaft); shaft.rotation.x = Math.PI / 2; shaft.position.z = -0.9; rotorG.add(shaft);
    const key3 = new T.Mesh(new T.BoxGeometry(0.3, 0.3, 1.6), mats.steelDark); key3.position.set(RSH, 0, L / 2 + 0.9); rotorG.add(key3);

    // ---- air-gap field arrows on the front face ----
    const arrowG = new T.Group(); scene.add(arrowG);
    const NA = 90, arrows = [];
    for (let k = 0; k < NA; k++) { const th = k / NA * TAU; const a = new T.ArrowHelper(new T.Vector3(1, 0, 0), new T.Vector3(), 0.4, 0x888888, 0.12, 0.09); a.userData.th = th; arrowG.add(a); arrows.push(a); }
    // ---- vectors: stator field axis and rotor N axis (one pole pair shown) ----
    const vecG = new T.Group(); scene.add(vecG);
    const vStator = new T.ArrowHelper(new T.Vector3(1, 0, 0), new T.Vector3(0, 0, L / 2 + 1.6), 3.4, 0xffffff, 0.45, 0.3);
    const vRotor = new T.ArrowHelper(new T.Vector3(1, 0, 0), new T.Vector3(0, 0, L / 2 + 1.55), 2.7, 0xffffff, 0.4, 0.28);
    vecG.add(vStator, vRotor);

    const zdq = L / 2 + 0.4, QM = TAU / 4 / P, LDQ = RR + 1.0;
    const aD = new T.ArrowHelper(new T.Vector3(1, 0, 0), new T.Vector3(0, 0, zdq), LDQ, 0xffffff, 0.45, 0.3);
    const aQ = new T.ArrowHelper(new T.Vector3(Math.cos(QM), Math.sin(QM), 0), new T.Vector3(0, 0, zdq), LDQ, 0xffffff, 0.45, 0.3);
    dqG.add(aD, aQ);
    const aI = new T.ArrowHelper(new T.Vector3(1, 0, 0), new T.Vector3(0, 0, zdq + 0.15), 2, 0xffffff, 0.5, 0.34); rotorG.add(aI);
    const ILEN = I => 0.6 + 2.8 * Math.min(1, I / 120); // arrow length for |i| in A
    // ---- current glyphs (dot = out of the page, cross = into it) on each slot face ----
    function glyph(dot) {
      const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
      g.fillStyle = 'rgba(255,255,255,.92)'; g.beginPath(); g.arc(32, 32, 28, 0, TAU); g.fill();
      g.strokeStyle = '#111'; g.lineWidth = 5; g.beginPath(); g.arc(32, 32, 26, 0, TAU); g.stroke();
      if (dot) { g.fillStyle = '#111'; g.beginPath(); g.arc(32, 32, 8, 0, TAU); g.fill(); } else { g.beginPath(); g.moveTo(16, 16); g.lineTo(48, 48); g.moveTo(48, 16); g.lineTo(16, 48); g.stroke(); }
      const t = new T.CanvasTexture(c); return new T.SpriteMaterial({ map: t, depthTest: false });
    }
    const gDot = glyph(true), gCross = glyph(false);
    const glyphs = slots.map(s => { const sp = new T.Sprite(gDot); sp.position.set(rc * Math.cos(s.th), rc * Math.sin(s.th), L / 2 + 0.25); sp.scale.set(0.42, 0.42, 1); scene.add(sp); return sp; });

    // ---- labels ----
    const tooth = TAU / NS;
    const LABELS = [
      ['Stator lamination stack (steel)', new T.Vector3(5.5 * Math.cos(1.05), 5.5 * Math.sin(1.05), L / 2)],
      ['Tooth', new T.Vector3(4.3 * Math.cos(2 * tooth), 4.3 * Math.sin(2 * tooth), L / 2)],
      ['Slot with copper winding', new T.Vector3(4.45 * Math.cos(slotAngle(4)), 4.45 * Math.sin(slotAngle(4)), L / 2 + 0.1)],
      ['Air gap (drawn 2× real)', new T.Vector3(3.61 * Math.cos(3.3), 3.61 * Math.sin(3.3), L / 2)],
      ['Rotor lamination', new T.Vector3(1.6 * Math.cos(2.6), 1.6 * Math.sin(2.6), L / 2), true],
      ['Magnet inside the rotor', new T.Vector3(RM * Math.cos(TAU / 6 * 4), RM * Math.sin(TAU / 6 * 4), L / 2), true],
      ['Flux barrier (air)', null, true],
      ['Shaft', new T.Vector3(0, 0, L / 2 + 2.2), true],
      ['End winding', new T.Vector3(rc * Math.cos(slotAngle(10)), rc * Math.sin(slotAngle(10)), -L / 2 - 0.9)],
      ['Hall sensors', new T.Vector3((RB + 0.3) * Math.cos(TAU / NS + 0.7), (RB + 0.3) * Math.sin(TAU / NS + 0.7), -L / 2 - 0.3)],
      ['d', new T.Vector3((LDQ + 0.35), 0, zdq), true, 'dq'],
      ['q', new T.Vector3((LDQ + 0.35) * Math.cos(QM), (LDQ + 0.35) * Math.sin(QM), zdq), true, 'dq'],
      ['i = id + j·iq', new T.Vector3(1, 0, zdq), true, 'cur'],
    ];
    { const phi = TAU / 6 * 4; const p2 = pt(phi, RM + 0.25, MA + 0.28); LABELS[6][1] = new T.Vector3(p2.x, p2.y, L / 2); }
    const labelEls = LABELS.map(([t]) => { const s = document.createElement('span'); s.textContent = t; labelsEl.appendChild(s); return s; });

    function applyColors() {
      mats.magN.color = col('--magN'); mats.magS.color = col('--magS');
      const pc = phaseCol(); copperMats.forEach((m, k) => m.emissive = pc[k]); endMats.forEach((m, k) => { m.color = pc[k]; m.emissive = pc[k]; });
    }
    function resize() {

        if (S.field) arrows.forEach(a => {
          const th = a.userData.th; let B = 0;

  function panelHTML() {
    return `<div class="motor" id="motor">
  <div class="vp"><div class="labels"></div><div class="hud"></div></div>
  <div class="body">

<script>
/* Labs — small 2D interactives a lesson places with :::lab <name>. Each mounts into a .labbox. */
window.Labs = (function () {
  const D2R = Math.PI / 180, TAU = Math.PI * 2;
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmt = (x, d = 1) => (Math.abs(x) < 5e-10 ? 0 : x).toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
  function fit(c, h) {

    c.style.height = h + 'px'; c.width = w * dpr; c.height = h * dpr; const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); return { g, w, h };
  }

  }
  const readout = rows => rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('');
  const slider = (id, label, min, max, step, val) => `<div><label for="${id}">${label} <output id="${id}-o"></output></label><input id="${id}" type="range" min="${min}" max="${max}" step="${step}" value="${val}"></div>`;

  function clarke(box) {
    box.insertAdjacentHTML('beforeend', `
      <div class="seg" role="group" aria-label="Mode"><button type="button" id="cl-sine" aria-pressed="true">Balanced sines</button><button type="button" id="cl-free" aria-pressed="false">Free values</button><button type="button" id="cl-play">Animate ωt</button></div>
      <div class="ctl" id="cl-c-sine">${slider('cl-wt', 'Instant ωt', 0, 360, 1, 30)}${slider('cl-amp', 'Peak current', 10, 120, 1, 100)}</div>
      <div class="ctl" id="cl-c-free" hidden>${slider('cl-u', 'iU', -120, 120, 1, 100)}${slider('cl-v', 'iV', -120, 120, 1, -100)}</div>

    }

      $('cl-wt-o').textContent = $('cl-wt').value + '°'; $('cl-amp-o').textContent = $('cl-amp').value + ' A';
      $('cl-u-o').textContent = $('cl-u').value + ' A'; $('cl-v-o').textContent = $('cl-v').value + ' A';
      const ia = (2 / 3) * (iu - 0.5 * iv - 0.5 * iw), ib = (iv - iw) / Math.sqrt(3);
      const cU = css('--u'), cV = css('--v'), cW = css('--w'), ink = css('--ink'), mut = css('--muted'), line = css('--line'), acc = css('--accent');
      const A = mode === 'sine' ? +$('cl-amp').value : 120;
      { const { g, w, h } = fit($('cl-wave'), 220); g.clearRect(0, 0, w, h); const L = 42, R = 10, T = 12, B = h - 24;
        const X = d => L + (w - L - R) * d / 360, Y = v => T + (B - T) * (1 - (v / A + 1) / 2);
