<title>ePWT Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a lab bench. Reading column on the left, the 3D motor pinned on the right (wide screens),
   in the flow on narrow ones. Phase colours U/V/W are the identity, teal is the UI accent, copper marks
   the grader's voice. */
:root{
  --bg:#F3F6F5; --surface:#FFFFFF; --sunk:#E8EEEB; --ink:#14201B; --muted:#55665E; --line:#D4DDD9;
  --accent:#0E6E62; --accent-soft:#D8EEEA; --copper:#A85A23; --copper-soft:#F7E9DD;
  --u:#D1495B; --v:#C98A00; --w:#2F6FDE; --ok:#1F7A3D; --ok-soft:#DDF1E2; --warn:#A8500B; --warn-soft:#FBEBDD; --bad:#B3261E; --bad-soft:#F9E0DE;
  --magN:#0E6E62; --magS:#7A5FA8; --steel:#9AA6A1; --scene:#CBD6D2;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --sunk:#1D2925; --ink:#E4ECE8; --muted:#94A69E; --line:#2B3833;
  --accent:#3DB6A3; --accent-soft:#163A34; --copper:#E39A62; --copper-soft:#3A2618;
  --u:#F06A7A; --v:#F0B53A; --w:#73A0FF; --ok:#5CC981; --ok-soft:#173523; --warn:#F0A060; --warn-soft:#3A2715; --bad:#F2867D; --bad-soft:#3D1C1A;
  --magN:#3DB6A3; --magS:#9C86D0; --steel:#7D8A85; --scene:#121A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --sunk:#1D2925; --ink:#E4ECE8; --muted:#94A69E; --line:#2B3833;
  --accent:#3DB6A3; --accent-soft:#163A34; --copper:#E39A62; --copper-soft:#3A2618;
  --u:#F06A7A; --v:#F0B53A; --w:#73A0FF; --ok:#5CC981; --ok-soft:#173523; --warn:#F0A060; --warn-soft:#3A2715; --bad:#F2867D; --bad-soft:#3D1C1A;
  --magN:#3DB6A3; --magS:#9C86D0; --steel:#7D8A85; --scene:#121A17; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);font-stretch:85%;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,2.8rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.55rem;font-weight:750}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
ul{margin:0;padding-left:1.2em;display:grid;gap:4px}
code{font-family:var(--mono);font-size:.92em;background:var(--sunk);padding:1px 5px;border-radius:4px}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--surface);border-bottom:1px solid var(--line);margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:54px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:800 1.15rem/1 var(--display);font-stretch:80%;color:var(--ink);text-decoration:none;letter-spacing:.01em}
.phasebar{display:flex;height:16px;width:18px;gap:2px}.phasebar i{flex:1;border-radius:2px}
.phasebar i:nth-child(1){background:var(--u)}.phasebar i:nth-child(2){background:var(--v)}.phasebar i:nth-child(3){background:var(--w)}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{font:500 .92rem/1 var(--body);color:var(--muted);text-decoration:none;padding:9px 12px;border-radius:8px;display:flex;gap:6px;align-items:center}
.tabs a[aria-current="page"]{color:var(--ink);background:var(--sunk)}
.badge{font:600 .72rem/1 var(--mono);background:var(--copper);color:var(--surface);border-radius:999px;padding:3px 7px}

main{max-width:1320px;margin:0 auto;padding-block:26px 90px}
.loading{color:var(--muted)}
.eyebrow{font:500 .76rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:1.08rem;color:var(--muted);max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font:.86rem/1.4 var(--mono);color:var(--muted)}

/* lesson layout */
.lesson{display:grid;gap:28px}
.lesson-head{display:grid;gap:12px;max-width:720px}
.lesson-grid{display:grid;gap:28px}
.lesson-grid>.col{min-width:0;display:grid;gap:34px;max-width:720px}
@media (min-width:1080px){
  .lesson-grid.with-motor{grid-template-columns:minmax(0,1fr) minmax(420px,520px);align-items:start}
  .lesson-grid.with-motor>.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);order:2}
}
.toc{display:flex;gap:6px;flex-wrap:wrap}
.toc a{font:500 .84rem/1 var(--body);color:var(--ink);text-decoration:none;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:flex;gap:6px;align-items:center}
.toc a .dots{font:.75rem/1 var(--mono);color:var(--muted)}
.sec{display:grid;gap:18px}
.sec>h2{padding-bottom:4px}
.sec>p,.sec>ul{max-width:64ch}
.idea{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:4px 12px;padding-top:18px;border-top:1px solid var(--line)}
.idea>.n{font:800 1.5rem/1 var(--display);color:var(--accent);font-stretch:75%}
.idea>div{min-width:0;display:grid;gap:12px}
.idea.live>.n{color:var(--copper)}
.eq{font:500 1.02rem/1.5 var(--mono);background:var(--sunk);border-radius:8px;padding:10px 14px;overflow-x:auto;white-space:nowrap}
.src{font:.8rem/1.4 var(--mono);color:var(--muted)}
.mine{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:.96rem;display:grid;gap:2px}
.mine span{font:500 .72rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.scene-ref{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.scene-ref p{flex:1 1 240px}

/* buttons */
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;font-size:.92rem;cursor:pointer;line-height:1.2}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:6px 10px;font-size:.84rem}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:.84rem;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:600}

/* question box */
.qa{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;display:grid;gap:12px}
.qa .qtag{font:500 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.qa .prompt{font-weight:500;display:grid;gap:8px}
.qa textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:15px/1.5 var(--body);background:var(--bg);color:var(--ink)}
.qa .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qa .hint{font-size:.84rem;color:var(--muted)}
.turn{border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.95rem}
.turn.mine-t{background:var(--sunk)}
.turn.mine-t .who{color:var(--muted)}
.turn .who{font:500 .72rem/1 var(--mono);letter-spacing:.08em;text-transform:uppercase}
.turn.grader{background:var(--copper-soft);border:1px solid color-mix(in srgb,var(--copper) 35%,transparent)}
.turn.grader .who{color:var(--copper)}
.turn .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.verdict{display:inline-flex;align-items:center;gap:6px;font:600 .82rem/1 var(--mono);padding:5px 9px;border-radius:999px;width:max-content}
.verdict.right{background:var(--ok-soft);color:var(--ok)}
.verdict.partial{background:var(--warn-soft);color:var(--warn)}
.verdict.wrong,.verdict.no_attempt{background:var(--bad-soft);color:var(--bad)}
.verdict.saved{background:var(--sunk);color:var(--muted)}
.fb-list{display:grid;gap:4px;padding:0;list-style:none}
.fb-list li{display:grid;grid-template-columns:1.2em minmax(0,1fr);gap:6px}
.fb-list li b{font-family:var(--mono)}
.explain{border-left:3px solid var(--copper);padding-left:10px}
.explain .lbl{font:500 .72rem/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--copper);display:block;margin-bottom:4px}
.redo{font-weight:600}
.solution{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:8px;font-size:.95rem}
.solution .lbl{font:500 .72rem/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.thinking{display:flex;gap:8px;align-items:center;color:var(--copper);font-size:.9rem}
.thinking i{width:8px;height:8px;border-radius:50%;background:var(--copper);animation:pulse 1s infinite ease-in-out}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.thinking i{animation:none}}
.err{color:var(--bad);font-size:.88rem}

/* motor panel */
.motor{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid}
.motor .vp{position:relative;aspect-ratio:1/0.86;max-width:100%;background:radial-gradient(circle at 50% 40%,var(--surface),var(--scene));touch-action:none}
.motor .vp canvas{display:block;width:100%;height:100%}
.motor .labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.motor .labels span{position:absolute;transform:translate(-50%,-100%);font:600 .74rem/1.15 var(--body);color:var(--ink);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:6px;padding:3px 6px;white-space:nowrap}
.motor .labels span::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:10px;background:var(--muted)}
.motor .labels span.hidden{display:none}
.motor .hud{position:absolute;left:10px;top:10px;font:.74rem/1.3 var(--mono);color:var(--muted);pointer-events:none}
.motor .body{padding:12px 14px;display:grid;gap:10px;border-top:1px solid var(--line)}
.motor .caption{font-size:.9rem;min-height:1.4em}
.motor .ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 16px}
.motor .ctl label{display:flex;justify-content:space-between;font-size:.84rem;gap:8px}
.motor output,.readout dd{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:6px;margin:0}
.readout div{background:var(--sunk);border-radius:8px;padding:6px 9px;min-width:0}
.readout dt{font-size:.72rem;color:var(--muted)}
.readout dd{margin:0;font-size:.92rem}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.fallback{padding:24px;color:var(--muted)}

/* 2D labs */
.labbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.labbox h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.labbox h3 small{font:500 .72rem/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.labbox canvas{width:100%;display:block;border-radius:8px;background:var(--sunk)}
.labbox .pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.labbox .ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px 16px}
.labbox .ctl label{display:flex;justify-content:space-between;font-size:.86rem;gap:8px}

/* today / review / lessons */
.page{display:grid;gap:26px;max-width:760px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.due{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--copper-soft);border:1px solid color-mix(in srgb,var(--copper) 35%,transparent);border-radius:12px;padding:14px 16px}
.due b{font-family:var(--display);font-size:1.25rem;font-stretch:85%}
.list{display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.lrow .t{font:700 1.08rem/1.2 var(--display);font-stretch:85%}
.lrow .m{font:.82rem/1.3 var(--mono);color:var(--muted)}
.lrow .p{font:600 .9rem/1 var(--mono);color:var(--accent)}
.status{font:600 .72rem/1 var(--mono);padding:4px 8px;border-radius:999px}
.status.red{background:var(--bad-soft);color:var(--bad)}
.status.yellow{background:var(--warn-soft);color:var(--warn)}
.status.green{background:var(--ok-soft);color:var(--ok)}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px}
.doubt{display:grid;gap:6px;font-size:.95rem}
.doubt .q{font-weight:600}
@media (max-width:1079px){.motor .vp{aspect-ratio:auto;height:min(62vh,88vw)}}

</style>

<script type="application/json" id="data">{"facts": "Pol's quad motor: radial-flux PMSM, inner rotor, outer slotted stator, 3 pole pairs (p = 3, 6 magnets, measured by Hall pulse counting). Magnets probably interior or inset: saliency Lq/Ld = 1.14, so not pure surface; exact magnet layout and slot count NOT measured. lambda_m = 16.855 mWb (measured, back-EMF spin test with a drill, motor disconnected, 7-Sep-2026). Rs = 28 mOhm per phase (VESC estimate, includes MOSFETs). Ld = 99 uH, Lq = 113 uH. Kt = 1.5*p*lambda_m = 0.0758 N*m/A of iq. Bus 52 V nominal (13S5P Li-ion), pack resistance measured 0.18 Ohm. VESC in FOC, current control: the throttle asks for amps. Limits: motor 120 A, battery 40 A (BMS continuous). PWM 30 kHz. Field weakening OFF (fw_current = 0). Max sinusoidal phase voltage with SVPWM = Vbus/sqrt(3) = 30 V peak. Measured no-load speed 5480 rpm. Gear 92/11 = 8.364. Wheel radius 0.155 m (assumed). 110 kg with rider. Amplitude-invariant Clarke/Park (VESC convention).", "lessons": [{"id": "C02-EX", "cycle": "C02", "title": "C02 exam: from the battery to the rotating field", "date": "2026-11-04", "slot": "1", "minutes": "45", "lede": "Forty-five minutes, from memory, on your own quad. Battery to torque, the field that rotates, and three judgement calls an engineer gets asked in an interview.", "sources": "Hughes & Drury, Electric Motors and Drives, 5th ed. §1.6–1.8, §2.2, §2.4, §5.2, §8.2, §9.3", "html": "<p>From memory: no notes, no lessons, no AI. A calculator is fine. One attempt per question, equation before the number. The app grades each answer as you go and brings the misses back in Review until you get them right on two different days. Some questions look like ones you have missed before; they are not the same, so read them to the end.<\/p>\n<section class=\"sec\" id=\"s-p1\"><h2>Part 1 · Battery to torque<\/h2>\n\n<div class=\"qa\" data-q=\"a1\"><\/div>\n\n<div class=\"qa\" data-q=\"a2\"><\/div>\n\n<div class=\"qa\" data-q=\"a3\"><\/div>\n\n<div class=\"qa\" data-q=\"a4\"><\/div>\n<p class=\"src\">Hughes §2.2.1–2.2.3, pp. 45–51; §2.4.1–2.4.3, pp. 62–73<\/p>\n<div class=\"qa\" data-q=\"a5\"><\/div>\n<p class=\"src\">Hughes §1.6–1.8, pp. 23–35<\/p>\n<\/section>\n<section class=\"sec\" id=\"s-p2\"><h2>Part 2 · The rotating field<\/h2>\n\n<div class=\"qa\" data-q=\"b1\"><\/div>\n\n<div class=\"qa\" data-q=\"b2\"><\/div>\n\n<div class=\"qa\" data-q=\"b3\"><\/div>\n\n<div class=\"qa\" data-q=\"b4\"><\/div>\n\n<div class=\"scene-ref\" data-scene='{&quot;phases&quot;: &quot;3&quot;, &quot;field&quot;: &quot;on&quot;, &quot;currents&quot;: &quot;on&quot;, &quot;vectors&quot;: &quot;on&quot;, &quot;labels&quot;: &quot;off&quot;, &quot;rotor&quot;: &quot;on&quot;, &quot;spin&quot;: &quot;off&quot;, &quot;delta&quot;: &quot;0&quot;, &quot;dq&quot;: &quot;on&quot;, &quot;caption&quot;: &quot;A fixed field and a rotor locked with \\u03b4 = 0: the d axis on the field arrow, zero torque.&quot;}'><button type=\"button\" class=\"btn ghost show-scene\">Show it in the motor<\/button><p>Locked rotor.<\/p><\/div>\n<p class=\"src\">Hughes §5.2, p. 165; §8.2.1–8.2.2, pp. 262–266; §9.3.2, p. 318<\/p>\n<\/section>\n<section class=\"sec\" id=\"s-p3\"><h2>Part 3 · Judgement<\/h2>\n\n<div class=\"qa\" data-q=\"c1\"><\/div>\n\n<div class=\"qa\" data-q=\"c2\"><\/div>\n\n<div class=\"qa\" data-q=\"c3\"><\/div>\n<p class=\"src\">Hughes §1.8.1–1.8.2, pp. 30–34; §2.4.3, p. 71<\/p>\n<\/section>\n<section class=\"sec\" id=\"s-close\"><h2>Close<\/h2>\n\n<div class=\"qa\" data-q=\"z0\"><\/div>\n\n<div class=\"qa\" data-q=\"z1\"><\/div>\n\n<\/section>", "questions": {"a1": {"kind": "case", "prompt": "<p>Quad on the stand, rear wheels in the air, motor turning steadily. You press a brake pad against the rear wheel, harder and harder. Run it twice. (A) The VESC is in duty mode, duty held fixed. (B) The VESC is in current mode, asking a fixed 20 A. In each case: what happens to speed and to motor current, and who decides the current?<\/p>", "key": ["(A) fixed duty = fixed average voltage: the brake slows the motor, E = λm·ωe drops, so I = (V − E)/R rises; the load decides the current", "(A) it settles at a slightly lower speed where Kt·I equals the brake torque (R is tiny, so the speed drop is small until the current limit)", "(B) the current loop holds 20 A, so torque stays at Kt·20 ≈ 1.5 N·m whatever the brake does; only the speed falls, possibly to zero", "(B) the controller (the throttle) decides the current, as long as there is voltage left over the back-EMF to push it"], "traps": ["\"the current is set by the torque demand\" in both cases: true only in (A) (his mistake #2)", "\"the current stays the same in (A)\": that is current mode, not voltage mode (his mistake #15)", "\"the battery decides the current\""], "solution": "<p>(A) With the duty fixed the average voltage is fixed. The brake slows the motor, the back-EMF falls, V − E grows and the current rises until Kt·I matches the brake: the load sets the current, and speed drops only a little because R = 28 mΩ is tiny. (B) In current mode the VESC holds 20 A, so the torque stays at 0.0758 × 20 ≈ 1.5 N·m. If the brake asks for more, nothing pushes back: the wheel slows down and stops. The controller sets the current, provided there is voltage left above the back-EMF.<\/p>", "prompt_text": "Quad on the stand, rear wheels in the air, motor turning steadily. You press a brake pad against the rear wheel, harder and harder. Run it twice. (A) The VESC is in duty mode, duty held fixed. (B) The VESC is in current mode, asking a fixed 20 A. In each case: what happens to speed and to motor current, and who decides the current?"}, "a2": {"kind": "calc", "prompt": "<p>Steep launch: the VESC holds the motor current at its 120 A limit (all on iq) while the motor turns at only 300 rpm. A friend expects the battery to give 120 × 3 = 360 A and the 40 A BMS to trip at once. Estimate the real battery current at 52 V, ignoring inverter losses.<\/p>", "key": ["ωm = 31.4 rad/s; torque 0.0758 × 120 = 9.1 N·m; mechanical power ≈ 286 W", "copper loss 1.5·Rs·I² = 1.5 × 0.028 × 120² ≈ 605 W", "electrical power ≈ 890 W, so Ibat ≈ 890 / 52 ≈ 17 A", "battery and phase current are linked by power, not by 3 or √3: at low speed and high torque, phase current ≫ battery current"], "traps": ["multiplying or dividing by 3 or √3 (his mistake #3 and #16)", "forgetting the copper loss, which here is twice the useful power", "taking the 28 mΩ as the battery resistance"], "solution": "<p>ωm = 300 · 2π/60 = 31.4 rad/s. Torque 9.1 N·m, so P_mech = 9.1 × 31.4 ≈ 286 W. Copper loss 1.5 × 0.028 × 120² ≈ 605 W. The battery supplies about 890 W: 890 / 52 ≈ 17 A. The inverter steps the voltage down (the motor needs only a couple of volts here) and the current up, like a gearbox for electricity. Power is what is conserved: Vbat·Ibat ≈ 1.5·(vq·iq). No factor of 3 or √3 links the two currents.<\/p>", "prompt_text": "Steep launch: the VESC holds the motor current at its 120 A limit (all on iq) while the motor turns at only 300 rpm. A friend expects the battery to give 120 × 3 = 360 A and the 40 A BMS to trip at once. Estimate the real battery current at 52 V, ignoring inverter losses."}, "a3": {"kind": "calc", "prompt": "<p>Wheels off, full throttle, no load. Your log from September: the motor settled at <strong>5480 rpm<\/strong> with <strong>iq = 1.88 A<\/strong>, duty at its 0.95 ceiling, battery 52.8 V. (1) What sets 5480 rpm? Compute the ideal no-load speed for a 30 V phase-voltage ceiling. (2) What sets 1.88 A? What torque does it make, and against what? (3) You raise the VESC motor current limit from 120 A to 160 A. Does either number change?<\/p>", "key": ["no-load speed is set by voltage: the motor accelerates until the back-EMF λm·ωe almost equals the voltage ceiling Vbus/√3 (× 0.95 max duty)", "ideal: ωe = 30 / 0.016855 ≈ 1780 rad/s, ωm = ωe/3 ≈ 593 rad/s ≈ 5670 rpm; with the 0.95 duty cap ≈ 5390 rpm at 52 V; measured 5480 rpm at 52.8 V fits", "no-load current is set by drag: Kt·iq = 0.0758 × 1.88 ≈ 0.14 N·m of bearing friction, viscous and iron losses", "the current limit changes neither: it only caps the torque at low speed; only bus voltage, λm (or field weakening, off) move the no-load speed"], "traps": ["\"the current limit or the controller sets the no-load current\"", "\"at no load the current is zero\": then there would be no torque against friction", "dividing by p in the wrong direction (ωm = ωe / p)"], "solution": "<p>(1) Voltage. The motor speeds up until λm·ωe nearly equals what the inverter can apply: 30 V / 0.016855 Wb ≈ 1780 rad/s electrical, /3 ≈ 593 rad/s ≈ 5670 rpm. The VESC caps duty at 0.95, which gives about 5390 rpm at 52 V; you measured 5480 rpm with the pack at 52.8 V. (2) Drag. At steady speed the motor torque equals the losses: 0.0758 × 1.88 ≈ 0.14 N·m (friction, viscous drag, iron losses). The current is whatever makes that torque. (3) No. The current limit only matters when the load asks for more than 120 A. To spin faster you need more voltage, less λm, or field weakening (off in your VESC).<\/p>", "prompt_text": "Wheels off, full throttle, no load. Your log from September: the motor settled at **5480 rpm** with **iq = 1.88 A**, duty at its 0.95 ceiling, battery 52.8 V. (1) What sets 5480 rpm? Compute the ideal no-load speed for a 30 V phase-voltage ceiling. (2) What sets 1.88 A? What torque does it make, and against what? (3) You raise the VESC motor current limit from 120 A to 160 A. Does either number change?"}, "a4": {"kind": "calc", "prompt": "<p>Phase U, high-side transistor ON, 40 A flowing into the U winding. The PWM switches that transistor OFF. Where does the 40 A go in the next microsecond? What would happen if the lower switch of that leg had no anti-parallel diode? Put a number on it: your L ≈ 106 µH, and imagine the current forced to zero in 100 ns.<\/p>", "key": ["the winding is an inductor: its current cannot jump (v = L·di/dt), so it keeps flowing in the same direction", "it freewheels through the diode across the low-side switch (phase pulled to the bus minus); in dead time the diode carries it on its own", "without the diode: v = L·di/dt = 106 µH × 40 A / 100 ns ≈ 42 kV: a spike that breaks the transistor", "the same diodes return current to the bus when braking (regeneration)"], "traps": ["\"the current stops when the switch opens\" (his answer on 3-Nov)", "\"the diode protects against reverse battery polarity\"", "\"the diode is there for shoot-through\""], "solution": "<p>The winding's current cannot stop instantly, so it keeps flowing into U. With the top switch off, its only path is up through the diode across the bottom switch: the phase sits at the bus minus and the current freewheels, decaying slowly. Without that diode, forcing 40 A to zero in 100 ns would take v = 106e-6 × 40 / 100e-9 ≈ 42 000 V: the switch would break down long before. The same diodes carry the current back to the bus when you brake.<\/p>", "prompt_text": "Phase U, high-side transistor ON, 40 A flowing into the U winding. The PWM switches that transistor OFF. Where does the 40 A go in the next microsecond? What would happen if the lower switch of that leg had no anti-parallel diode? Put a number on it: your L ≈ 106 µH, and imagine the current forced to zero in 100 ns."}, "a5": {"kind": "calc", "prompt": "<p>Climbing at <strong>3000 rpm<\/strong> with <strong>80 A<\/strong> of iq. Compute: peak back-EMF per phase, torque, mechanical power, copper loss, motor efficiency, and the battery current at 52 V. Then the engineering question: can your quad hold this point?<\/p>", "key": ["ωm = 314 rad/s; E = p·λm·ωm ≈ 15.9 V peak; T = 0.0758 × 80 ≈ 6.07 N·m", "P_mech ≈ 1906 W; copper 1.5 × 0.028 × 80² ≈ 269 W; η ≈ 88 %", "electrical ≈ 2175 W, so Ibat ≈ 42 A at 52 V", "above the 40 A battery limit (and the pack sags about 0.18 Ω × 40 A ≈ 7 V): the VESC battery limit will cut iq below 80 A; voltage is fine (≈ 18 V needed of 30 V)"], "traps": ["giving the efficiency without the numbers (his mistake #17)", "forgetting the 1.5 in the copper loss of three phases", "checking only the motor 120 A limit and not the 40 A battery limit"], "solution": "<p>ωm = 314 rad/s, E = 3 × 0.016855 × 314 ≈ 15.9 V, T ≈ 6.07 N·m, P_mech ≈ 1906 W, copper ≈ 269 W, η ≈ 88 %. The battery must give about 2175 W: 42 A at 52 V, more once the pack sags. That is over the 40 A battery limit, so the VESC trims iq and the quad slows on that hill. The motor limit (120 A) and the voltage (about 18 V needed against 30 V available) are not the problem; the battery is.<\/p>", "prompt_text": "Climbing at **3000 rpm** with **80 A** of iq. Compute: peak back-EMF per phase, torque, mechanical power, copper loss, motor efficiency, and the battery current at 52 V. Then the engineering question: can your quad hold this point?"}, "b1": {"kind": "check", "prompt": "<p>A different machine: only <strong>two<\/strong> coils, 90° apart around the bore. (1) Feed them with currents 90° apart in time, Î·cos ωt and Î·sin ωt. Does the field rotate? With what strength? (2) Now feed both with the same Î·cos ωt. What does the field do?<\/p>", "key": ["(1) it rotates: the two components are cos and sin of the same angle, so the sum is an arrow of constant length Î turning at ω", "(2) it pulsates on one fixed axis (45° between the coils), growing, vanishing and reversing", "rotation needs both shifts: in space and in time; three phases at 120° are one way, two at 90° another"], "traps": ["\"two coils cannot make a rotating field, you need three\"", "\"in-phase currents rotate because they alternate\""], "solution": "<p>(1) It rotates. One coil gives Î·cos ωt along x, the other Î·sin ωt along y: that is an arrow of length Î at angle ωt. It is exactly the α–β picture of Clarke. (2) Both components are always equal, so the arrow stays on the 45° line and only grows, shrinks and reverses: a pulsating field. Space shift alone is not enough; you need the time shift too.<\/p>", "prompt_text": "A different machine: only **two** coils, 90° apart around the bore. (1) Feed them with currents 90° apart in time, Î·cos ωt and Î·sin ωt. Does the field rotate? With what strength? (2) Now feed both with the same Î·cos ωt. What does the field do?"}, "b2": {"kind": "calc", "prompt": "<p>Quad at 30 km/h, wheel radius 0.155 m, gear 92/11. Motor speed in rpm? Electrical frequency of the phase currents? How many Hall edges per second does the VESC see (three sensors)? Then one line: a friend says a version of your motor with more pole pairs would run smoother. What does p really change?<\/p>", "key": ["wheel 8.33 / 0.155 ≈ 53.8 rad/s; motor × 8.364 ≈ 450 rad/s ≈ 4290 rpm", "fe = p·rpm/60 = 3 × 4290 / 60 ≈ 215 Hz", "each Hall toggles twice per electrical cycle, three sensors: 6 edges per cycle, ≈ 1290 edges/s", "more p: more torque per amp (Kt = 1.5·p·λm) and a higher electrical frequency at the same speed; smoothness comes from sinusoidal currents and the slot/winding design, not from p"], "traps": ["dividing by p instead of multiplying", "\"more pole pairs = smoother\" (his mistake #7)", "counting one edge per Hall per cycle"], "solution": "<p>8.33 m/s / 0.155 m = 53.8 rad/s at the wheel, × 8.364 = 450 rad/s ≈ 4290 rpm. fe = 3 × 4290 / 60 ≈ 215 Hz. Each Hall switches twice per electrical cycle; three of them give 6 states per cycle: about 1290 edges per second. More pole pairs buy torque per amp and raise the electrical frequency; smoothness comes from the waveform and the slots.<\/p>", "prompt_text": "Quad at 30 km/h, wheel radius 0.155 m, gear 92/11. Motor speed in rpm? Electrical frequency of the phase currents? How many Hall edges per second does the VESC see (three sensors)? Then one line: a friend says a version of your motor with more pole pairs would run smoother. What does p really change?"}, "b3": {"kind": "calc", "prompt": "<p>The VESC measures only two phases. At one sample it reads iU = 40 A and iV = −60 A. Find iW, then iα, iβ, the length of the current arrow and its angle. Why can it get away with two sensors?<\/p>", "key": ["iW = −iU − iV = 20 A (star point not connected, Kirchhoff)", "iα = iU = 40 A; iβ = (iV − iW)/√3 = −80/√3 ≈ −46.2 A", "length ≈ 61 A, angle ≈ −49°", "the third current carries no new information; a third sensor would only serve fault detection"], "traps": ["iβ = (iV + iW)/√3 instead of the difference", "forgetting that iW must close the sum"], "solution": "<p>iW = −(40 − 60) = 20 A. iα = 40 A, iβ = (−60 − 20)/√3 ≈ −46.2 A. Length √(40² + 46.2²) ≈ 61 A at −49°. With no neutral wire, iU + iV + iW = 0 always, so two sensors tell everything.<\/p>", "prompt_text": "The VESC measures only two phases. At one sample it reads iU = 40 A and iV = −60 A. Find iW, then iα, iβ, the length of the current arrow and its angle. Why can it get away with two sensors?"}, "b4": {"kind": "case", "prompt": "<p>The motor is stopped. The VESC holds a fixed current arrow, iα = 50 A, iβ = 0, and does not rotate it: a DC test current, nothing more. What current does each phase carry? What does the rotor do, and where does it end up? How many positions per mechanical turn could it end up in?<\/p>", "key": ["iU = 50 A, iV = iW = −25 A: steady DC, the stator field points along phase U", "torque ∝ sin δ: the rotor turns until a magnet's north (its d axis) lines up with the field, where δ = 0 and torque is zero", "it is a stable lock: push it off and the torque pulls it back", "three possible rest positions per mechanical turn (p = 3), 120° mechanical apart"], "traps": ["\"the rotor spins because there is current\"", "\"it stops at 90°, where torque is maximum\"", "\"one position per turn\": there are three north poles"], "solution": "<p>iU = 50 A and iV = iW = −25 A, all DC. The field points along U and does not move. The rotor turns until a north magnet sits on that axis: δ = 0, zero torque, and any push away creates a restoring torque, like a compass. With three north poles, it can lock at three places, 120° mechanical apart. That is how the VESC holds the rotor still while it measures R and L.<\/p>", "prompt_text": "The motor is stopped. The VESC holds a fixed current arrow, iα = 50 A, iβ = 0, and does not rotate it: a DC test current, nothing more. What current does each phase carry? What does the rotor do, and where does it end up? How many positions per mechanical turn could it end up in?"}, "c1": {"kind": "case", "prompt": "<p>A friend proposes a 14S pack instead of your 13S (one more cell in series, same capacity). \"More voltage, more torque: it will launch harder.\" What part is true? Give numbers for launch torque, no-load speed and top-end power. Is there anything that worries you about 14S with your VESC?<\/p>", "key": ["launch: no change; at low speed torque is limited by current (120 A → 9.1 N·m), there is voltage to spare", "no-load speed and the speed where torque starts to fall rise by 14/13 ≈ +7.7 % (≈ 5670 → 6100 rpm ideal)", "with the same 40 A battery limit, the power ceiling also rises ≈ 7.7 %", "risk: 14S full is 58.8 V against the VESC's 60 V maximum; regenerative braking on a full pack pushes the bus higher: little margin"], "traps": ["\"more voltage = more torque at launch\"", "forgetting the battery current limit sets the power ceiling", "not checking the inverter voltage rating"], "solution": "<p>Launch is the same: at low speed the 120 A limit sets the torque, not the voltage. What rises is everything at the top: the voltage ceiling grows by 14/13 ≈ 7.7 %, so no-load speed goes from about 5670 to 6100 rpm (ideal) and full torque holds to a higher speed; with the same 40 A battery limit, peak power also rises ~7.7 %. The worry: a full 14S pack is 58.8 V and the VESC is rated to 60 V; regen on a full pack lifts the bus above battery voltage, so you would be one braking event from the limit.<\/p>", "prompt_text": "A friend proposes a 14S pack instead of your 13S (one more cell in series, same capacity). \"More voltage, more torque: it will launch harder.\" What part is true? Give numbers for launch torque, no-load speed and top-end power. Is there anything that worries you about 14S with your VESC?"}, "c2": {"kind": "case", "prompt": "<p>After a hot afternoon you repeat the drill spin test and get λm = <strong>15.2 mWb<\/strong> instead of 16.855. Assume it is real (the magnets lost flux). What do you feel at launch with the same 120 A limit? What happens to no-load speed? The VESC still thinks λm is the old value: what is now wrong in what it believes?<\/p>", "key": ["λm down ≈ 10 %; Kt = 1.5 × 3 × 0.0152 ≈ 0.068 N·m/A; launch torque at 120 A ≈ 8.2 N·m instead of 9.1", "the current at launch is the same (current mode, and at start E = 0); only the torque per amp falls", "no-load speed rises ≈ 1/0.90: about 5670 → 6290 rpm ideal", "the VESC's flux estimate (used by its observer for position and speed) is now wrong; it should be re-detected"], "traps": ["\"with less field, more current flows at launch\" (his mistake #14: at start the current is the same, the force halves)", "\"the top speed falls with weaker magnets\""], "solution": "<p>λm fell about 10 %, so Kt falls to about 0.068 N·m/A: at the same 120 A, launch torque drops from 9.1 to about 8.2 N·m. The current is the same, because the VESC sets it. Back-EMF per rpm also falls 10 %, so the no-load speed rises to about 6290 rpm ideal: less force, more speed, the same trade as in L1. And the VESC's observer now works with a flux 10 % too high: re-run detection before trusting its speed and angle estimates.<\/p>", "prompt_text": "After a hot afternoon you repeat the drill spin test and get λm = **15.2 mWb** instead of 16.855. Assume it is real (the magnets lost flux). What do you feel at launch with the same 120 A limit? What happens to no-load speed? The VESC still thinks λm is the old value: what is now wrong in what it believes?"}, "c3": {"kind": "error", "prompt": "<p>A colleague explains your VESC: \"To make the negative half of the sine, the bottom transistor of each leg puts −52 V on the phase. To give the motor more voltage, the VESC raises the PWM frequency above 30 kHz. The diodes across the transistors are there only in case someone connects the battery backwards.\" Find every error.<\/p>", "key": ["a leg connects its phase to +52 V or to 0 V (battery minus), never to a negative voltage; the AC appears in the difference between phases and the star point", "the average voltage is set by the duty cycle (V̄ = D·Vbus); the frequency stays fixed at 30 kHz", "the diodes give the inductive phase current a path when a switch opens (freewheeling, dead time) and carry regenerative current back to the bus", "they do not protect against reverse polarity: a reversed battery would drive current straight through all of them"], "traps": ["accepting \"the phase goes negative\" (his mistake #6)", "\"PWM varies the frequency\" (his mistake #5)", "calling the diodes protection"], "solution": "<p>Three errors. (1) There is no −52 V anywhere: each leg switches its phase between +52 V and 0 V. The phase voltages only go negative relative to each other and to the star point. (2) The VESC changes the duty, not the frequency: V̄ = D·Vbus at a fixed 30 kHz. (3) The diodes are the freewheel and regeneration path for the winding current that cannot stop. With a reversed battery they would conduct and short it.<\/p>", "prompt_text": "A colleague explains your VESC: \"To make the negative half of the sine, the bottom transistor of each leg puts −52 V on the phase. To give the motor more voltage, the VESC raises the PWM frequency above 30 kHz. The diodes across the transistors are there only in case someone connects the battery backwards.\" Find every error."}, "z0": {"kind": "explain", "prompt": "<p>An interviewer asks: \"Take me from your battery to torque on the shaft.\" In at most 6 lines: battery → inverter → field → torque, with what limits it.<\/p>", "key": ["52 V DC; the inverter's three legs switch at 30 kHz and the duty sets the average voltage of each phase (V̄ = D·Vbus); the winding inductance smooths the current into near-sines", "three phases 120° apart in space, currents 120° apart in time: one field of constant strength that rotates, one pole pair per electrical cycle (p = 3)", "the magnets lock to it; the controller keeps the field 90° electrical ahead (all current on q) using the rotor angle, torque T = Kt·iq = 0.0758 N·m/A", "limits: current (120 A motor, 40 A battery) caps torque at low speed; voltage (30 V peak against back-EMF λm·ωe) caps speed"], "traps": ["empty phrases like \"the inverter manages the power\"", "leaving out what limits the chain"], "solution": "<p>The battery gives 52 V DC. The inverter's three legs switch it at 30 kHz; the duty of each leg sets its average voltage, and the winding inductance turns those pulses into nearly sinusoidal currents. Three phases sit 120° apart around the bore and carry currents 120° apart in time, so together they make one constant field that rotates, a third of a turn per electrical cycle in my p = 3 motor. The rotor magnets lock onto it; the VESC uses the rotor angle to keep the field 90° ahead, so T = Kt·iq with Kt = 0.0758 N·m/A. Current limits (120 A motor, 40 A battery) cap the torque at low speed; the 30 V voltage ceiling against the back-EMF caps the speed.<\/p>", "prompt_text": "An interviewer asks: \"Take me from your battery to torque on the shaft.\" In at most 6 lines: battery → inverter → field → torque, with what limits it."}, "z1": {"kind": "doubt", "prompt": "<p>What is still unclear after the exam? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors.<\/p>", "key": [], "traps": [], "solution": "", "prompt_text": "What is still unclear after the exam? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors."}}, "hasScene": true}, {"id": "C02-L2", "cycle": "C02", "title": "The field that rotates", "date": "2026-11-03", "minutes": "60", "lede": "Eighteen slots of copper that never move, three currents that only go up and down, and still a magnetic field that turns at constant strength and drags your rotor with it. This is the door to motor control.", "sources": "Hughes & Drury, Electric Motors and Drives, 5th ed. §1.3, §5.2, §8.2, §9.3", "html": "\n<section class=\"sec\" id=\"s-predict\"><h2>Predict<\/h2>\n<p>Two from L1 first, from memory: recalling costs more than rereading, which is why it sticks. Then two guesses about today, with your reason.<\/p>\n<div class=\"qa\" data-q=\"r1\"><\/div>\n\n<div class=\"qa\" data-q=\"r2\"><\/div>\n\n<div class=\"qa\" data-q=\"p1\"><\/div>\n\n<div class=\"qa\" data-q=\"p2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-core\"><h2>Core: six ideas on your motor<\/h2>\n<p>Each idea starts from the real part in your motor, then gives the law. On a wide screen the motor on the right follows the idea you are reading; on a phone, press the button.<\/p>\n<article class=\"idea\"><span class=\"n\">1<\/span><div><h3>Open your motor: steel, copper, magnets and a gap of air<\/h3>\n<p>Cut your motor in half like a sausage and look at the cut. From outside in: a <strong>stack of thin steel sheets<\/strong> (laminations, each about 0.35 mm, insulated from each other so eddy currents cannot circulate). Their inner edge is a comb: <strong>teeth<\/strong> and <strong>slots<\/strong>. In the slots sits the <strong>copper<\/strong> of the three phases. Then a thin ring of <strong>air<\/strong>: the air gap, under a millimetre in a motor this size. Then the <strong>rotor<\/strong>: another lamination stack with <strong>magnets buried inside it<\/strong>, small air pockets at their ends (<strong>flux barriers<\/strong>), and the shaft.<\/p>\n<p>Why a gap at all? The rotor must spin, so it cannot touch the stator. And that thin ring of air is the most important dimension in the machine: the flux from the magnets and from the copper has to jump it twice on every loop (out of one tooth, back into another), and air is about 2000 times harder for flux to cross than steel.<\/p>\n<div class=\"eq\">reluctance = length / (μ0 · μr · area)    μr: steel ≈ 2000, air = 1, magnet ≈ 1.05<\/div>\n<aside class=\"mine\"><span>In your motor<\/span>A magnet looks like air to the stator (μr ≈ 1). Flux that the stator pushes along the magnet axis (d axis) has to cross the magnet; flux pushed between magnets (q axis) goes through steel. Harder path, lower inductance: that is why your Ld = 99 µH is lower than your Lq = 113 µH.<\/aside>\n<div class=\"scene-ref\" data-scene='{&quot;phases&quot;: &quot;0&quot;, &quot;labels&quot;: &quot;on&quot;, &quot;field&quot;: &quot;off&quot;, &quot;currents&quot;: &quot;off&quot;, &quot;vectors&quot;: &quot;off&quot;, &quot;spin&quot;: &quot;off&quot;, &quot;rotor&quot;: &quot;on&quot;, &quot;endturns&quot;: &quot;true&quot;, &quot;caption&quot;: &quot;Turn it with the mouse. Labels on: find the teeth, the air gap, a buried magnet and its flux barrier.&quot;}'><button type=\"button\" class=\"btn ghost show-scene\">Show it in the motor<\/button><p>Labels on, no current.<\/p><\/div>\n\n<div class=\"qa\" data-q=\"i1\"><\/div>\n<p class=\"src\">Hughes §1.3, pp. 7–15 (magnetic circuit and air gap)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">2<\/span><div><h3>Three phases, three sines 120° apart, that always add to zero<\/h3>\n<p>Look at the slots of your motor going round: U+, W−, V+, U−, W+, V−, and the pattern repeats three times (once per pole pair). \"U−\" means the same U copper coming back the other way: a U coil goes down one slot and back up three slots later. Each phase owns 6 of the 18 slots.<\/p>\n<p>The three phase currents are the same sine, shifted by a third of a cycle. At every instant they add to zero: each wire is the return of the other two, so no neutral wire is needed.<\/p>\n<div class=\"eq\">iU + iV + iW = 0    iU = Î·cos ωt,  iV = Î·cos(ωt − 120°),  iW = Î·cos(ωt − 240°)<\/div>\n<div class=\"scene-ref\" data-scene='{&quot;phases&quot;: &quot;3&quot;, &quot;currents&quot;: &quot;on&quot;, &quot;field&quot;: &quot;off&quot;, &quot;labels&quot;: &quot;off&quot;, &quot;vectors&quot;: &quot;off&quot;, &quot;speed&quot;: &quot;0.08&quot;, &quot;rotor&quot;: &quot;on&quot;, &quot;caption&quot;: &quot;Copper glows with the size of its phase current. \\u2299 current comes towards you, \\u2297 goes away. Watch the \\u2299 group walk round.&quot;}'><button type=\"button\" class=\"btn ghost show-scene\">Show it in the motor<\/button><p>Currents on, slow.<\/p><\/div>\n\n<div class=\"qa\" data-q=\"i2\"><\/div>\n<p class=\"src\">Hughes §5.2.1, p. 165<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">3<\/span><div><h3>One phase pulses; three phases rotate<\/h3>\n<p>Feed only phase U. Each U slot pushes flux across the gap, but always at the same places: the field grows, dies and reverses, on fixed axes. It pulsates.<\/p>\n<p>Now feed all three. Each phase pushes along its own axis with its value at that instant, and the sum is one field pattern of constant strength, 1.5 times the peak of one phase, that turns at constant speed. It needs two shifts at once: 120° electrical in space (where the coils sit) and 120° in time (when each current peaks). Swap two wires and it turns the other way.<\/p>\n<div class=\"scene-ref\" data-scene='{&quot;phases&quot;: &quot;1&quot;, &quot;field&quot;: &quot;on&quot;, &quot;currents&quot;: &quot;on&quot;, &quot;labels&quot;: &quot;off&quot;, &quot;vectors&quot;: &quot;off&quot;, &quot;speed&quot;: &quot;0.15&quot;, &quot;rotor&quot;: &quot;off&quot;, &quot;caption&quot;: &quot;Only U. The arrows in the gap grow and shrink in place. Nothing travels.&quot;}'><button type=\"button\" class=\"btn ghost show-scene\">Show it in the motor<\/button><p>Only phase U.<\/p><\/div>\n\n<div class=\"scene-ref\" data-scene='{&quot;phases&quot;: &quot;3&quot;, &quot;field&quot;: &quot;on&quot;, &quot;currents&quot;: &quot;on&quot;, &quot;labels&quot;: &quot;off&quot;, &quot;vectors&quot;: &quot;off&quot;, &quot;speed&quot;: &quot;0.15&quot;, &quot;rotor&quot;: &quot;off&quot;, &quot;caption&quot;: &quot;U, V and W. Same arrows, now a pattern that travels round the gap at constant size.&quot;}'><button type=\"button\" class=\"btn ghost show-scene\">Show it in the motor<\/button><p>All three phases.<\/p><\/div>\n\n<div class=\"qa\" data-q=\"i3\"><\/div>\n<p class=\"src\">Hughes §5.2.2–5.2.3, §8.2.1, figs. 5.8 and 8.2<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">4<\/span><div><h3>An electrical turn is a third of a mechanical turn<\/h3>\n<p>Count the norths in the gap pattern: three, because your stator is wound for 3 pole pairs to match the 6 magnets. One electrical cycle of the currents moves the pattern by one north–south pair, which is a third of the circumference. So your currents must cycle three times for one turn of the shaft.<\/p>\n<div class=\"eq\">fe = p · rpm / 60    ωe = p·ωm    θe = p·θm<\/div>\n<div class=\"scene-ref\" data-scene='{&quot;phases&quot;: &quot;3&quot;, &quot;field&quot;: &quot;on&quot;, &quot;currents&quot;: &quot;off&quot;, &quot;vectors&quot;: &quot;on&quot;, &quot;labels&quot;: &quot;off&quot;, &quot;speed&quot;: &quot;0.15&quot;, &quot;rotor&quot;: &quot;on&quot;, &quot;delta&quot;: &quot;90&quot;, &quot;caption&quot;: &quot;Count the three norths. Follow one: it needs three electrical cycles to go all the way round.&quot;}'><button type=\"button\" class=\"btn ghost show-scene\">Show it in the motor<\/button><p>Field plus axes.<\/p><\/div>\n\n<div class=\"qa\" data-q=\"i4\"><\/div>\n\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">5<\/span><div><h3>The rotor follows the field like a compass needle<\/h3>\n<p>The buried magnets are another field. Like a compass needle, the rotor wants its north axis to point along the stator field. Torque depends on the angle δ between the two: zero when aligned, maximum at 90°, zero again at 180°.<\/p>\n<div class=\"eq\">T ∝ Φmagnet · Φstator · sin δ    in dq terms: all current on q, δ = 90°<\/div>\n<p>This is a synchronous motor: there is average torque only if the field turns exactly with the rotor. To hold δ at 90° the controller must know where the rotor is at every instant. In your motor, the three Hall sensors at the back (40° mechanical apart, which is 120° electrical) give that at start-up; then the VESC estimates it.<\/p>\n<div class=\"scene-ref\" data-scene='{&quot;phases&quot;: &quot;3&quot;, &quot;field&quot;: &quot;on&quot;, &quot;currents&quot;: &quot;off&quot;, &quot;vectors&quot;: &quot;on&quot;, &quot;labels&quot;: &quot;off&quot;, &quot;speed&quot;: &quot;0.12&quot;, &quot;rotor&quot;: &quot;on&quot;, &quot;delta&quot;: &quot;90&quot;, &quot;caption&quot;: &quot;Accent arrow: the stator field. Green arrow: a rotor north. Move \\u03b4 with the slider and watch the torque-per-amp readout.&quot;}'><button type=\"button\" class=\"btn ghost show-scene\">Show it in the motor<\/button><p>Move δ.<\/p><\/div>\n\n<div class=\"qa\" data-q=\"i5\"><\/div>\n<p class=\"src\">Hughes §9.3.2, p. 318; §9.5.1, pp. 342–344<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">6<\/span><div><h3>Clarke: three currents become one arrow, two numbers<\/h3>\n<p>Instead of following three currents, follow their effect: the field arrow of idea 3. Add the three phases along their axes and scale by ⅔, so the arrow is as long as one phase peak. The arrow lives in a plane, so two numbers are enough: α along phase U, β 90° ahead. It holds at every instant, transients included.<\/p>\n<div class=\"eq\">iα = iU (when the three add to zero)    iβ = (iV − iW) / √3<\/div>\n<div class=\"labbox\" data-lab=\"clarke\" data-title=\"Three currents become one arrow\"><\/div>\n\n<div class=\"qa\" data-q=\"i6\"><\/div>\n<p class=\"src\">Hughes §8.2.1–8.2.2, fig. 8.3, pp. 262–266<\/p>\n<\/div><\/article>\n<\/section>\n<section class=\"sec\" id=\"s-lab\"><h2>Lab: touch it<\/h2>\n<p>Write your prediction before you press. If it surprises you, say why in the same box.<\/p>\n<div class=\"qa\" data-q=\"l1\"><\/div>\n\n<div class=\"qa\" data-q=\"l2\"><\/div>\n\n<div class=\"labbox\" data-lab=\"hexagon\" data-title=\"The hexagon and the two circles\"><\/div>\n\n<div class=\"qa\" data-q=\"l3\"><\/div>\n<p class=\"src\">Hughes §2.4.3, p. 71; §8.6.1, pp. 287–290<\/p>\n<\/section>\n<section class=\"sec\" id=\"s-judgement\"><h2>Judgement<\/h2>\n<p>Reason from what you know is true, not from what sounds familiar.<\/p>\n<div class=\"qa\" data-q=\"c1\"><\/div>\n\n<div class=\"qa\" data-q=\"c2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-close\"><h2>Close<\/h2>\n\n<div class=\"qa\" data-q=\"z0\"><\/div>\n\n<div class=\"qa\" data-q=\"z1\"><\/div>\n\n<\/section>", "questions": {"r1": {"kind": "recall", "prompt": "<p>Same coil, same current (same MMF). You double the air gap. What happens to the flux density in the gap, roughly, and why?<\/p>", "key": ["B roughly halves", "almost all the MMF is spent crossing the gap, because air is thousands of times harder for flux than iron", "so the gap length sets B: B ≈ μ0·N·I / g"], "traps": ["\"the flux stays the same\" (the mistake he made in L1 k1)", "talking about the magnet flux \"of the rotor\" as fixed without the gap"], "solution": "<p>B falls to about half. Air is roughly 2000 times harder for flux to cross than iron, so nearly all of the coil's MMF (N·I) is used up in the gap: B ≈ μ0·N·I / g. Double g, half B. This is why motor gaps are as thin as the mechanics allow.<\/p>", "prompt_text": "Same coil, same current (same MMF). You double the air gap. What happens to the flux density in the gap, roughly, and why?"}, "r2": {"kind": "recall", "prompt": "<p>Your quad cruises on the flat with a fixed average voltage on the motor (throttle not moving, voltage mode). A hill starts. In order: what happens to speed, back-EMF and current? Where does it settle?<\/p>", "key": ["the extra load torque slows the motor: speed drops", "back-EMF E = λ·ω drops with speed", "with fixed V, current I = (V − E)/R rises because V − E grows", "more current gives more torque; it settles where motor torque equals the new load, at a lower speed"], "traps": ["\"the current stays the same\" (L1 c1 mistake): that is current mode, not voltage mode", "\"the back-EMF drops because the load rises\" without the speed link"], "solution": "<p>Speed drops, so back-EMF (E = λm·ω) drops, so the voltage left to push current (V − E) grows and the current rises. Torque rises with current until it matches the hill: a new balance at lower speed and higher current. In your VESC it is different: in current mode the throttle sets the amps, so on the hill the torque stays the same and only the speed falls.<\/p>", "prompt_text": "Your quad cruises on the flat with a fixed average voltage on the motor (throttle not moving, voltage mode). A hill starts. In order: what happens to speed, back-EMF and current? Where does it settle?"}, "p1": {"kind": "predict", "prompt": "<p>One coil fed with alternating current. Does its magnetic field rotate, or does it only change size and direction?<\/p>", "key": ["it does not rotate: it pulsates along one fixed axis (grows, goes to zero, reverses)", "rotation needs several coils displaced in space and fed with currents displaced in time"], "traps": ["\"it rotates because the current alternates\""], "solution": "<p>It does not rotate. It grows, falls to zero and reverses, always along the same axis: a pulsating field. Rotation needs coils spread around the bore and currents shifted in time (idea 3).<\/p>", "prompt_text": "One coil fed with alternating current. Does its magnetic field rotate, or does it only change size and direction?"}, "p2": {"kind": "predict", "prompt": "<p>Your motor has 6 magnets (3 pole pairs). If the stator field does one full electrical turn, how far does the rotor turn?<\/p>", "key": ["one third of a turn (120° mechanical)", "one electrical turn covers one N–S pair; with p = 3 a mechanical turn is 3 electrical turns: θe = p·θm"], "traps": [], "solution": "<p>A third of a turn. One electrical cycle moves the field by one north–south pair; your rotor has three pairs, so θe = 3·θm (idea 4).<\/p>", "prompt_text": "Your motor has 6 magnets (3 pole pairs). If the stator field does one full electrical turn, how far does the rotor turn?"}, "i1": {"kind": "calc", "prompt": "<p>Flux from one magnet crosses a 0.8 mm gap twice per loop and runs about 100 mm through steel with μr = 2000. Which part needs more MMF, and about how many times more? Same cross-section everywhere, for simplicity.<\/p>", "key": ["reluctance is proportional to length / μr", "air: 2 × 0.8 mm = 1.6 mm of air", "steel: 100 mm / 2000 = 0.05 mm of \"equivalent air\"", "the gap needs about 30 times more MMF than all the steel"], "traps": ["forgetting the gap is crossed twice", "saying the steel needs more because it is longer"], "solution": "<p>Gap: 2 × 0.8 = 1.6 mm of air. Steel: 100 mm / 2000 = 0.05 mm of equivalent air. The gap needs about 1.6 / 0.05 ≈ 32 times more MMF. The steel is a nearly free road; the gap is the toll.<\/p>", "prompt_text": "Flux from one magnet crosses a 0.8 mm gap twice per loop and runs about 100 mm through steel with μr = 2000. Which part needs more MMF, and about how many times more? Same cross-section everywhere, for simplicity."}, "i2": {"kind": "check", "prompt": "<p>At the instant iU is at its positive peak Î, what are iV and iW? Reason it, do not recall it.<\/p>", "key": ["both are −Î/2", "cos(−120°) = cos(−240°) = −½", "they add to zero with iU"], "traps": [], "solution": "<p>−Î/2 each: cos(−120°) = cos(−240°) = −½. Î − Î/2 − Î/2 = 0, as it must.<\/p>", "prompt_text": "At the instant iU is at its positive peak Î, what are iV and iW? Reason it, do not recall it."}, "i3": {"kind": "check", "prompt": "<p>What would happen if the three coils sat in the same slots, with the currents still 120° apart in time?<\/p>", "key": ["the three fields would be on the same axis", "they would add to zero at every instant, because iU + iV + iW = 0", "no field at all: the time shift is useless without the space shift"], "traps": [], "solution": "<p>Their fields would lie on the same axis and add to zero all the time, because the currents add to zero. No field. You need both shifts.<\/p>", "prompt_text": "What would happen if the three coils sat in the same slots, with the currents still 120° apart in time?"}, "i4": {"kind": "calc", "prompt": "<p>Your motor at 4000 rpm: what frequency do the phase currents have? How many 30 kHz PWM periods fit in one electrical cycle?<\/p>", "key": ["fe = 3 × 4000 / 60 = 200 Hz", "30 000 / 200 = 150 PWM periods per electrical cycle", "plenty to build a decent sine"], "traps": [], "solution": "<p>fe = 3 · 4000 / 60 = 200 Hz. 30 000 / 200 = 150 PWM periods per cycle: plenty for a smooth sine. Hughes counts poles (2p) and writes 120·f / poles: the same thing.<\/p>", "prompt_text": "Your motor at 4000 rpm: what frequency do the phase currents have? How many 30 kHz PWM periods fit in one electrical cycle?"}, "i5": {"kind": "calc", "prompt": "<p>The rotor position estimate is off by 30° electrical. How much torque do you lose per amp? And if it is off by 90°?<\/p>", "key": ["torque ∝ sin δ: with 30° error, δ = 60° or 120°, sin = 0.87: you lose about 13 %", "with 90° error, sin 0° = 0: no torque, all the current only heats the copper", "the rotor angle is the most critical measurement of the control"], "traps": [], "solution": "<p>sin 60° ≈ 0.87: about 13 % less torque per amp. With 90° of error, sin 0° = 0: zero torque and all the current goes into heat. That is why the rotor angle matters more than any other signal.<\/p>", "prompt_text": "The rotor position estimate is off by 30° electrical. How much torque do you lose per amp? And if it is off by 90°?"}, "i6": {"kind": "calc", "prompt": "<p>100 A peak currents at ωt = 120°. Compute iU, iV, iW, then iα, iβ, the length and the angle of the arrow. What does the result check?<\/p>", "key": ["iU = −50 A, iV = 100 A, iW = −50 A", "iα = −50 A, iβ = 150/√3 = 86.6 A", "length 100 A = the peak, angle 120° = ωt"], "traps": ["using sin instead of cos for the phases"], "solution": "<p>iU = −50 A, iV = 100 A, iW = −50 A, so iα = −50 A and iβ = 150/√3 = 86.6 A. Length 100 A, angle 120°. The arrow sits where the time says and is as long as the peak says.<\/p>", "prompt_text": "100 A peak currents at ωt = 120°. Compute iU, iV, iW, then iα, iβ, the length and the angle of the arrow. What does the result check?"}, "l1": {"kind": "lab", "prompt": "<p>In the motor: press \"U only\", then \"U, V, W\", with the gap field on. Before pressing: what do you expect in each case? Does the size of the biggest arrows change?<\/p>", "key": ["U only: the arrows grow and shrink in place, nothing travels (pulsating)", "U, V, W: the pattern travels round and the peak keeps the same size", "the peak with three phases is 1.5 times the peak of one"], "traps": [], "solution": "<p>U only: arrows grow and shrink without moving. Three phases: the pattern travels and the peak keeps its size, 1.5 times the single-phase peak.<\/p>", "prompt_text": "In the motor: press \"U only\", then \"U, V, W\", with the gap field on. Before pressing: what do you expect in each case? Does the size of the biggest arrows change?"}, "l2": {"kind": "lab", "prompt": "<p>Press \"Swap V and W\". Predict first: what changes in the field, and what would the quad do if you swapped two motor wires on the real VESC?<\/p>", "key": ["the field turns the other way", "the motor runs backwards for the same command", "on a real VESC the detection or direction setting fixes it; Hall order must match"], "traps": [], "solution": "<p>The field reverses direction, so the motor spins the other way for the same command. On the real quad you either swap back or invert the direction in the VESC; the Hall sensor order must match the phase order or start-up fails.<\/p>", "prompt_text": "Press \"Swap V and W\". Predict first: what changes in the field, and what would the quad do if you swapped two motor wires on the real VESC?"}, "l3": {"kind": "lab", "prompt": "<p>Bus at 52 V. Raise the asked voltage until the arrow turns red, at 0° and at 30°. Where can you go further? Why is only the circle usable if you want sine currents?<\/p>", "key": ["the corners (0°, 60°…) reach further than the middle of the sides (30°…)", "only the inscribed circle, radius Vbus/√3 = 30 V, is reachable at every angle", "following the hexagon would change the arrow length as it turns: not a sine, harmonics and torque ripple"], "traps": [], "solution": "<p>At the corners you reach 34.7 V, between them only 30 V. For a sine the arrow must keep its length all the way round, so only the inscribed circle counts: Vbus/√3 = 30.0 V peak with your 52 V bus, 15 % more than the 26 V of sine PWM.<\/p>", "prompt_text": "Bus at 52 V. Raise the asked voltage until the arrow turns red, at 0° and at 30°. Where can you go further? Why is only the circle usable if you want sine currents?"}, "c1": {"kind": "case", "prompt": "<p>Phase W breaks open: iW = 0, so iV = −iU. What does the current arrow do? Does it rotate? What happens to a motor at standstill trying to start like this? And to one already running?<\/p>", "key": ["iα = iU and iβ = −iU/√3: the arrow stays on one line and only changes length and sign", "it pulsates, like a single phase", "at standstill: no average torque, it does not know which way to go, it only vibrates", "already running: a pulsating field is two half fields turning opposite ways; the one turning with the rotor still gives torque, so it can keep running with less torque and strong ripple at twice the electrical frequency"], "traps": [], "solution": "<p>iα = iU, iβ = −iU/√3: the arrow stays on one line (at −30°) and only grows, shrinks and reverses. It pulsates. Stopped: zero average torque, so it does not start, it vibrates. Running: the pulsating field splits into two half-fields turning opposite ways; the forward one keeps giving torque, so it keeps running with less torque and ripple at twice the electrical frequency.<\/p>", "prompt_text": "Phase W breaks open: iW = 0, so iV = −iU. What does the current arrow do? Does it rotate? What happens to a motor at standstill trying to start like this? And to one already running?"}, "c2": {"kind": "error", "prompt": "<p>A colleague says: \"Clarke turns three currents into two numbers, so it loses information. That is why the inverter has to measure all three phases.\" Where is he wrong?<\/p>", "key": ["in a star motor with no neutral connected, iU + iV + iW = 0 always (Kirchhoff at the star point)", "the third current is not new information: it follows from the other two", "Clarke loses nothing; two sensors are enough", "a third sensor is useful for fault detection: if the sum is not zero, something is wrong"], "traps": [], "solution": "<p>With the star point not connected, Kirchhoff forces iU + iV + iW = 0. The third current carries no new information, so Clarke loses nothing and two current sensors are enough. A third one is for fault detection: if the sum is not zero, something leaks.<\/p>", "prompt_text": "A colleague says: \"Clarke turns three currents into two numbers, so it loses information. That is why the inverter has to measure all three phases.\" Where is he wrong?"}, "z0": {"kind": "explain", "prompt": "<p>Explain it as you would to an interviewer, in at most 5 lines: how do 18 slots of copper that never move, with currents that only go up and down, make a field that turns, and what does your rotor do with it?<\/p>", "key": ["three phases displaced 120° in space and fed 120° apart in time", "each pulsates on its axis; the sum is one field of constant size that rotates", "p = 3: the field turns once per three electrical cycles", "the magnets lock to it like a compass; torque ∝ sin δ, maximum at 90°, so the controller needs the rotor angle"], "traps": [], "solution": "<p>Three phases sit 120° apart (electrical) around the bore and carry currents 120° apart in time. Each one alone only pulsates; together they make one field of constant strength that rotates, one pole pair per electrical cycle, so a third of a turn per cycle in my p = 3 motor. The rotor magnets lock onto it like a compass; torque is maximum when the field leads the rotor by 90°, which is why the controller must know the rotor angle.<\/p>", "prompt_text": "Explain it as you would to an interviewer, in at most 5 lines: how do 18 slots of copper that never move, with currents that only go up and down, make a field that turns, and what does your rotor do with it?"}, "z1": {"kind": "doubt", "prompt": "<p>What is still unclear? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors.<\/p>", "key": [], "traps": [], "solution": "", "prompt_text": "What is still unclear? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors."}}, "hasScene": true}, {"id": "C03-EX", "cycle": "C03", "title": "C03 exam: dq, limits and the current loop", "date": "2026-11-12", "slot": "1", "minutes": "45", "lede": "Forty-five minutes, from memory, on your own quad. Sit on the rotor, draw the three walls, close the current loop, pull a number out of a log, and three judgement calls an interviewer would ask.", "sources": "Hughes & Drury, Electric Motors and Drives, 5th ed. §8.2.2 pp. 266–267, §8.6.1 pp. 287–290, §9.5.1 pp. 342–344, §9.5.2 pp. 345–349, §9.6.3 pp. 358–360 · Åström & Murray, Feedback Systems 2e, §9.5 pp. 9-27–9-28, §11.4 pp. 11-15–11-17 · Franklin, Powell & Emami-Naeini 8e, §3.3 Fig. 3.14, §3.4.1 eq. (3.68) · 04_model/params/motor_params.m (VESC dq equations, PI form and gains)", "html": "<p>From memory: no notes, no lessons, no AI. A calculator is fine. One attempt per question, equation before the number, units on every number. The app grades each answer as you go and brings the misses back in Review until you get them right on two different days. Several questions look like ones from the lessons; the numbers and the twist are new, so read each one to the end.<\/p>\n<section class=\"sec\" id=\"s-p1\"><h2>Part 1 · Park and dq<\/h2>\n\n<div class=\"qa\" data-q=\"a1\"><\/div>\n\n<div class=\"qa\" data-q=\"a2\"><\/div>\n\n<div class=\"qa\" data-q=\"a3\"><\/div>\n\n<div class=\"qa\" data-q=\"a4\"><\/div>\n\n<div class=\"scene-ref\" data-scene='{&quot;phases&quot;: &quot;3&quot;, &quot;field&quot;: &quot;on&quot;, &quot;currents&quot;: &quot;off&quot;, &quot;vectors&quot;: &quot;on&quot;, &quot;dq&quot;: &quot;on&quot;, &quot;labels&quot;: &quot;off&quot;, &quot;rotor&quot;: &quot;on&quot;, &quot;spin&quot;: &quot;on&quot;, &quot;speed&quot;: &quot;0.1&quot;, &quot;delta&quot;: &quot;70&quot;, &quot;caption&quot;: &quot;Angle 20\\u00b0 behind: the stator field sits 70\\u00b0 from the magnet instead of 90\\u00b0. Part of the current lies on d and pulls nothing.&quot;}'><button type=\"button\" class=\"btn ghost show-scene\">Show it in the motor<\/button><p>Angle error seen from the rotor.<\/p><\/div>\n<p class=\"src\">Hughes §8.2.2, pp. 266–267 (rotating frame sees a constant phasor); §9.5.1, pp. 342–344 (torque from the current at right angles to the magnet flux); dq equations as quoted in 04_model/params/motor_params.m<\/p>\n<\/section>\n<section class=\"sec\" id=\"s-p2\"><h2>Part 2 · Limits and the id–iq plane<\/h2>\n\n<div class=\"qa\" data-q=\"b1\"><\/div>\n\n<div class=\"qa\" data-q=\"b2\"><\/div>\n\n<div class=\"qa\" data-q=\"b3\"><\/div>\n<p class=\"src\">Hughes §8.6.1, pp. 287–290 (SVPWM, Vbus/√3); §9.5.2, pp. 345–349 (base speed set by inverter voltage; field weakening costs current); §9.6.3, pp. 358–360 (overvoltage on loss of control)<\/p>\n<\/section>\n<section class=\"sec\" id=\"s-p3\"><h2>Part 3 · The current loop<\/h2>\n\n<div class=\"qa\" data-q=\"c1\"><\/div>\n\n<div class=\"qa\" data-q=\"c2\"><\/div>\n\n<div class=\"qa\" data-q=\"c3\"><\/div>\n\n<div class=\"qa\" data-q=\"c4\"><\/div>\n<p class=\"src\">Franklin, Powell &amp; Emami-Naeini 8e, §3.3 Fig. 3.14 (first-order time constant), §3.4.1 eq. (3.68) (rise time); Åström &amp; Murray §9.5, pp. 9-27–9-28 (PI by pole/zero cancellation); §11.4, pp. 11-15–11-17 (windup and anti-windup); VESC PI form and gains in 04_model/params/motor_params.m<\/p>\n<\/section>\n<section class=\"sec\" id=\"s-p4\"><h2>Part 4 · From model to data<\/h2>\n\n<div class=\"qa\" data-q=\"d1\"><\/div>\n\n<div class=\"qa\" data-q=\"d2\"><\/div>\n<p class=\"src\">04_model/params/motor_params.m (λm by scope 16.855 mWb, no-load telemetry route, |v_dq| = duty·Vbus/√3); C03-LM (log_017 result, ±5 % spread)<\/p>\n<\/section>\n<section class=\"sec\" id=\"s-p5\"><h2>Part 5 · Judgement<\/h2>\n\n<div class=\"qa\" data-q=\"e1\"><\/div>\n\n<div class=\"qa\" data-q=\"e2\"><\/div>\n\n<div class=\"qa\" data-q=\"e3\"><\/div>\n<p class=\"src\">Åström &amp; Murray §9.5, pp. 9-27–9-28 (slow disturbance response of a cancellation design); §11.4, pp. 11-15–11-17; Hughes §9.5.2, p. 345 (voltage sets base speed)<\/p>\n<\/section>\n<section class=\"sec\" id=\"s-close\"><h2>Close<\/h2>\n\n<div class=\"qa\" data-q=\"z0\"><\/div>\n\n<div class=\"qa\" data-q=\"z1\"><\/div>\n\n<\/section>", "questions": {"a1": {"kind": "calc", "prompt": "<p>One sample from your VESC: iU = −13.9 A, iV = 75.2 A. The rotor's d axis is at θe = 40° electrical. Find iW, iα, iβ, then id and iq. How much torque does this make, and how much would the same 80 A make if it all sat on q?<\/p>", "key": ["iW = −iU − iV = −61.3 A; iα = iU = −13.9 A; iβ = (iV − iW)/√3 = 136.5/√3 ≈ 78.8 A (arrow ≈ 80 A at 100°)", "id = iα·cos 40° + iβ·sin 40° ≈ +40.0 A; iq = −iα·sin 40° + iβ·cos 40° ≈ 69.3 A (length still 80 A)", "the current sits 60° electrical ahead of the magnet, not 90°: part of it strengthens the flux instead of pulling", "Te = 1.5·3·(λm + (Ld − Lq)·id)·iq = 4.5 × (16.855 − 0.54) mWb × 69.3 ≈ 5.09 N·m, against 0.0758 × 80 ≈ 6.07 N·m all on q (−16 %)"], "traps": ["sign slip in iq: it is −iα·sin θe and iα is negative here", "iβ = (iV + iW)/√3 instead of the difference", "forgetting that with Ld < Lq a positive id also removes a little reluctance torque"], "solution": "<p>iW = −61.3 A, iα = −13.9 A, iβ = 78.8 A: an 80 A arrow at 100°. With the d axis at 40°, the current is 60° ahead of the magnet: id = +40.0 A, iq = 69.3 A. Torque = 4.5 × (0.016855 − 13.54e-6 × 40) × 69.3 ≈ 5.09 N·m. The same 80 A on q would give 6.07 N·m. The 40 A on d heat the copper and push the magnet's flux up; they pull nothing.<\/p>", "prompt_text": "One sample from your VESC: iU = −13.9 A, iV = 75.2 A. The rotor's d axis is at θe = 40° electrical. Find iW, iα, iβ, then id and iq. How much torque does this make, and how much would the same 80 A make if it all sat on q?"}, "a2": {"kind": "calc", "prompt": "<p>VESC Tool's realtime page shows <strong>9000 ERPM<\/strong>. What is the motor shaft speed in rpm, the electrical frequency, ωe, and the peak phase back-EMF? At a control period of 15 kHz and of 30 kHz (your build is still unconfirmed), how many control periods fit in one electrical cycle, and how many degrees does the rotor turn, electrical and mechanical, between two of them?<\/p>", "key": ["ERPM is electrical: rpm = 9000 / p = 3000 rpm at the shaft; fe = 9000/60 = 150 Hz; ωe = 942 rad/s", "E = ωe·λm = 942 × 0.016855 ≈ 15.9 V peak phase", "15 kHz: 100 periods per cycle, 3.6° electrical = 1.2° mechanical per period; 30 kHz: 200 periods, 1.8° electrical = 0.6° mechanical", "the angle the VESC uses in Park and inverse Park is already up to one period old: the error grows with speed"], "traps": ["multiplying ERPM by 3 (27 000 rpm): ERPM is already p times the shaft speed (his electrical vs mechanical slips)", "using ωm = 314 rad/s in the back-EMF (gives 5.3 V)", "mixing electrical and mechanical degrees in the last part"], "solution": "<p>9000 ERPM / 3 = 3000 rpm. fe = 150 Hz, ωe = 942 rad/s, E = 15.9 V peak phase. At 15 kHz the VESC runs 100 times per electrical cycle, and between two runs the rotor turns 3.6° electrical, which is 1.2° mechanical. At 30 kHz it is 200 runs and 1.8° (0.6° mechanical). Electrical is what Park cares about.<\/p>", "prompt_text": "VESC Tool's realtime page shows **9000 ERPM**. What is the motor shaft speed in rpm, the electrical frequency, ωe, and the peak phase back-EMF? At a control period of 15 kHz and of 30 kHz (your build is still unconfirmed), how many control periods fit in one electrical cycle, and how many degrees does the rotor turn, electrical and mechanical, between two of them?"}, "a3": {"kind": "calc", "prompt": "<p>Climbing at <strong>3000 rpm<\/strong> with id = 0, iq = <strong>70 A<\/strong>, steady state. Compute vd, vq and |v|. Then the electrical power into the motor and the battery current at 52 V (ideal inverter). Your friend says \"70 A in each phase, so the battery gives 3 × 70 = 210 A\". Answer him in one line.<\/p>", "key": ["ωe = 942 rad/s; vd = −ωe·Lq·iq = −942 × 112.77 µH × 70 ≈ −7.44 V; vq = Rs·iq + ωe·λm = 1.96 + 15.89 ≈ 17.85 V; |v| ≈ 19.3 V (< 30 V, fits)", "P = 1.5·(vd·id + vq·iq) = 1.5 × 17.85 × 70 ≈ 1874 W (vd does no work because id = 0)", "check: shaft 5.31 N·m × 314 rad/s ≈ 1668 W plus copper 1.5 × 0.028 × 70² ≈ 206 W = 1874 W", "Ibat ≈ 1874 / 52 ≈ 36 A, just under the 40 A battery limit", "phase and battery current are linked by power, never by 3 or √3"], "traps": ["3 × 70 or 70 × √3 for the battery current (his mistake #3 and #16)", "forgetting the 1.5 of the amplitude-invariant transform in the power", "using |v|·|i| instead of vd·id + vq·iq", "using mechanical ω in the back-EMF"], "solution": "<p>ωe = 942 rad/s. vd = −7.44 V (cross-coupling), vq = 1.96 + 15.89 = 17.85 V, |v| = 19.3 V. P = 1.5 × 17.85 × 70 ≈ 1874 W: 1668 W to the shaft and 206 W of copper. Ibat = 1874/52 ≈ 36 A. To the friend: the inverter conserves power, not amps; 70 A at about 18 V on the motor side is 36 A at 52 V on the battery side.<\/p>", "prompt_text": "Climbing at **3000 rpm** with id = 0, iq = **70 A**, steady state. Compute vd, vq and |v|. Then the electrical power into the motor and the battery current at 52 V (ideal inverter). Your friend says \"70 A in each phase, so the battery gives 3 × 70 = 210 A\". Answer him in one line."}, "a4": {"kind": "case", "prompt": "<p>You remounted the Hall board after a repair and did not re-run detection. At 2000 rpm the quad feels weaker. VESC Tool shows <strong>Iq = 40 A, Id = 0<\/strong>, as asked. Suppose the angle the VESC uses is 20° electrical <strong>behind<\/strong> the real rotor. What are the real id, iq and torque? Why do the Id/Iq plots look perfect, and which logged signal would give the fault away?<\/p>", "key": ["real id = −I·sin ε = +40·sin 20° ≈ +13.7 A, real iq = 40·cos 20° ≈ 37.6 A", "torque = 4.5 × (16.855 − 0.185) mWb × 37.6 ≈ 2.82 N·m against 3.03 N·m expected (−7 %); positive id makes the reluctance term subtract", "the VESC computes Id and Iq with its own (wrong) angle, so in its frame they read exactly what it asked: the error is invisible in the current plots", "what gives it away: the voltage vector does not match the model (|v| ≈ 12.7 V against ≈ 12.0 V predicted at 2000 rpm, 40 A), more battery current for the same acceleration; fix: re-run Hall detection"], "traps": ["\"Id would show the error\": no, it is measured in the wrong frame", "wrong sign: an angle behind gives positive id, ahead gives negative id", "electrical vs mechanical: 20° electrical is only 6.7° mechanical of Hall board misalignment"], "solution": "<p>Real id = +13.7 A, real iq = 37.6 A, torque ≈ 2.82 N·m instead of 3.03 (−7 %), and the positive id even costs a little reluctance torque. VESC Tool shows Iq = 40 A and Id = 0 because it builds both with the same wrong angle. Look at what the angle error cannot hide: the dq voltages. At 2000 rpm and 40 A your model needs |v| ≈ 12.0 V; the misaligned motor needs ≈ 12.7 V, and more battery amps for the same pull. Re-run Hall detection. A 20° electrical error is only 6.7° of mechanical misalignment of the board.<\/p>", "prompt_text": "You remounted the Hall board after a repair and did not re-run detection. At 2000 rpm the quad feels weaker. VESC Tool shows **Iq = 40 A, Id = 0**, as asked. Suppose the angle the VESC uses is 20° electrical **behind** the real rotor. What are the real id, iq and torque? Why do the Id/Iq plots look perfect, and which logged signal would give the fault away?"}, "b1": {"kind": "calc", "prompt": "<p>Pulling away: <strong>1000 rpm<\/strong>, iq = <strong>120 A<\/strong>, id = 0, battery at 52 V. A forum post says \"120 A × √3 = 208 A from the battery: your 40 A BMS trips at once\". Compute vd, vq, the electrical power, how it splits between shaft and copper, and the real battery current. Which wall holds you here?<\/p>", "key": ["ωe = 314 rad/s; vd = −ωe·Lq·iq ≈ −4.25 V; vq = 0.028 × 120 + 314 × 0.016855 = 3.36 + 5.30 ≈ 8.66 V", "P = 1.5 × 8.66 × 120 ≈ 1558 W: shaft 9.10 N·m × 104.7 rad/s ≈ 953 W, copper 1.5 × 0.028 × 120² ≈ 605 W", "Ibat ≈ 1558 / 52 ≈ 30 A: below 40 A", "the 120 A current circle is the wall at 1000 rpm; the battery reaches 40 A only near 1550 rpm (≈ 11 km/h)"], "traps": ["× √3 or × 3 between phase and battery current (his mistakes #3 and #16)", "forgetting copper loss, which here is 40 % of the input", "calling the 40 A battery limit a circle on the id–iq plane: it is a power limit"], "solution": "<p>ωe = 314 rad/s, vd = −4.25 V, vq = 8.66 V. P = 1.5 × 8.66 × 120 ≈ 1558 W, of which 953 W reaches the shaft and 605 W heats the copper. Battery: 1558/52 ≈ 30 A. At 1000 rpm the motor needs only about 9 V, so 120 A on the motor side costs 30 A on the battery side. The 120 A circle is the wall; the battery wall arrives a bit later, near 11 km/h.<\/p>", "prompt_text": "Pulling away: **1000 rpm**, iq = **120 A**, id = 0, battery at 52 V. A forum post says \"120 A × √3 = 208 A from the battery: your 40 A BMS trips at once\". Compute vd, vq, the electrical power, how it splits between shaft and copper, and the real battery current. Which wall holds you here?"}, "b2": {"kind": "calc", "prompt": "<p>Half-charged pack resting at <strong>48 V<\/strong>. With the 0.95 duty cap, compute the voltage ceiling, the no-load speed (rpm and km/h: 92/11, wheel 0.155 m) and the corner speed for (0, 120 A) without Rs. Which way does Rs move the corner? Then: would raising the motor current limit to 140 A give you more top speed?<\/p>", "key": ["Vmax = 0.95 × 48/√3 ≈ 26.3 V (against 28.5 V at 52 V)", "no-load: ωe = 26.3 / 0.016855 ≈ 1562 rad/s → 521 rad/s → ≈ 4970 rpm ≈ 34.7 km/h (≈ 5390 rpm at 52 V)", "corner without Rs: ωe = Vmax / √(λm² + (Lq·120)²) = 26.3 / 0.0216 ≈ 1218 rad/s → ≈ 3880 rpm (≈ 27 km/h); Rs eats 3.4 V of vq and pulls it down to ≈ 3480 rpm (≈ 24 km/h)", "no: top speed is set by voltage against back-EMF; a higher current limit only lifts torque below the corner"], "traps": ["comparing the 48 V bus directly with the phase back-EMF (forgetting √3 and the 0.95)", "dividing by p in the wrong direction", "\"more current, more speed\": speed comes from voltage, current gives torque (his fixed-voltage vs current confusion, #2 and #15)", "adding λm·ωe and Lq·iq·ωe as scalars instead of in quadrature"], "solution": "<p>Vmax = 26.3 V. No-load speed: 1562 rad/s electrical, 521 mechanical, about 4970 rpm or 34.7 km/h: the top speed falls almost in proportion to the bus. Corner: |ψ| = √(16.86² + 13.53²) mWb = 21.6 mWb, so 1218 rad/s, ≈ 3880 rpm; with the 3.4 V of Rs·iq it drops to ≈ 3480 rpm. A 140 A limit changes neither number: it only lifts the top of the current circle.<\/p>", "prompt_text": "Half-charged pack resting at **48 V**. With the 0.95 duty cap, compute the voltage ceiling, the no-load speed (rpm and km/h: 92/11, wheel 0.155 m) and the corner speed for (0, 120 A) without Rs. Which way does Rs move the corner? Then: would raising
