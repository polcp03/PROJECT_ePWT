 the motor current limit to 140 A give you more top speed?"}, "b3": {"kind": "calc", "prompt": "<p>Someone enables field weakening at <strong>id = −50 A<\/strong> and keeps |i| = 120 A. (1) What iq is left and what torque? (2) With iq ≈ 0, what is the no-load speed at 30 V now? (3) At that speed the controller trips: what peak back-EMF does the magnet alone produce, phase and line-to-line, against your 52 V bus? (4) Why can field weakening in your motor never reach \"zero flux\"?<\/p>", "key": ["iq = √(120² − 50²) ≈ 109.1 A; Te = 4.5 × (16.855 + 13.54e-3 × 50) mWb × 109.1 ≈ 8.61 N·m (vs 9.10 at id = 0)", "flux on d = λm + Ld·id = 16.855 − 4.96 ≈ 11.9 mWb; no-load ωe = 30 / 0.0119 ≈ 2520 rad/s ≈ 8030 rpm (vs 5670)", "at 8030 rpm the magnet alone gives λm·ωe ≈ 42.5 V peak phase, ≈ 73.6 V line-to-line: far above 52 V, the diodes rectify it into the battery (uncontrolled braking, bus overvoltage, beyond the VESC's 60 V)", "the ellipse centre is at −λm/Ld ≈ −170 A, outside the 120 A circle: the current limit stops you before the flux is cancelled"], "traps": ["the sign: negative id weakens the flux; positive strengthens it", "\"field weakening adds power\": it trades current (and heat) for speed", "forgetting that on a trip the magnet flux is back at full strength instantly"], "solution": "<p>(1) iq = 109.1 A, torque ≈ 8.61 N·m: 5 % less for the same amps, the reluctance bonus is tiny. (2) The d-axis flux drops to 11.9 mWb, so 30 V reaches ≈ 2520 rad/s, about 8030 rpm. (3) If the VESC trips there, id vanishes and the full 16.855 mWb returns: 42.5 V peak phase, 73.6 V line-to-line, against a 52 V bus and a 60 V inverter. The diodes conduct, current flows into the pack with nobody controlling it. (4) Cancelling λm needs id = −170 A, beyond the 120 A circle.<\/p>", "prompt_text": "Someone enables field weakening at **id = −50 A** and keeps |i| = 120 A. (1) What iq is left and what torque? (2) With iq ≈ 0, what is the no-load speed at 30 V now? (3) At that speed the controller trips: what peak back-EMF does the magnet alone produce, phase and line-to-line, against your 52 V bus? (4) Why can field weakening in your motor never reach \"zero flux\"?"}, "c1": {"kind": "calc", "prompt": "<p>After a long hill the winding is hot: Rs is 25 % above your measured value. Rotor locked, current loop OFF, you apply <strong>vq = 2 V<\/strong> as a step. Final iq? Time constant τq? How long until iq reaches 50 A? Compare the final current with a cold motor. What does that say about controlling torque by fixing the voltage?<\/p>", "key": ["hot Rs = 1.25 × 28.02 ≈ 35.0 mΩ; final iq = 2 / 0.035 ≈ 57.1 A (cold: 71.4 A)", "τq = Lq/Rs = 112.77 µH / 35.0 mΩ ≈ 3.22 ms (cold: 4.02 ms)", "t(50 A) = −τ·ln(1 − 50/57.1) ≈ 3.22 ms × 2.09 ≈ 6.7 ms", "with fixed voltage the current (and torque) is set by R, which moves with temperature (0.39 %/K), and once turning by the back-EMF: −20 % torque here for the same command. A current loop removes that dependence"], "traps": ["\"τ is the same because L did not change\": τ = L/R falls when R rises", "forgetting milli: 2/35 = 57 mA", "\"a fixed voltage gives a fixed current\" (his mistakes #2 and #15)"], "solution": "<p>Hot Rs ≈ 35.0 mΩ: iq → 57.1 A with τq ≈ 3.22 ms, and 50 A after about 6.7 ms. A cold motor would settle at 71.4 A. Same 2 V, 20 % less torque, only from temperature, and it gets worse as soon as the rotor turns and the back-EMF subtracts. That is why the VESC regulates current, not voltage: the loop finds whatever voltage gives the asked amps.<\/p>", "prompt_text": "After a long hill the winding is hot: Rs is 25 % above your measured value. Rotor locked, current loop OFF, you apply **vq = 2 V** as a step. Final iq? Time constant τq? How long until iq reaches 50 A? Compare the final current with a cold motor. What does that say about controlling torque by fixing the voltage?"}, "c2": {"kind": "calc", "prompt": "<p>Imagine your VESC ran a <strong>P controller only<\/strong>, Kp = 0.2119 V/A, no integrator, no feed-forward. (1) Rotor locked, iq_ref = 60 A: steady iq and error? (2) Same request at 3000 rpm: steady iq? (3) Now add back-EMF feed-forward using the λm the VESC believes, 15.919 mWb: what voltage error is left at 3000 rpm and what does it do with P only? What removes it?<\/p>", "key": ["(1) steady state vq = Kp·(60 − iq) = Rs·iq → iq = Kp·60/(Kp + Rs) ≈ 53.0 A; error ≈ 7.0 A (12 %)", "(2) at 3000 rpm E = 15.9 V: iq = (Kp·60 − E)/(Kp + Rs) = (12.7 − 15.9)/0.240 ≈ −13 A: the motor brakes; P alone cannot even overcome the back-EMF", "(3) feed-forward residual = ωe·(16.855 − 15.919) mWb ≈ 0.88 V → ≈ 3.7 A more error (iq ≈ 49 A)", "the integrator removes any constant error (resistance, back-EMF, wrong feed-forward): that is why it is PI"], "traps": ["expecting zero error with P only", "forgetting E is ωe·λm with electrical ωe (942 rad/s)", "thinking feed-forward replaces the integrator: it only shrinks the error the integrator must clear"], "solution": "<p>(1) 0.2119·(60 − iq) = 0.028·iq gives 53.0 A, 7 A short. (2) At 3000 rpm the 15.9 V of back-EMF exceeds the 12.7 V that Kp·60 can command: iq settles at about −13 A, a brake. (3) Feed-forward with the VESC's λm leaves 0.88 V unexplained, which with P only costs about 3.7 A more (iq ≈ 49 A). The integrator keeps adding voltage while any error remains, so in steady state the error is zero whatever the disturbance.<\/p>", "prompt_text": "Imagine your VESC ran a **P controller only**, Kp = 0.2119 V/A, no integrator, no feed-forward. (1) Rotor locked, iq_ref = 60 A: steady iq and error? (2) Same request at 3000 rpm: steady iq? (3) Now add back-EMF feed-forward using the λm the VESC believes, 15.919 mWb: what voltage error is left at 3000 rpm and what does it do with P only? What removes it?"}, "c3": {"kind": "calc", "prompt": "<p>Your VESC has <strong>Kp = 0.2119 V/A, Ki = 56.20 V/(A·s)<\/strong> and uses the average L = 106 µH. (1) Show that the zero sits on the plant pole. (2) What ωc, in rad/s and Hz, closed-loop τ and 10–90 % rise time? (3) A colleague wants ωc = 8000 rad/s. With a loop delay of about 1.5 control periods, how much phase does the delay eat at 2000 and at 8000 rad/s, at 15 kHz? Is 8000 sensible?<\/p>", "key": ["Ki/Kp = 265 rad/s ≈ Rs/L = 0.02802/106e-6 = 264 rad/s: zero on the pole, open loop ≈ ωc/s", "ωc = Kp/L ≈ 2000 rad/s ≈ 318 Hz; closed-loop τ = 1/ωc = 0.5 ms; rise 2.2/ωc ≈ 1.10 ms; no overshoot", "delay phase ≈ ωc·1.5·Ts: Ts = 66.7 µs → 11.5° at 2000 rad/s, 46° at 8000 rad/s (half that at 30 kHz)", "8000 rad/s at 15 kHz eats about half of a 90° margin: overshoot and noise, and it is only ~12× below the sampling rate; the continuous model would not show it; and first ask which requirement needs a faster loop"], "traps": ["318 Hz confused with 2000 Hz (rad/s vs Hz)", "using 1.8/ωn: this loop is first order", "\"faster is always better\", or changing a gain with no requirement"], "solution": "<p>(1) Ki/Kp = 265 rad/s and Rs/L = 264 rad/s: the PI zero cancels the R-L pole. (2) ωc = 0.2119/106e-6 ≈ 2000 rad/s = 318 Hz, τ = 0.5 ms, rise ≈ 1.1 ms, no overshoot. (3) A delay of 1.5 × 66.7 µs = 0.1 ms costs ωc·0.1 ms: 0.2 rad = 11.5° at 2000 rad/s, 0.8 rad = 46° at 8000 rad/s. That is the sampling ceiling: past roughly a tenth to a twentieth of the sampling rate the delay dominates. At 15 kHz, 8000 rad/s is too close; and nobody has written why the quad needs it.<\/p>", "prompt_text": "Your VESC has **Kp = 0.2119 V/A, Ki = 56.20 V/(A·s)** and uses the average L = 106 µH. (1) Show that the zero sits on the plant pole. (2) What ωc, in rad/s and Hz, closed-loop τ and 10–90 % rise time? (3) A colleague wants ωc = 8000 rad/s. With a loop delay of about 1.5 control periods, how much phase does the delay eat at 2000 and at 8000 rad/s, at 15 kHz? Is 8000 sensible?"}, "c4": {"kind": "calc", "prompt": "<p>Full throttle at <strong>5200 rpm<\/strong>, iq_ref = 60 A, id = 0, no anti-windup, 30 V wall. (1) Can 60 A be reached? What iq is the most the 30 V allow? (2) The loop sits on the wall for 20 ms with about 15 A of error: how much voltage does the integrator store? (3) You then lift the throttle to 30 A. What does the motor do for the next ten-odd milliseconds, and what fixes it?<\/p>", "key": ["60 A at 5200 rpm needs vq ≈ 29.2 V and vd ≈ −11.1 V, |v| ≈ 31.2 V > 30 V: not reachable; with id = 0 the maximum is iq ≈ 45 A", "stored: Ki·e·t = 56.2 × 15 × 0.020 ≈ 17 V above what is needed", "after lifting to 30 A the error turns negative but the stored integral keeps vq on the wall: iq stays near 45 A until it unwinds (a lag of milliseconds to tens of milliseconds; no exact number is required): an unwanted push", "fix: anti-windup (clamping stops integrating while saturated, or back-calculation); and a vector voltage limit, not per axis"], "traps": ["blaming the 120 A current limit: it is voltage", "\"anti-windup makes it faster\": it removes the overshoot and the late push", "forgetting the cross term: vd also needs 11 V at this speed"], "solution": "<p>At 5200 rpm the back-EMF alone is 27.5 V. 60 A would need a 31.2 V arrow, so the best with id = 0 is about 45 A. Sitting on the wall with 15 A of error, the integrator piles up 56.2 × 15 × 0.02 ≈ 17 V that the inverter cannot deliver. When you ask for 30 A the error flips sign, but that stored voltage keeps vq pinned at 30 V while it bleeds away, so for a while (a rough hand estimate: 10–20 ms; Simulink B will show the real figure) the motor keeps pushing about 45 A. Clamping stops the integrator while the output is saturated; the push disappears.<\/p>", "prompt_text": "Full throttle at **5200 rpm**, iq_ref = 60 A, id = 0, no anti-windup, 30 V wall. (1) Can 60 A be reached? What iq is the most the 30 V allow? (2) The loop sits on the wall for 20 ms with about 15 A of error: how much voltage does the integrator store? (3) You then lift the throttle to 30 A. What does the motor do for the next ten-odd milliseconds, and what fixes it?"}, "d1": {"kind": "calc", "prompt": "<p>One steady sample from your CAN log: <strong>erpm = 12 000, I_motor = 8.0 A, duty = 0.735, V_in = 50.6 V<\/strong>. Compute |v|, ωe, vd, vq and λm. Then two lines: why is one sample not a measurement of λm, and which samples must your script throw away?<\/p>", "key": ["|v| = duty·V_in/√3 = 0.735 × 50.6 / 1.732 ≈ 21.47 V (peak phase, amplitude-invariant)", "ωe = 12 000 × 2π/60 ≈ 1257 rad/s (erpm is already electrical: no × p)", "vd = −ωe·Lq·I ≈ −1.13 V; vq = √(21.47² − 1.13²) ≈ 21.44 V; λm = (vq − Rs·I)/ωe = (21.44 − 0.22)/1257 ≈ 16.9 mWb (+0.2 % vs 16.855)", "one sample carries frame-time mismatch (V_in in another frame), quantisation and possible transient: you need many steady samples, a median and a spread", "discard: I_motor exactly 0.0 (motor released, duty is no longer the commanded voltage; reads 6–20 % low), accelerating samples (L·di/dt, read high), low erpm (poor voltage resolution)"], "traps": ["multiplying erpm by 3 (λm ≈ 5.6 mWb) or dividing it by 3 (≈ 50.7 mWb): electrical vs mechanical", "Vbus/2 instead of Vbus/√3 (≈ 14.6 mWb)", "claiming 0.2 % agreement from one point when the log's spread is ±5 %"], "solution": "<p>|v| = 21.47 V, ωe = 1257 rad/s, vd = −1.13 V, vq = 21.44 V, λm = (21.44 − 0.22)/1257 ≈ 16.9 mWb, 0.2 % above the scope. Lucky, not proof: log_017's steady samples spread ±5 %. The script keeps only current-controlled (I ≠ 0), quasi-steady samples above ~2000 erpm and reports a count, a median and a 10–90 % band, or no number if there are too few.<\/p>", "prompt_text": "One steady sample from your CAN log: **erpm = 12 000, I_motor = 8.0 A, duty = 0.735, V_in = 50.6 V**. Compute |v|, ωe, vd, vq and λm. Then two lines: why is one sample not a measurement of λm, and which samples must your script throw away?"}, "d2": {"kind": "case", "prompt": "<p>A colleague drafts your C03 gate: <strong>\"REQ-MOD-001: The motor model shall be accurate and shall be validated against the CAN logs.\"<\/strong> Rewrite it so that C04 can pass or fail it. Then say what makes your version verifiable, and whether passing it means the motor model is validated.<\/p>", "key": ["a need in one line: the model must predict torque per amp (Kt ∝ λm) well enough to design the current loop and the vehicle model", "one quantity, a number, a range and conditions: e.g. back-EMF constant within ±3 % (median of ≥ 50 samples) of λm estimated from CAN, 1000–4900 rpm mechanical, steady speed, id = 0, |I| ≥ 1 A", "independent data: a recording not used to set the parameter; tolerance justified both ways (wider than what the data resolve, tighter than what the use needs)", "verification method named: lambda_from_can.py after passing its synthetic acceptance test, on a steady-hold log, result in the verification matrix", "passing it verifies one parameter at light load; it is one step towards validation, not validation of the whole model"], "traps": ["\"accurate\" and \"validated\" with no number (his mistake #13 and #14 pattern)", "a tolerance tighter than the log can show (±0.2 % from ±5 %)", "checking against the same log used to tune λm"], "solution": "<p>Example. Need: the model must predict torque per amp within 5 % for loop and vehicle design. \"REQ-MOD-001: over 1000–4900 rpm mechanical, at steady speed with id = 0 and |I| ≥ 1 A, the model's λm shall agree with λm estimated from a VESC CAN recording not used to set it, within ±3 % (median of at least 50 samples).\" Verified by lambda_from_can.py, once its synthetic test passes, on a steady-hold log in C04. Passing it verifies one parameter at light load: a step towards validating the model, not the validation itself.<\/p>", "prompt_text": "A colleague drafts your C03 gate: **\"REQ-MOD-001: The motor model shall be accurate and shall be validated against the CAN logs.\"** Rewrite it so that C04 can pass or fail it. Then say what makes your version verifiable, and whether passing it means the motor model is validated."}, "e1": {"kind": "case", "prompt": "<p>Quad on the stand, brake fully on, rotor locked. You switch the VESC to <strong>duty mode<\/strong> and hold <strong>duty = 0.05<\/strong>. What phase voltage, current and torque do you get, cold and with the winding 25 % hotter? How much battery current? Then you release the brake: what happens to the current as the wheel spins up? Compare with asking 50 A in current mode.<\/p>", "key": ["phase voltage ≈ 0.05 × 52/√3 ≈ 1.50 V; cold I = 1.50/0.028 ≈ 54 A (≈ 4.1 N·m), hot ≈ 43 A (≈ 3.2 N·m): voltage fixes the current only through R", "battery: 1.5 × 1.50 × 54 ≈ 121 W → ≈ 2.3 A at 52 V; all of it heat in the copper", "brake released: back-EMF grows with speed, I = (V − E)/R falls, the motor settles where E ≈ 1.5 V (≈ 280 rpm) with only the drag current", "current mode: 50 A whatever the temperature, the loop raises the voltage as E grows until it runs out of volts"], "traps": ["\"54 A in the phases means 54 A (or 3 × 54) from the battery\" (his mistake #3)", "\"the current stays the same when the wheel turns\" in duty mode (his mistake #15)", "forgetting that at standstill all power is copper heat: keep it short"], "solution": "<p>Duty 0.05 is about 1.5 V on each phase. Locked, only R limits the current: 54 A cold (4.1 N·m), 43 A hot. The battery gives just 121 W, 2.3 A. Let the brake go and the back-EMF rises with speed, so the current falls until E nearly equals 1.5 V, around 280 rpm, with just enough current for the drag. In current mode the VESC would hold 50 A as long as it had voltage over the back-EMF: the throttle, not R or speed, would decide.<\/p>", "prompt_text": "Quad on the stand, brake fully on, rotor locked. You switch the VESC to **duty mode** and hold **duty = 0.05**. What phase voltage, current and torque do you get, cold and with the winding 25 % hotter? How much battery current? Then you release the brake: what happens to the current as the wheel spins up? Compare with asking 50 A in current mode."}, "e2": {"kind": "case", "prompt": "<p>At 4000 rpm the torque response feels slow. You want to switch on <strong>decoupling<\/strong> (feed-forward of ωe·λm and ωe·L·i) in VESC Tool. Before you do: what error does the feed-forward itself carry with the λm the VESC believes (15.919 mWb), in volts? What does the PI do with it? What would you check, and with which number, before and after the change?<\/p>", "key": ["feed-forward error at 4000 rpm = ωe·(16.855 − 15.919) mWb = 1257 × 0.936 mWb ≈ 1.18 V of 21.2 V (5.5 %)", "the integrator clears a constant error, so the steady state is fine; but the feed-forward is only as good as ωe, L and λm, and a wrong one injects a disturbance in transients", "benefit expected from the model: rise ≈ 3.3 ms → ≈ 1.1 ms at 4000 rpm", "before: a requirement (which response time, why), a measured baseline (step response of iq in a log), λm corrected or re-detected; after: the same test, same conditions, compare with the number"], "traps": ["\"always enable it\" with no number", "changing two things at once (λm and decoupling) and not knowing which helped", "calling the result validation when it is a verification against your own requirement (his mistake #13)"], "solution": "<p>With the VESC's λm the feed-forward is 1.18 V short at 4000 rpm. The integrator removes that in steady state, so it is not dangerous, but it shows the catch: feed-forward trusts the parameters. Your model says decoupling should take the step from about 3.3 ms back to 1.1 ms. So: write what response the quad needs and why, log a baseline step, fix λm first (one change at a time), then enable decoupling and repeat the same test.<\/p>", "prompt_text": "At 4000 rpm the torque response feels slow. You want to switch on **decoupling** (feed-forward of ωe·λm and ωe·L·i) in VESC Tool. Before you do: what error does the feed-forward itself carry with the λm the VESC believes (15.919 mWb), in volts? What does the PI do with it? What would you check, and with which number, before and after the change?"}, "e3": {"kind": "error", "prompt": "<p>A colleague explains your VESC: \"The current loop runs at 30 kHz, so its bandwidth is 30 kHz. Because Ki/Kp = R/L, it has that bandwidth at every speed. Windup happens when the battery limit is hit, and you fix it by raising Ki. At 5000 rpm full throttle the motor gets 120 A, because the current limit is 120 A.\" Find every error.<\/p>", "key": ["sampling rate is not bandwidth: ωc = 2000 rad/s ≈ 318 Hz, about 1/47 of a 15 kHz loop; the sample delay caps how high it can go", "pole/zero cancellation gives 2000 rad/s only for the bare R-L plant: at speed, without decoupling, cross-coupling makes the step ~3× slower (≈ 3.3 ms at 4000 rpm)", "windup comes from the voltage saturation (30 V wall), not the battery limit; the fix is clamping or back-calculation; a larger Ki winds up faster", "at 5000 rpm the voltage, not the 120 A limit, caps the current: the back-EMF eats most of the 30 V and only tens of amps fit"], "traps": ["accepting \"bandwidth = PWM frequency\"", "\"Ki/Kp = R/L makes the loop speed-independent\"", "missing that the last claim is the voltage wall from L3b"], "solution": "<p>Four errors. (1) 30 kHz (or 15 kHz) is how often the loop runs; its bandwidth is 2000 rad/s, 318 Hz. (2) The cancellation design assumes R-L alone; at 4000 rpm without decoupling the step is about three times slower. (3) Windup is the integrator charging while the voltage is saturated; clamping fixes it, a larger Ki makes it worse. (4) At 5000 rpm the back-EMF leaves little voltage, so the current falls far below 120 A: the voltage wall, not the current limit.<\/p>", "prompt_text": "A colleague explains your VESC: \"The current loop runs at 30 kHz, so its bandwidth is 30 kHz. Because Ki/Kp = R/L, it has that bandwidth at every speed. Windup happens when the battery limit is hit, and you fix it by raising Ki. At 5000 rpm full throttle the motor gets 120 A, because the current limit is 120 A.\" Find every error."}, "z0": {"kind": "explain", "prompt": "<p>An interviewer asks: \"How does your VESC control torque, and what limits it?\" In at most 6 lines: Park and dq, the current loop and how it is tuned, and the three walls.<\/p>", "key": ["Park with the rotor angle turns 3 phase sines into two constants: iq makes torque (Kt = 0.0758 N·m/A), id is held at 0 (FW and MTPA off, saliency gives only +0.5 %)", "each axis is an R-L plant (τ ≈ 4 ms) plus back-EMF and cross-coupling; two PIs tuned by pole/zero cancellation, Kp = ωc·L, Ki = ωc·Rs, ωc = 2000 rad/s (Kp 0.2119, Ki 56.2), rise ≈ 1.1 ms at standstill, slower at speed without decoupling", "walls: 120 A current circle (launch torque 9.1 N·m), 40 A battery = power (~2.1 kW, from ~11 km/h), voltage ellipse Vmax/ωe (top speed ~37 km/h, scales with bus)", "on the voltage wall the loop is saturated and needs anti-windup"], "traps": ["\"the inverter manages the current\" with no mechanism", "leaving out the limits or the tuning rule"], "solution": "<p>The VESC measures two phase currents, Clarke and Park them with the rotor angle, and gets two constants: iq for torque, 0.0758 N·m per amp, and id, held at zero because my saliency gives MTPA only 0.5 %. Each axis is an R-L of about 4 ms plus back-EMF and coupling; two PIs tuned by pole/zero cancellation give 2000 rad/s, a 1.1 ms rise at standstill, slower at speed because decoupling is off. Three walls: 120 A of current at launch, 40 A of battery (a 2.1 kW power limit) from about 11 km/h, and the 30 V voltage ceiling at top speed, where the loop saturates and needs anti-windup.<\/p>", "prompt_text": "An interviewer asks: \"How does your VESC control torque, and what limits it?\" In at most 6 lines: Park and dq, the current loop and how it is tuned, and the three walls."}, "z1": {"kind": "doubt", "prompt": "<p>What is still unclear after the exam? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors.<\/p>", "key": [], "traps": [], "solution": "", "prompt_text": "What is still unclear after the exam? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors."}}, "hasScene": true}, {"id": "C03-K1", "cycle": "C03", "title": "Control 1: open and closed loop on your R-L coil", "date": "2026-11-05", "slot": "2", "minutes": "55", "lede": "After Park, your q axis is a 28 mΩ resistor in series with a 113 µH coil, fighting a back-EMF of 21 V at 4000 rpm. One volt of error is 36 amps. Today you find out why nobody drives that open loop, and why a proportional gain alone is not enough either.", "sources": "04_model/params/motor_params.m (Rs, Lq, λm, VESC kp/ki, decoupling off, control period OPEN) · Åström & Murray, Feedback Systems 2e, §1.1 pp. 1-1–1-3 (open vs closed loop), §1.2 and Table 1.1 pp. 1-4–1-5 (feedforward vs feedback), §1.5 and fig. 1.11 pp. 1-13–1-14 (cruise control: feedback rejects a slope disturbance and is robust to mass) · Franklin, Powell & Emami-Naeini 8e, §4.1 eqs. (4.1)–(4.11) and §4.1.3 (basic equations, regulation), §4.2.2 (system type for disturbance rejection), §4.3.1 eqs. (4.56)–(4.61) (proportional control leaves a steady error), §4.4 fig. 4.27 (feedforward by plant inversion). Franklin is an e-book without printed page numbers: cite by section and equation", "html": "\n<section class=\"sec\" id=\"s-predict\"><h2>Predict<\/h2>\n<p>Two from your open mistakes first, from memory. Then two guesses about today, with your reason.<\/p>\n<div class=\"qa\" data-q=\"r1\"><\/div>\n\n<div class=\"qa\" data-q=\"r2\"><\/div>\n\n<div class=\"qa\" data-q=\"p1\"><\/div>\n\n<div class=\"qa\" data-q=\"p2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-core\"><h2>Core: six ideas on your motor<\/h2>\n<p>Each idea starts from your q axis or your VESC, then the law.<\/p>\n<article class=\"idea\"><span class=\"n\">1<\/span><div><h3>The plant: your q axis is a coil with a battery against it<\/h3>\n<p>In L3a you wrote the q-axis voltage equation. Keep id = 0, as your VESC does:<\/p>\n<div class=\"eq\">vq = Rs·iq + Lq·diq/dt + ωe·λm<\/div>\n<p>Read it as a circuit: the inverter's voltage vq pushes through a resistor Rs = 28.02 mΩ and a coil Lq = 113 µH, against a battery whose voltage grows with speed, the back-EMF ωe·λm. In control terms the <strong>plant<\/strong> is first order:<\/p>\n<div class=\"eq\">iq(s) / vq(s) = 1 / (Lq·s + Rs) = (1/Rs) / (τ·s + 1)    τ = Lq/Rs = 4.0 ms    DC gain 1/Rs = 35.7 A/V<\/div>\n<p>Two numbers make it scary. The <strong>gain<\/strong> is huge: 36 A per volt, and the inverter can put 30 V on it, which would be over 1000 A if nothing stopped it. The <strong>slope<\/strong> at the start is V/L: 1 V makes the current rise at 8.8 A per millisecond, 30 V at 265 A/ms. In the half millisecond it takes you to blink, a wrong voltage has already burned through your 120 A limit.<\/p>\n<aside class=\"mine\"><span>In your motor<\/span>The back-EMF is not part of the plant here: it is an input you do not choose, a <strong>disturbance<\/strong>. At 4000 rpm it is 21.2 V, at 1000 rpm 5.3 V. Franklin calls this W, the plant disturbance (§4.1, fig. 4.2).<\/aside>\n<div class=\"qa\" data-q=\"i1\"><\/div>\n<p class=\"src\">Åström &amp; Murray §1.1, pp. 1-1–1-3 (system, input, output; open and closed loop); dq equation and Rs, Lq from 04_model/params/motor_params.m<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">2<\/span><div><h3>Open loop: why \"compute the voltage and apply it\" fails<\/h3>\n<p>Open loop means: compute vq from the model and apply it, never looking at the current. For 40 A at 4000 rpm you would apply vq = Rs·40 + ωe·λm = 1.12 + 21.18 = 22.30 V. On paper, perfect. In your quad, three things are not what the model says:<\/p>\n<ul><li><strong>Rs drifts.<\/strong> Copper moves 0.39 % per kelvin. Your VESC does not compensate it (<code>foc_temp_comp = 0<\/code>), and the 28 mΩ was measured at an unknown temperature. A motor 60 K hotter has 23 % more resistance.<\/li><li><strong>λm is not what you think.<\/strong> Your VESC believes 15.92 mWb; the measured value is 16.855 mWb. That is 5.5 %, small, but it multiplies ωe.<\/li><li><strong>The back-EMF changes with speed<\/strong>, all the time, while you ride.<\/li><\/ul>\n<p>And every error in volts becomes 36 A of error in current, because there is nothing else in the circuit to absorb it. Franklin puts it bluntly: in the open-loop structure the controller has no influence at all on the response to a disturbance (§4.1.3). Åström and Murray summarise it in a table: feedforward (open loop) acts on plans and is sensitive to model errors; feedback acts on deviations and is robust to them (Table 1.1, p. 1-5).<\/p>\n<div class=\"qa\" data-q=\"i2\"><\/div>\n<p class=\"src\">Franklin §4.1, eqs. (4.1)–(4.4) and §4.1.3 (open loop: the controller cannot act on disturbances); Åström &amp; Murray §1.2, Table 1.1, pp. 1-4–1-5; Rs drift 0.39 %/K and λm values from motor_params.m<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">3<\/span><div><h3>Closed loop: measure, compare, correct<\/h3>\n<p>Your VESC does not trust the model. Every control period it <strong>measures<\/strong> the phase currents with its shunts, turns them into iq (Clarke and Park, L2 and L3a), <strong>compares<\/strong> with the throttle's request, and <strong>corrects<\/strong> the voltage according to the error. That is feedback: the definition Åström and Murray start with, two systems connected in a cycle, each one's output driving the other (§1.1).<\/p>\n<p>Your VESC's current loop, the q axis, in one line:<\/p>\n<div class=\"eq\">iq_ref (throttle) → ⊕ → error → PI (kp 0.2119 V/A, ki 56.2 V/(A·s)) → vq → limit |v| ≤ 30 V → inverter → coil 1/(Lq·s + Rs) → iq<\/div>\n<div class=\"eq\">disturbance: − ωe·λm enters between the inverter and the coil    feedback: shunts → Clarke → Park (θe) → iq back to ⊕ with a minus sign<\/div>\n<p>Why it beats open loop: if the motor heats or λm is off, the current drops, the error grows, and the controller pushes more volts <strong>without knowing why<\/strong>. Åström and Murray show the same with cruise control: a slope appears, the speed drops, the controller opens the throttle, for cars from 1200 to 2000 kg alike (fig. 1.11, p. 1-14). Your \"slope\" is the back-EMF; your \"mass\" is Rs and λm.<\/p>\n<aside class=\"mine\"><span>In your motor<\/span>The control period is every 33 µs or every 67 µs (one or two PWM periods at 30 kHz). Which one your FSESC build runs is still <strong>OPEN<\/strong> in <code>motor_params.m<\/code>; the model assumes 67 µs. The lab below samples at 33 µs.<\/aside>\n<div class=\"qa\" data-q=\"i3\"><\/div>\n<p class=\"src\">Åström &amp; Murray §1.1, pp. 1-1–1-3 (closed loop as interconnected systems); §1.5 and fig. 1.11, pp. 1-13–1-14 (feedback rejects a slope and is robust to mass changes); loop structure and gains from motor_params.m<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">4<\/span><div><h3>P only: fast, but it always leaves an error<\/h3>\n<p>Start with the simplest controller: vq = Kp·(iq_ref − iq). Put it in the plant (Franklin §4.3.1 does this for a generic plant):<\/p>\n<div class=\"eq\">Lq·diq/dt = Kp·(iq_ref − iq) − Rs·iq − ωe·λm<\/div>\n<div class=\"eq\">closed-loop pole s = −(Rs + Kp)/Lq    bandwidth ωb = (Rs + Kp)/Lq ≈ Kp/Lq when Kp ≫ Rs<\/div>\n<div class=\"eq\">steady state: iq = (Kp·iq_ref − ωe·λm) / (Rs + Kp)<\/div>\n<p>What this says:<\/p>\n<ul><li><strong>The pole moves.<\/strong> Open loop it was R/L = 248 rad/s (τ = 4 ms). With Kp = 0.2119 V/A it is 2123 rad/s: the loop is 8.6 times faster than the coil. Rise time 10–90 % ≈ 2.2/ωb ≈ 1.0 ms.<\/li><li><strong>There is always an error to the reference<\/strong>: iq_ref·Rs/(Rs + Kp). A P controller only produces voltage from error, so some error must stay. Franklin: a Type 0 system with P control keeps a nonzero offset to a constant reference and cannot fully reject a constant disturbance (§4.3.1).<\/li><li><strong>The disturbance is divided by (Rs + Kp)<\/strong>, not by Rs alone. Feedback shrinks the 36 A/V of open loop to about 4 A/V. Better, not zero.<\/li><\/ul>\n<div class=\"qa\" data-q=\"i4\"><\/div>\n<p class=\"src\">Franklin §4.3.1, eqs. (4.56)–(4.61) (proportional control: steady error to a step reference and to a step disturbance, falling as kP grows); §4.2.2 (system type for disturbance rejection)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">5<\/span><div><h3>Disturbance and feed-forward: give the loop the volts you already know<\/h3>\n<p>The back-EMF is not a mystery: ωe comes from the angle estimate and λm is in the configuration. So add it to the controller's output before the loop has to find it:<\/p>\n<div class=\"eq\">vq = Kp·(iq_ref − iq) + ω̂e·λ̂m    (back-EMF decoupling, a feed-forward)<\/div>\n<p>If ω̂e·λ̂m equals the real ωe·λm, the disturbance cancels and the loop is back to its standstill error. If the estimate is off, the loop only has to fight the <strong>difference<\/strong>: here the 5.5 % λm error, 1.17 V at 4000 rpm, divided by (Rs + Kp). Feed-forward does the big, known part fast; feedback cleans up the small, unknown part. Franklin's §4.4 is exactly this: invert the plant model for the part you know, let feedback handle the rest (fig. 4.27). Åström and Murray: feed-forward needs a good model; feedback does not (Table 1.1).<\/p>\n<p>The same trick for the d axis: add −ω̂e·Lq·iq to cancel the cross-coupling (L3a, c2).<\/p>\n<aside class=\"mine\"><span>In your motor<\/span>Your VESC has decoupling <strong>OFF<\/strong> (<code>foc_cc_decoupling = 0<\/code>). No feed-forward at all. It works anyway because of the integrator in its PI, which builds the 21 V slowly by itself. The cost appears when the speed changes fast.<\/aside>\n<div class=\"qa\" data-q=\"i5\"><\/div>\n<p class=\"src\">Franklin §4.4, fig. 4.27 (feed-forward by plant inversion, for tracking and for a measured disturbance); Åström &amp; Murray §1.2, pp. 1-4–1-5; decoupling setting from motor_params.m<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">6<\/span><div><h3>Cascade: you are the outer loop, the current loop is the inner one<\/h3>\n<p>Your throttle does not ask for speed. Your VESC is in current control: the throttle asks for amps, and amps are torque (Kt = 0.0758 N·m/A, L3a). So the current loop is the <strong>inner<\/strong> loop. The <strong>outer<\/strong> loop is you: you look at the speed and the trail and move the throttle, at maybe 1–2 Hz. The inner loop runs at about 300 Hz bandwidth. The rule of a cascade: the inner loop must be several times (5–10×) faster than the outer one, so the outer loop can treat it as \"asked torque = delivered torque\". Later, your VCU will become a new outer loop (traction control, speed limit) that sends a current request to the VESC instead of you.<\/p>\n<p>You already know this structure from the ECU. In a torque-based engine management the pedal is turned into a torque request; inner loops then deliver it through air, spark and fuel. Idle-speed control is the cleanest case: an outer rpm loop computes the torque needed, and fast inner paths (spark first, then air) realise it. Same shape here: the rider's speed loop outside, the 300 Hz current loop inside, and the inner one must be fast and stiff enough that the outer one never notices it.<\/p>\n<div class=\"qa\" data-q=\"i6\"><\/div>\n<p class=\"src\">Åström &amp; Murray §1.5 and fig. 1.11, pp. 1-13–1-14 (vehicle speed loop: the throttle commands force, the loop rejects the slope); Kt and current-mode operation from motor_params.m<\/p>\n<\/div><\/article>\n<\/section>\n<section class=\"sec\" id=\"s-lab\"><h2>Lab: touch it<\/h2>\n<p>Write your prediction before you move a slider. If it surprises you, say why in the same box.<\/p>\n<div class=\"labbox\" data-lab=\"rl\" data-title=\"One phase as an R-L circuit, open-loop voltage step\"><\/div>\n\n<div class=\"qa\" data-q=\"l1\"><\/div>\n\n<div class=\"labbox\" data-lab=\"piloop\" data-title=\"Closing the current loop on the R-L phase\"><\/div>\n\n<div class=\"qa\" data-q=\"l2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-judgement\"><h2>Judgement<\/h2>\n<p>Reason from what you know is true, not from what sounds familiar.<\/p>\n<div class=\"qa\" data-q=\"c1\"><\/div>\n\n<div class=\"qa\" data-q=\"c2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-close\"><h2>Close<\/h2>\n\n<div class=\"qa\" data-q=\"z0\"><\/div>\n\n<div class=\"qa\" data-q=\"z1\"><\/div>\n\n<\/section>", "questions": {"r1": {"kind": "recall", "prompt": "<p>Your quad is powered at a FIXED voltage (no current control) and starts climbing a hill. What happens to the current and the torque, and why? Then: what changes when the VESC is in current control?<\/p>", "key": ["fixed V: I = (V − E)/R; the hill slows the motor, E = ωe·λm drops, so the current and the torque RISE", "that is how a fixed-voltage motor finds the torque the hill needs", "in current control the throttle sets the current; the VESC changes the voltage to hold it, and the hill only changes the speed"], "traps": ["\"current and torque stay the same\" (his mistake #15)", "mixing up voltage mode and current mode (same root as mistake #2)"], "solution": "<p>At fixed voltage, I = (V − E)/R. The hill slows the motor, E falls, and the current and torque grow until they match the hill. In current control the throttle fixes the amps and the VESC moves the voltage to keep them; the hill only decides the speed. Today you see that \"the VESC moves the voltage\" is a closed loop, and why it has to be one.<\/p>", "prompt_text": "Your quad is powered at a FIXED voltage (no current control) and starts climbing a hill. What happens to the current and the torque, and why? Then: what changes when the VESC is in current control?"}, "r2": {"kind": "recall", "prompt": "<p>Someone computes \"52 V across your 28 mΩ gives 1860 A\". What is the 28 mΩ, and name the two things that keep the real current far below that.<\/p>", "key": ["28 mΩ is Rs, the resistance of one motor phase (plus MOSFETs), not the battery", "once the motor turns, the back-EMF opposes the supply, so only V − E drives current", "the VESC limits the current with its current loop (120 A motor, 40 A battery)", "battery current and phase current are linked by power, not by √3"], "traps": ["taking 28 mΩ as the battery resistance (his mistake #16)", "\"40 A / √3 ≈ 70 A per phase\" (mistake #16)"], "solution": "<p>28 mΩ is one phase of the motor. Two things save you: the back-EMF, which eats most of the bus voltage once you turn, and the VESC's current loop, which never lets the full voltage sit across the copper. Today's lesson is that second one. Your calculation is not crazy: it says exactly why the loop has to exist.<\/p>", "prompt_text": "Someone computes \"52 V across your 28 mΩ gives 1860 A\". What is the 28 mΩ, and name the two things that keep the real current far below that."}, "p1": {"kind": "predict", "prompt": "<p>Rotor held still. You apply a fixed 1 V step to the q axis, no controller. Guess: how many amps at the end, and roughly how long does it take to get there?<\/p>", "key": ["final current V/R = 1/0.028 ≈ 36 A", "time constant τ = L/R ≈ 4.0 ms; it reaches 63 % in one τ, ~98 % in 4 τ ≈ 16 ms"], "traps": ["thinking 1 V is \"small\": on 28 mΩ it is 36 A", "guessing microseconds or seconds without the L/R ratio"], "solution": "<p>36 A for every volt, reached with a time constant of about 4 ms. One volt, which is 2 % of your bus, already pushes a third of your motor's current limit. Keep that number in mind for the whole lesson.<\/p>", "prompt_text": "Rotor held still. You apply a fixed 1 V step to the q axis, no controller. Guess: how many amps at the end, and roughly how long does it take to get there?"}, "p2": {"kind": "predict", "prompt": "<p>Now a controller that only multiplies the error by a gain: v = Kp·(iq_ref − iq), with your VESC's kp = 0.21 V/A. You ask 40 A with the rotor held still. Does iq reach 40 A? Then guess what happens at 4000 rpm.<\/p>", "key": ["no: a P controller needs an error to produce any voltage, so iq settles below the reference", "at standstill the shortfall is small-ish (≈ 4.7 A)", "at 4000 rpm the back-EMF (≈ 21 V) must also be produced from the error: the P loop fails badly"], "traps": [], "solution": "<p>It does not reach 40 A: the only voltage it makes comes from the error, so some error must remain. At standstill it settles near 35 A. At 4000 rpm the loop must also produce 21 V of back-EMF from the error alone, and it cannot. You will compute how badly in idea 4.<\/p>", "prompt_text": "Now a controller that only multiplies the error by a gain: v = Kp·(iq_ref − iq), with your VESC's kp = 0.21 V/A. You ask 40 A with the rotor held still. Does iq reach 40 A? Then guess what happens at 4000 rpm."}, "i1": {"kind": "calc", "prompt": "<p>Rotor held still (no back-EMF). You command a 5 V step on the q axis, open loop. Compute: final current, initial slope, current after one τ, and the time it takes to cross the 120 A motor limit.<\/p>", "key": ["final current 5 / 0.02802 = 178 A (over the 120 A limit)", "initial slope V/L = 5 / 113e-6 = 44 A/ms", "after τ = 4.03 ms: 63 % of 178 = 113 A", "crosses 120 A at t = −τ·ln(1 − 120/178) ≈ 1.12·τ ≈ 4.5 ms"], "traps": ["using Ld (99 µH) for the q axis", "forgetting the exponential: 120 A is not at 120/44 = 2.7 ms (that is the straight-line slope)"], "solution": "<p>I∞ = 5/0.02802 = 178 A. Slope 5/113 µH = 44 A/ms. At one τ (4.03 ms): 0.632 × 178 = 113 A. It crosses 120 A at −4.03 ms × ln(1 − 0.673) = 4.5 ms. Five volts, one tenth of your bus, overshoots the motor limit in under 5 ms. Nothing in open loop would stop it there.<\/p>", "prompt_text": "Rotor held still (no back-EMF). You command a 5 V step on the q axis, open loop. Compute: final current, initial slope, current after one τ, and the time it takes to cross the 120 A motor limit."}, "i2": {"kind": "calc", "prompt": "<p>Open loop at 4000 rpm. You compute vq for 40 A using the VESC's λm = 15.92 mWb, but the real motor has 16.855 mWb. How many volts are you short, and what current flows in steady state? Then a second, separate case: at standstill, you set the voltage for 40 A with the cold Rs, and the motor is now 60 K hotter. What current flows?<\/p>", "key": ["volt error = ωe·Δλm = 1257 × (16.855 − 15.92) mWb = 1.17 V short", "current error = 1.17 / 0.02802 ≈ 42 A: iq ≈ 40 − 42 ≈ −2 A, the motor brakes instead of pulling", "hot case: R × (1 + 0.0039 × 60) = 1.234·R, so iq = 40 / 1.234 ≈ 32 A (−19 %)", "the speed-dependent error is far worse than the thermal one: it multiplies ωe"], "traps": ["using mechanical ω (419 rad/s)", "dividing the volt error by (R + something): in open loop there is only R"], "solution": "<p>Short by 1257 × 0.935 mWb = 1.17 V. On 28 mΩ that is 42 A: instead of +40 A you get about −2 A, a 5.5 % flux error turns pulling into braking. Hot case: Rs grows 23 %, so 1.12 V gives 32 A instead of 40 A. Both small model errors, both big current errors. That is the 1/R gain again.<\/p>", "prompt_text": "Open loop at 4000 rpm. You compute vq for 40 A using the VESC's λm = 15.92 mWb, but the real motor has 16.855 mWb. How many volts are you short, and what current flows in steady state? Then a second, separate case: at standstill, you set the voltage for 40 A with the cold Rs, and the motor is now 60 K hotter. What current flows?"}, "i3": {"kind": "check", "prompt": "<p>In that loop, name: (a) the reference, (b) the measured output and the sensor, (c) the actuator, (d) the disturbance, and (e) one model error the loop corrects without being told. Then: what does the loop need that open loop did not?<\/p>", "key": ["(a) iq_ref, from the throttle; (b) iq, from the phase shunts through Clarke and Park", "(c) the inverter, through vq (then inverse Park and SVPWM), limited to 30 V", "(d) back-EMF ωe·λm (also the cross-coupling term on d)", "(e) Rs drift with temperature, or λm error: the loop corrects both through the error", "needs: a sensor (shunts + angle θe) and a stable loop; Åström: risk of instability that open loop does not have"], "traps": ["calling the throttle the disturbance", "forgetting that the measurement depends on θe: a wrong angle feeds back a wrong iq (L3a idea 5)"], "solution": "<p>Reference: iq_ref from the throttle. Output: iq, measured by the shunts and Park. Actuator: the inverter, via vq, capped at 30 V. Disturbance: the back-EMF. It corrects a hot Rs or a wrong λm without knowing either. The price: you need a good sensor and a good angle, and a loop can go unstable, which an open loop cannot (Table 1.1).<\/p>", "prompt_text": "In that loop, name: (a) the reference, (b) the measured output and the sensor, (c) the actuator, (d) the disturbance, and (e) one model error the loop corrects without being told. Then: what does the loop need that open loop did not?"}, "i4": {"kind": "calc", "prompt": "<p>P only, Kp = 0.2119 V/A (your VESC's kp), iq_ref = 40 A. Compute the closed-loop bandwidth, the steady iq at standstill, and the steady iq at 4000 rpm. Then: what Kp would keep the 4000 rpm error under 2 A, and what bandwidth is that?<\/p>", "key": ["ωb = (0.02802 + 0.2119)/113e-6 = 2123 rad/s ≈ 338 Hz (Kp/L alone: 1875 rad/s)", "standstill: iq = 0.2119 × 40 / 0.2399 = 35.3 A, error 4.7 A (12 %)", "4000 rpm: iq = (8.48 − 21.18)/0.2399 = −53 A: the motor brakes while you ask for +40 A", "error < 2 A needs Kp ≳ 21.18/2 ≈ 10.6 V/A, bandwidth ≈ 94 000 rad/s ≈ 15 kHz: faster than the control period can sample (33 or 67 µs, still open)"], "traps": ["forgetting Rs in the denominator (small, but it is there)", "treating the back-EMF as \"part of the reference\" instead of a disturbance the error must produce", "\"just raise Kp\": the sampling and the one-period delay forbid it (lab l2)"], "solution": "<p>ωb = 0.2399/113 µH = 2123 rad/s. Standstill: 35.3 A, 4.7 A short. At 4000 rpm the loop must make 21.2 V from the error alone: iq = (8.48 − 21.18)/0.2399 = −53 A. You ask to pull and it brakes. To keep the error under 2 A you would need Kp ≈ 10.6 V/A, a 15 kHz bandwidth: not possible when you only correct every 33–67 µs. P alone is out. Two fixes: feed-forward (next idea) and the integrator (next lesson).<\/p>", "prompt_text": "P only, Kp = 0.2119 V/A (your VESC's kp), iq_ref = 40 A. Compute the closed-loop bandwidth, the steady iq at standstill, and the steady iq at 4000 rpm. Then: what Kp would keep the 4000 rpm error under 2 A, and what bandwidth is that?"}, "i5": {"kind": "calc", "prompt": "<p>P only, Kp = 0.2119 V/A, 4000 rpm, iq_ref = 40 A. Now you add back-EMF feed-forward using the VESC's λm = 15.92 mWb (the real one is 16.855). Compute the steady iq. Compare with the −53 A of idea 4 and say what the feed-forward bought and what it did not.<\/p>", "key": ["uncancelled volts = 1257 × 0.935 mWb = 1.17 V", "iq = (0.2119 × 40 − 1.17) / 0.2399 = (8.48 − 1.17)/0.2399 ≈ 30.4 A", "error ≈ 9.6 A: 4.7 A from P against Rs plus 4.9 A from the λm error", "bought: from −53 A to +30 A, the loop no longer has to produce 21 V from error; not bought: zero error (that needs the integrator) and robustness to a wrong λm"], "traps": ["assuming feed-forward makes the error zero", "dividing the 1.17 V by Rs only (that is open loop; here it is Rs + Kp)"], "solution": "<p>Residual disturbance 1.17 V. iq = (8.48 − 1.17)/0.2399 = 30.4 A. From −53 A to +30 A: feed-forward did 95 % of the job because it knew 95 % of the back-EMF. The rest, 4.7 A from the P offset and 4.9 A from the wrong λm, is still there. Feed-forward is only as good as your model; that is why the loop still needs feedback with an integrator.<\/p>", "prompt_text": "P only, Kp = 0.2119 V/A, 4000 rpm, iq_ref = 40 A. Now you add back-EMF feed-forward using the VESC's λm = 15.92 mWb (the real one is 16.855). Compute the steady iq. Compare with the −53 A of idea 4 and say what the feed-forward bought and what it did not."}, "i6": {"kind": "check", "prompt": "<p>Draw your quad as a cascade in words: name the outer loop, its sensor and its output; the inner loop, its sensor and its output. Why must the inner loop be faster? And give the ECU loop you have calibrated that has the same structure, with what is outer and inner there.<\/p>", "key": ["outer: the rider (later the VCU); sensor: eyes/speed (later wheel speed); output: the current request iq_ref via the throttle", "inner: the VESC current loop; sensor: phase shunts + Park; output: vq to the inverter; bandwidth ~2000 rad/s ≈ 300 Hz", "the inner loop must be 5–10× faster so the outer loop sees it as a gain (asked torque ≈ delivered torque), otherwise the two interact and can oscillate", "ECU example with outer and inner named correctly (e.g. idle: rpm loop → torque request → spark/air paths; or boost pressure → wastegate actuator position)"], "traps": ["putting the current loop outside the speed loop", "saying the VESC controls speed: in current mode it does not"], "solution": "<p>Outer: me, later the VCU, watching speed and sending an amp request through the throttle. Inner: the VESC current loop, shunts and Park in, vq out, about 300 Hz. The inner loop must be much faster so the outer one can treat it as \"torque on request\"; if their speeds are close they fight. ECU twin: idle-speed control, where the rpm loop asks for torque and spark and air deliver it.<\/p>", "prompt_text": "Draw your quad as a cascade in words: name the outer loop, its sensor and its output; the inner loop, its sensor and its output. Why must the inner loop be faster? And give the ECU loop you have calibrated that has the same structure, with what is outer and inner there."}, "l1": {"kind": "lab", "prompt": "<p>Predict first, then check: with 1 V, what are the final current and the time to 63 %? Then find the smallest step that crosses the 120 A limit, and at 30 V say how long it takes to cross it.<\/p>", "key": ["1 V: 35.7 A final, 63 % (22.6 A) at τ = 4.03 ms", "to cross 120 A at all: V > 120 × 0.02802 = 3.36 V", "30 V: final 1071 A, crosses 120 A after ≈ 0.48 ms", "the time constant does not change with the voltage; only the final value and the slope do"], "traps": ["expecting τ to shrink with a bigger voltage"], "solution": "<p>1 V: 36 A, 63 % at 4.03 ms. Anything above 3.36 V would eventually exceed 120 A. At 30 V the final value is 1071 A and you cross 120 A in under half a millisecond. τ stays at 4.03 ms whatever the voltage: it is a property of the coil, not of the drive.<\/p>", "prompt_text": "Predict first, then check: with 1 V, what are the final current and the time to 63 %? Then find the smallest step that crosses the 120 A limit, and at 30 V say how long it takes to cross it."}, "l2": {"kind": "lab", "prompt": "<p>Make it a P controller: put Ki at its minimum (1 V/(A·s), negligible in 5 ms) and Kp at 0.21 V/A, step 40 A. Predict and read the final error. Then raise Kp to 1, 2, 3 and 4 V/A. Predict what happens to the error and to the shape, then explain what stops you from raising Kp forever.<\/p>", "key": ["Kp 0.21: settles ≈ 35.3 A, error ≈ 4.7 A, no overshoot (first order), rise ≈ 1 ms", "Kp 1: error ≈ 1.1 A; Kp 2: error ≈ 0.55 A but ~13 % overshoot appears; Kp 3: more overshoot and ringing", "Kp 4: it oscillates / limit-cycles against the ±30 V wall", "cause: the one-period delay; stability limit about Kp < Lq/Ts ≈ 3.4 V/A at 33 µs (half that if the real period is 67 µs, still open)", "error never reaches zero with P only, and the lab has no back-EMF: on the moving quad it would be far worse"], "traps": ["\"higher Kp, always better\": the delay sets a ceiling", "reading the overshoot as a second-order plant: the plant is first order, the delay adds the dynamics"], "solution": "<p>At 0.21 V/A it settles near 35 A, 4.7 A short, no overshoot. Kp = 1 cuts the error to 1.1 A; Kp = 2 to 0.55 A, but it now overshoots; Kp = 4 oscillates. The plant alone is first order and could take any gain; what breaks it is that the voltage computed at one sample is only applied at the next. That caps Kp near Lq/Ts ≈ 3.4 V/A at 33 µs. With P alone you can shrink the error, never kill it, and the 21 V of back-EMF is not even in this lab.<\/p>", "prompt_text": "Make it a P controller: put Ki at its minimum (1 V/(A·s), negligible in 5 ms) and Kp at 0.21 V/A, step 40 A. Predict and read the final error. Then raise Kp to 1, 2, 3 and 4 V/A. Predict what happens to the error and to the shape, then explain what stops you from raising Kp forever."}, "c1": {"kind": "case", "prompt": "<p>You are in VESC Tool, Motor Settings → FOC → General. You read Current Kp = 0.2119 and Current Ki = 56.20, and decoupling Disabled. A friend says: \"The integrator is what makes it oscillate. Set Ki to 0, it is simpler and stable.\" Before touching anything, what do you predict at standstill and at 4000 rpm with Ki = 0, and what do you answer him? What would you change instead, if anything, and where would you test it first?<\/p>", "key": ["Ki = 0 leaves P only: at standstill iq ≈ 35 A for 40 A asked (−12 %)", "at 4000 rpm the back-EMF must come from the error: iq ≈ −53 A for +40 A asked, the motor brakes: dangerous on a ride", "the integrator is what supplies the 21 V of back-EMF (decoupling is off); bandwidth here is set by kp/L ≈ 1900 rad/s, and VESC derives kp = L·bw, ki = R·bw with bw = 2000 rad/s", "answer: do not remove Ki; if anything, enabling back-EMF decoupling would take the load off the integrator", "test first in the model (Simulink lessons) or on a stand with the current limit set, never on the trail"], "traps": ["changing a control gain on the quad without a prediction and a criterion with a number", "thinking a missing integrator just makes it \"a bit slower\""], "solution": "<p>Predict first: P only gives 35 A instead of 40 A at standstill, and at 4000 rpm about −53 A, braking when you ask to pull. The integrator is not decoration: with decoupling off it is the only thing that builds the 21 V of back-EMF. Answer: keep Ki. If you want to help the loop, the candidate is decoupling, which is a feed-forward. Try any change in the model first, then on the stand with the current limit configured and a number to compare against.<\/p>", "prompt_text": "You are in VESC Tool, Motor Settings → FOC → General. You read Current Kp = 0.2119 and Current Ki = 56.20, and decoupling Disabled. A friend says: \"The integrator is what makes it oscillate. Set Ki to 0, it is simpler and stable.\" Before touching anything, what do you predict at standstill and at 4000 rpm with Ki = 0, and what do you answer him? What would you change instead, if anything, and where would you test it first?"}, "c2": {"kind": "error", "prompt": "<p>A colleague says: \"Feedback makes the model unnecessary. With a closed loop you do not need to know Rs, Lq or λm.\" Where is he right, and where is he wrong? Use your numbers.<\/p>", "key": ["right: the loop corrects model errors it is not told about (hot Rs, wrong λm); 1.17 V of λm error becomes ~4.9 A with P, ~0 with an integrator, instead of 42 A open loop", "wrong: the gains themselves come from the model (VESC: kp = Lq·bw, ki = Rs·bw); a wrong L gives a wrong bandwidth or instability", "wrong: the stability limit depends on Lq and the control period (Kp < L/Ts)", "wrong: feed-forward (decoupling) needs λm and L, and the 30 V limit and observer need them too"], "traps": [], "solution": "<p>Right that feedback forgives model errors: a 1.17 V λm error costs 42 A open loop and only about 5 A with a plain P loop. Wrong that you can forget the model: your VESC computes kp = Lq·bw and ki = Rs·bw from the measured R and L, the stability limit is near Lq/Ts, and any feed-forward uses λm. Feedback tolerates a model that is a bit wrong; it does not replace having one.<\/p>", "prompt_text": "A colleague says: \"Feedback makes the model unnecessary. With a closed loop you do not need to know Rs, Lq or λm.\" Where is he right, and where is he wrong? Use your numbers."}, "z0": {"kind": "explain", "prompt": "<p>Explain it as you would to an interviewer, in at most 5 lines: what the plant of your current loop is, why open loop fails on it, what a P controller does and does not fix, and what feed-forward adds.<\/p>", "key": ["plant: q axis as R-L, 1/(Lq·s + Rs), τ ≈ 4 ms, 36 A/V, with the back-EMF as a disturbance", "open loop fails: small volt errors (hot Rs, 5.5 % λm, speed) become tens of amps", "P: moves the pole to (Rs + Kp)/L (~2100 rad/s), divides the disturbance by (Rs + Kp), but always leaves an error; gain capped by the sampling delay", "feed-forward of ωe·λm removes the known part of the disturbance; feedback (with an integrator, next) removes the rest"], "traps": [], "solution": "<p>After Park, my q axis is a 28 mΩ, 113 µH coil: τ = 4 ms and 36 A per volt, with the back-EMF as a disturbance of 21 V at 4000 rpm. Open loop, a 1 V model error is 36 A, so the VESC measures the current and corrects. A P gain makes the loop ~9 times faster but always leaves an error, and at speed it cannot make the back-EMF from the error. Feed-forward adds the known back-EMF directly; the integrator, next, removes what is left.<\/p>", "prompt_text": "Explain it as you would to an interviewer, in at most 5 lines: what the plant of your current loop is, why open loop fails on it, what a P controller does and does not fix, and what feed-forward adds."}, "z1": {"kind": "doubt", "prompt": "<p>What is still unclear? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors.<\/p>", "key": [], "traps": [], "solution": "", "prompt_text": "What is still unclear? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors."}}, "hasScene": false}, {"id": "C03-K2", "cycle": "C03", "title": "\"Control 2: the PI, error and bandwidth\"", "date": "2026-11-06", "slot": "1", "minutes": "55", "lede": "In K1 a P controller on your phase left an error, and at speed it could even drive the current backwards. Today you add the integral, cancel your motor's own time constant with it, and find out how fast the loop may go before the 30 kHz sampling and the 30 V wall stop you. At the end you read your VESC's gains and see that it did exactly this.", "sources": "Franklin, Powell & Emami-Naeini, Feedback Control of Dynamic Systems, 8th ed. (ebook, no printed page numbers) §4.3.2 eqs. 4.62–4.69, §4.3.4 eqs. 4.72–4.73 and Example 4.5, §4.5, §8.5.1–8.5.2 · Åström & Murray, Feedback Systems, 2nd ed. §11.1 pp. 11-3–11-4 (eq. 11.4), §11.4 pp. 11-15–11-18 (figs. 11.10–11.11), §11.5 pp. 11-21–11-22 (eq. 11.17) · VESC firmware in 03_hardware/vesc/_firmware: motor/mcpwm_foc.c lines 4639–4695, conf_general.c line 1513 · 04_model/params/motor_params.m", "html": "\n<section class=\"sec\" id=\"s-predict\"><h2>Predict<\/h2>\n<p>Two from your open mistakes first, from memory. Then two guesses about today, with your reason.<\/p>\n<div class=\"qa\" data-q=\"r1\"><\/div>\n\n<div class=\"qa\" data-q=\"r2\"><\/div>\n\n<div class=\"qa\" data-q=\"p1\"><\/div>\n\n<div class=\"qa\" data-q=\"p2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-core\"><h2>Core: six ideas on your motor<\/h2>\n<p>Each idea starts from your phase or your VESC, then the law.<\/p>\n<article class=\"idea\"><span class=\"n\">1<\/span><div><h3>Why the integral: the back-EMF and the hot copper never go away<\/h3>\n<p>From K1: your q-axis phase is an R-L circuit, Rs = 28.02 mΩ and Lq = 112.8 µH, τ = Lq/Rs ≈ 4.0 ms. A P controller sets v = Kp·(i_ref − i). It needs an error to make any voltage at all, so in steady state there is always an error left.<\/p>\n<p>Two things make it worse on your quad:<\/p>\n<ul><li><strong>Back-EMF.<\/strong> At 4000 rpm the magnet puts 21.2 V against you on the q axis (decoupling off: nobody subtracts it). A P controller only makes that voltage out of error.<\/li><li><strong>Resistance drift.<\/strong> Your Rs is measured once, cold or at an unknown temperature. Copper rises 0.39 %/K, so a hot motor can be 20–30 % above it, and <code>foc_temp_comp = 0<\/code>.<\/li><\/ul>\n<p>Integral action fixes both. Åström and Murray give the general argument: if the loop settles at all, the integral can only be finite if the error is zero. It does not need to know R, L or the back-EMF. Franklin shows the same with the final value theorem: integral control rejects a constant disturbance exactly and is robust to plant changes.<\/p>\n<div class=\"eq\">P only, steady state:  i = (Kp·i_ref − ωe·λm) / (Rs + Kp)<\/div>\n<div class=\"qa\" data-q=\"i1\"><\/div>\n<p class=\"src\">Åström &amp; Murray §11.1, pp. 11-3–11-4 (the \"magic of integral action\": zero error whenever a steady state exists); Franklin §4.3.2, eqs. 4.62–4.69 (integral control, constant-disturbance rejection, robustness)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">2<\/span><div><h3>The PI: Kp + Ki/s, and the zero it carries<\/h3>\n<p>Your VESC's current controller is, in its own source (<code>mcpwm_foc.c<\/code>, line 4639 on):<\/p>\n<div class=\"eq\">v_int += err·ki·dt     v = v_int + err·kp<\/div>\n<p>That is the parallel PI. In Laplace form:<\/p>\n<div class=\"eq\">C(s) = Kp + Ki/s = Kp·(s + Ki/Kp) / s<\/div>\n<p>Two things are hidden in that rewrite. The <strong>pole at s = 0<\/strong> is the integrator: infinite gain at DC, so no steady error. The <strong>zero at s = −Ki/Kp<\/strong> is a frequency, in rad/s. Below it the controller acts like an integrator; above it, like a plain gain Kp. Its inverse, Ti = Kp/Ki, is the integral time. You choose where that zero sits, and the next idea tells you where.<\/p>\n<p>In steady state at speed, the error is zero, so the whole voltage comes from v_int. The integrator is the part that \"learns\" the back-EMF.<\/p>\n<div class=\"qa\" data-q=\"i2\"><\/div>\n<p class=\"src\">Franklin §4.3.4, eqs. 4.72–4.73 (PI in time and Laplace form); Åström &amp; Murray §11.1, eq. 11.4, p. 11-4; VESC mcpwm_foc.c lines 4639–4644<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">3<\/span><div><h3>Cancel your motor's pole: Ki/Kp = R/L, bandwidth ωc = Kp/L<\/h3>\n<p>Put the PI in front of your phase:<\/p>\n<div class=\"eq\">loop gain  C(s)·G(s) = Kp·(s + Ki/Kp)/s · 1/(L·s + R) = (Kp/L)·(s + Ki/Kp) / [ s·(s + R/L) ]<\/div>\n<p>If you place the zero exactly on the plant pole, Ki/Kp = R/L, the two cancel:<\/p>\n<div class=\"eq\">Ki/Kp = R/L   →   C·G = Kp / (L·s)<\/div>\n<p>What is left is a pure integrator. Closing the loop gives a first-order response with one pole at −Kp/L:<\/p>\n<div class=\"eq\">i/i_ref = 1 / (1 + s·L/Kp)    ωc = Kp/L    rise 10–90 % = ln 9 / ωc ≈ 2.2/ωc<\/div>\n<p>So design is two lines: pick the bandwidth ωc, then <strong>Kp = ωc·L<\/strong> and <strong>Ki = ωc·R<\/strong>. No overshoot, no leftover error, and the response does not depend on the step size while the voltage does not saturate. Franklin's Example 4.5 does the same thing on a thermal plant: the PI zero cancels the slow pole.<\/p>\n<aside class=\"mine\"><span>In your motor<\/span>Cancellation is only as good as your R and L. Hot copper moves R; current moves L (your Lq − Ld was measured at 40 A). A mismatch leaves a small slow tail, which the integrator still removes, just slowly.<\/aside>\n<div class=\"qa\" data-q=\"i3\"><\/div>\n<p class=\"src\">Franklin §4.3.4, Example 4.5 (the PI zero cancels the plant pole, closed loop simpler)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">4<\/span><div><h3>How fast can it be: sampling and delay set the ceiling<\/h3>\n<p>Formula says: any ωc you like, just raise Kp. Your VESC says no. It measures the current once per control period Ts, computes, and the new voltage only reaches the motor at the next PWM update. That is a delay of about one and a half periods (computing, then the hold until the next update). A delay of Td costs ωc·Td of phase at the crossover, and your integrator loop starts with 90° of phase margin:<\/p>\n<div class=\"eq\">phase margin ≈ 90° − ωc·1.5·Ts (in degrees: × 180/π)<\/div>\n<p>Franklin's rule for sample-rate selection: sample 20 to 40 times faster than the closed-loop bandwidth for a smooth response, about 25 times for disturbance rejection. Turned around, with ωs = 2π/Ts:<\/p>\n<div class=\"eq\">ωc ≤ ωs/20 (comfortable) … ωs/10 (aggressive)<\/div>\n<aside class=\"mine\"><span>In your motor<\/span>Your control period is OPEN in motor_params.m: Ts = 66.7 µs (15 kHz, assumed, with phase shunts and sample mode V0) or 33.3 µs (30 kHz). Until it is confirmed on the device, design for the slower one.<\/aside>\n<div class=\"qa\" data-q=\"i4\"><\/div>\n<p class=\"src\">Franklin §8.5.1–8.5.2 (sample rate 20–40× the bandwidth for tracking, about 25× for disturbance rejection; a faster rate reduces the delay); §4.5 (digital controllers approximate the continuous one); Åström &amp; Murray §11.5, pp. 11-21–11-22 (computer implementation, latency)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">5<\/span><div><h3>30 V is the wall: saturation, windup, anti-windup<\/h3>\n<p>Your inverter cannot give more than Vbus/√3 ≈ 30 V of vector length; the VESC keeps a margin with max duty 0.95, so it clamps at about 28.5 V (<code>mcpwm_foc.c<\/code>, line 4684). Any time the PI asks for more, the motor gets 28.5 V and the error stays large longer.<\/p>\n<p>The proportional part is harmless: it drops as soon as the error drops. The integral part is the problem. While the voltage is clamped, the error keeps feeding the integrator, which grows far past anything the inverter can give. When the error finally changes sign, the integrator must first unwind all that extra before the voltage comes off the limit: the current overshoots. That is <strong>windup<\/strong>. Åström and Murray show it on a cruise control on a steep hill.<\/p>\n<p>The cure, <strong>anti-windup<\/strong>: stop the integrator from growing while the output is saturated. Åström and Murray feed the difference between the asked and the applied output back into the integrator. Your VESC uses the simplest form: it clamps the integrator itself to the same voltage limit (<code>vd_int<\/code>, <code>vq_int<\/code> truncated at lines 4686–4695), with the d axis served first.<\/p>\n<div class=\"qa\" data-q=\"i5\"><\/div>\n<p class=\"src\">Åström &amp; Murray §11.4, pp. 11-15–11-18 (integrator windup, fig. 11.10 cruise control on a hill, fig. 11.11 anti-windup by feeding back the saturation error); §11.5, eq. 11.17, p. 11-22; Franklin §4.3.2 (anti-windup needed whenever the actuator can saturate); VESC mcpwm_foc.c lines 4684–4695<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">6<\/span><div><h3>Your VESC's own gains: it did exactly this<\/h3>\n<p>Your device, after the 2026-09-07 detections (<code>motor_params.m<\/code>): <strong>kp = 0.2119 V/A, ki = 56.20 V/(A·s)<\/strong>. The firmware computes them in <code>conf_general_calc_apply_foc_cc_kp_ki_gain()<\/code> (conf_general.c, line 1513):<\/p>\n<div class=\"eq\">bw = 1/tc    kp = L·bw    ki = R·bw<\/div>\n<p>That is the cancellation rule of idea 3. Divide back: kp/L = 0.2119/106.0 µH = 1999 rad/s and ki/R = 56.20/0.02802 = 2006 rad/s. So VESC Tool chose tc = 500 µs, ωc = 2000 rad/s, 318 Hz.<\/p>\n<p>One detail: the VESC uses the <strong>average<\/strong> L = 106 µH (its <code>foc_motor_l<\/code>), and the same gains on d and q. On your q axis (Lq = 112.8 µH) the bandwidth is really kp/Lq = 1879 rad/s; on d (Ld = 99.2 µH) it is 2135 rad/s. The zero, 265 rad/s, sits between the two plant poles, 248 (q) and 282 (d). Near enough: on q the mismatch gives only about 0.4 % overshoot.<\/p>\n<aside class=\"mine\"><span>In your motor<\/span>The XML export in <code>03_hardware/vesc/MOTOR_1.9.xml<\/code> has older values, kp 0.102 and ki 18.83 (R 18.8 mΩ, L 102 µH, bw 1000 rad/s). They follow the same rule; they are not what motor_params.m records on the device now. Read the live values in VESC Tool before trusting either.<\/aside>\n<div class=\"qa\" data-q=\"i6\"><\/div>\n<p class=\"src\">VESC firmware conf_general.c line 1513 (kp = L·bw, ki = R·bw); motor_params.m section 3 (device gains, three detections, bw = 2000 rad/s cross-checked)<\/p>\n<\/div><\/article>\n<\/section>\n<section class=\"sec\" id=\"s-lab\"><h2>Lab: touch it<\/h2>\n<p>Write your prediction before you move a slider. The lab holds the rotor still (no back-EMF), samples at 30 kHz and applies each voltage one period late, like the VESC.<\/p>\n<div class=\"labbox\" data-lab=\"piloop\" data-title=\"Closing the current loop\"><\/div>\n\n<div class=\"qa\" data-q=\"l1\"><\/div>\n\n<div class=\"qa\" data-q=\"l2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-judgement\"><h2>Judgement<\/h2>\n<p>Reason from what you know is true, not from what sounds familiar.<\/p>\n<div class=\"qa\" data-q=\"c1\"><\/div>\n\n<div class=\"qa\" data-q=\"c2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-close\"><h2>Close<\/h2>\n\n<div class=\"qa\" data-q=\"z0\"><\/div>\n\n<div class=\"qa\" data-q=\"z1\"><\/div>\n\n<\/section>", "questions": {"r1": {"kind": "recall", "prompt": "<p>Your VESC runs its PWM at 30 kHz. When you open the throttle, what does the VESC change in the PWM, and what stays fixed? And roughly how many times per second can it measure the current and correct the voltage?<\/p>", "key": ["it changes the duty cycle (the fraction of each period a switch is on); the frequency stays fixed at 30 kHz (foc_f_zv)", "the current loop runs once per PWM period or once every two: 30 000 or 15 000 times a second (which one is still OPEN for his FSESC)", "so the loop can never react faster than one period, 33 or 67 µs"], "traps": ["\"it changes the frequency\" (his mistake #5)", "assuming the loop runs faster than the PWM"], "solution": "<p>The duty cycle changes; the 30 kHz stays. The VESC measures and corrects once per PWM period or once every two, so 30 000 or 15 000 times a second. Which of the two your FSESC does is still open in motor_params.m. Today that number becomes the ceiling on how fast your current loop can be.<\/p>", "prompt_text": "Your VESC runs its PWM at 30 kHz. When you open the throttle, what does the VESC change in the PWM, and what stays fixed? And roughly how many times per second can it measure the current and correct the voltage?"}, "r2": {"kind": "recall", "prompt": "<p>Fixed voltage on a DC motor, the quad starts climbing a hill and slows down. What happens to the current, and with which equation?<\/p>", "key": ["I = (V − E)/R: the speed drops, so the back-EMF E drops, so the current rises", "this is voltage mode; his VESC is in current mode, where the current loop forces the current", "the back-EMF is something the current loop has to fight: today it is the \"disturbance\" the integral removes"], "traps": ["\"current and torque stay the same\" (his mistake #15)"], "solution": "<p>With fixed V, I = (V − E)/R. Slower means less E, so more current. That is voltage mode. Your VESC is in current mode: its loop holds the current, and to do it it must produce exactly the volts the back-EMF eats. Today you see which part of the controller does that.<\/p>", "prompt_text": "Fixed voltage on a DC motor, the quad starts climbing a hill and slows down. What happens to the current, and with which equation?"}, "p1": {"kind": "predict", "prompt": "<p>A controller term adds up the error over time: u = Ki·∫e dt. The error has been exactly zero for a full second. What is that term's output now: zero, or something else? Why?<\/p>", "key": ["not necessarily zero: it holds whatever it accumulated before, the area under the past error", "that held value is what lets the loop give a non-zero voltage with zero error"], "traps": [], "solution": "<p>Not zero. The integral holds the area of all the error it saw before. With zero error it stops changing but keeps its value. That is the whole trick of today: a constant output with zero error.<\/p>", "prompt_text": "A controller term adds up the error over time: u = Ki·∫e dt. The error has been exactly zero for a full second. What is that term's output now: zero, or something else? Why?"}, "p2": {"kind": "predict", "prompt": "<p>In a PI, u = Kp·e + Ki·∫e dt. Which of the two gains do you think sets how fast the current follows a step, and which one only removes the leftover error? Guess and say why.<\/p>", "key": ["Kp sets the speed (for his R-L phase, bandwidth ≈ Kp/L)", "Ki, set right, only removes the steady error and should cancel the plant's slow pole; raising it mostly adds overshoot"], "traps": [], "solution": "<p>Kp sets the speed: for your phase the loop bandwidth is about Kp/L. Ki, chosen well, cancels the motor's slow pole and removes the leftover error; pushing it higher buys overshoot more than speed. You will prove both today.<\/p>", "prompt_text": "In a PI, u = Kp·e + Ki·∫e dt. Which of the two gains do you think sets how fast the current follows a step, and which one only removes the leftover error? Guess and say why."}, "i1": {"kind": "calc", "prompt": "<p>Use a P controller with Kp = 0.2119 V/A (your VESC's proportional gain) and ask for 40 A on q. Compute the steady current (a) at standstill and (b) at 4000 rpm, with no back-EMF feedforward. What does (b) mean on the quad?<\/p>", "key": ["(a) i = 0.2119·40 / (0.02802 + 0.2119) = 35.3 A, an 11.7 % error", "(b) ωe·λm = 1257 × 0.016855 = 21.18 V; i = (8.48 − 21.18)/0.2399 = −53 A", "(b) the current goes negative: the motor brakes while you ask for drive torque", "an integrator removes both errors without knowing R or λm"], "traps": ["forgetting the back-EMF (treating 4000 rpm like standstill)", "using mechanical speed, 419 rad/s, instead of ωe = 1257 rad/s"], "solution": "<p>(a) 0.2119 × 40 / 0.2399 = 35.3 A: almost 12 % short. (b) The back-EMF is 21.18 V and the controller makes only 8.48 V from a 40 A error, so the current ends at (8.48 − 21.18)/0.2399 = −53 A. You ask for drive and get braking. No real P gain fixes this. An integrator does: it keeps adding volts until the error is zero, whatever R and λm are.<\/p>", "prompt_text": "Use a P controller with Kp = 0.2119 V/A (your VESC's proportional gain) and ask for 40 A on q. Compute the steady current (a) at standstill and (b) at 4000 rpm, with no back-EMF feedforward. What does (b) mean on the quad?"}, "i2": {"kind": "calc", "prompt": "<p>Your VESC's gains: kp = 0.2119 V/A, ki = 56.20 V/(A·s). (a) Where is the PI zero, in rad/s, and what is Ti? Compare it with your q-axis R/L. (b) At 4000 rpm, steady, iq = 40 A, id = 0: how many volts does the q integrator hold?<\/p>", "key": ["(a) zero at Ki/Kp = 56.20/0.2119 = 265 rad/s; Ti = 3.77 ms", "(a) q-axis plant pole R/Lq = 0.02802/112.77 µH = 248 rad/s (τ = 4.02 ms): the zero sits almost on it", "(b) error zero, so vq = v_int = Rs·iq + ωe·λm = 1.12 + 21.18 = 22.30 V", "the integrator holds the back-EMF because decoupling is off"], "traps": ["giving the zero in Hz without saying so (265 rad/s = 42 Hz)", "thinking Kp·e makes the steady voltage (e = 0 in steady state)"], "solution": "<p>(a) Zero at 265 rad/s, Ti = 3.77 ms, against a plant pole at 248 rad/s (τ = 4.02 ms). Not a coincidence: next idea. (b) In steady state e = 0, so the proportional term is zero and the integrator carries all 22.30 V, 21.18 of them back-EMF. With decoupling off, that is its job.<\/p>", "prompt_text": "Your VESC's gains: kp = 0.2119 V/A, ki = 56.20 V/(A·s). (a) Where is the PI zero, in rad/s, and what is Ti? Compare it with your q-axis R/L. (b) At 4000 rpm, steady, iq = 40 A, id = 0: how many volts does the q integrator hold?"}, "i3": {"kind": "calc", "prompt": "<p>You want ωc = 3000 rad/s on your q axis. Compute Kp and Ki, and predict the 10–90 % rise time of a current step. Then: the motor is hot and Rs is 25 % higher than you designed for. Does the current still reach the reference? What changes?<\/p>", "key": ["Kp = 3000 × 112.77 µH = 0.338 V/A; Ki = 3000 × 0.02802 = 84.1 V/(A·s)", "rise 10–90 % = 2.197/3000 = 0.73 ms", "hot: the zero no longer sits on the pole (248 vs 311 rad/s); the response gets a small slow tail, about 1 % short after 5 ms at ωc = 2000, but the integrator still brings the error to zero", "what does not change: zero steady error (integral action does not need R)"], "traps": ["Ki = ωc·L or Kp = ωc·R (swapped)", "\"a hot motor gives a steady current error\": not with an integrator", "using Ld (99 µH) for the q loop"], "solution": "<p>Kp = 0.338 V/A, Ki = 84.1 V/(A·s), rise ≈ 0.73 ms. Hot motor: R/L is now 311 instead of 248 rad/s, so the cancellation is off. The loop gets a slow tail: at ωc = 2000 the step is still about 1 % short after 5 ms and the rise stretches from 1.10 to 1.20 ms. But it gets there: the integrator does not care what R is. Mismatch costs shape, not accuracy.<\/p>", "prompt_text": "You want ωc = 3000 rad/s on your q axis. Compute Kp and Ki, and predict the 10–90 % rise time of a current step. Then: the motor is hot and Rs is 25 % higher than you designed for. Does the current still reach the reference? What changes?"}, "i4": {"kind": "calc", "prompt": "<p>Compute the bandwidth ceiling ωs/10 and ωs/20 for a 30 kHz loop and for a 15 kHz loop, in rad/s and Hz. Which one do you design with today, and why? Then estimate the phase margin your VESC's ~2000 rad/s loop has at 15 kHz.<\/p>", "key": ["30 kHz: ωs = 188 500 rad/s; ωs/20 = 9425 rad/s (1500 Hz), ωs/10 = 18 850 rad/s (3000 Hz)", "15 kHz: ωs = 94 250 rad/s; ωs/20 = 4712 rad/s (750 Hz), ωs/10 = 9425 rad/s (1500 Hz)", "design ceiling today: about 4700 rad/s (15 kHz, ωs/20), because the control period is still open: take the slower one", "VESC at 2000 rad/s, Ts = 66.7 µs: lag ≈ 2000 × 1.5 × 66.7 µs = 0.20 rad = 11.5°, phase margin ≈ 78°; comfortable"], "traps": ["mixing Hz and rad/s (ωs = 2π·f)", "taking the PWM frequency as the loop rate without checking the open item", "\"faster is always better\": delay eats phase margin"], "solution": "<p>30 kHz: ceiling 9425 rad/s (comfortable) to 18 850 rad/s. 15 kHz: 4712 to 9425 rad/s. Since the period is open, design for 15 kHz and ωs/20: about 4700 rad/s, 750 Hz. Your VESC sits at about 2000 rad/s, well inside, and its delay costs only about 11° at 15 kHz: phase margin near 78°. At 9425 rad/s on a 15 kHz loop the same estimate drops to about 36°: ringing.<\/p>", "prompt_text": "Compute the bandwidth ceiling ωs/10 and ωs/20 for a 30 kHz loop and for a 15 kHz loop, in rad/s and Hz. Which one do you design with today, and why? Then estimate the phase margin your VESC's ~2000 rad/s loop has at 15 kHz."}, "i5": {"kind": "check", "prompt": "<p>Quad on the stand, wheels in the air, motor at the duty ceiling. You hold full throttle asking 100 A but only 5 A flow, for 3 s. (a) Without anti-windup, how many volts would the q integrator ask for, with ki = 56.20? (b) What happens when you put the wheels on the ground and the speed drops? (c) What does your VESC do instead?<\/p>", "key": ["(a) the error is about 95 A for 3 s: 95 × 56.20 × 3 ≈ 16 000 V asked, against 28.5 V available", "(b) when the speed drops the back-EMF falls and the current rises, but the integrator still asks thousands of volts: the voltage stays at the limit until it unwinds, so the current overshoots the 100 A request (limited only by l_current_max 120 A and l_abs_current_max 160 A)", "(c) the VESC clamps vq_int to the available voltage (about 28.5 V at 52 V), so it never stores more than the inverter can give and comes off the limit as soon as the error turns", "the 40 A battery limit still caps battery current; it does not stop a phase-current overshoot"], "traps": ["\"the voltage is limited, so there is no problem\": the stored integral is the problem, not the output", "confusing the integrator clamp with the current limits"], "solution": "<p>(a) 95 A × 56.2 × 3 s ≈ 16 000 V of \"demand\" for an inverter that has 28.5 V. (b) When the wheels load up, speed and back-EMF fall and current rises fast, but the integrator would need ages to unwind 16 000 V: the voltage sits at the limit and the current shoots past 100 A until the current limits or the unwinding stop it. (c) Your VESC clamps the integrator at the voltage limit, so it holds at most about 28.5 V and reacts the moment the error changes sign.<\/p>", "prompt_text": "Quad on the stand, wheels in the air, motor at the duty ceiling. You hold full throttle asking 100 A but only 5 A flow, for 3 s. (a) Without anti-windup, how many volts would the q integrator ask for, with ki = 56.20? (b) What happens when you put the wheels on the ground and the speed drops? (c) What does your VESC do instead?"}, "i6": {"kind": "check", "prompt": "<p>You are in VESC Tool, connected to the quad. How do you confirm which current gains are really on the device, and how would you check, with a number, that the loop has the bandwidth you think? Give the pass criterion.<\/p>", "key": ["read foc_current_kp and foc_current_ki in the motor's FOC settings (live, not the old XML); compute kp/L and ki/R: both should give about 2000 rad/s", "check the ratio ki/kp ≈ R/L (265 vs 248–282 rad/s)", "verification: rotor held (no back-EMF), a small iq step (e.g. 0 → 20 A, short, current limit set), log iq at the full sample rate, measure the 10–90 % rise", "pass criterion with a number: rise ≈ 2.2/1879 = 1.17 ms on q (say within ±20 %), overshoot below a few %, zero error after about 5 ms", "a plot that \"looks fine\" is not a criterion (his mistake #12)"], "traps": ["trusting the XML file in the repo as the device state", "\"it works when I ride, so the gains are right\": plausible is not verified"], "solution": "<p>Read kp and ki live in VESC Tool (Motor Settings, FOC), not from the old XML. Check kp/L ≈ ki/R ≈ 2000 rad/s. Then verify: rotor held, current limit set, a short 0 → 20 A step on iq, logged fast. Pass if the 10–90 % rise is about 1.17 ms (±20 %), overshoot under a few percent and no error left after about 5 ms. That number is what you write in the verification matrix, not \"it looked fine\".<\/p>", "prompt_text": "You are in
