VESC Tool, connected to the quad. How do you confirm which current gains are really on the device, and how would you check, with a number, that the loop has the bandwidth you think? Give the pass criterion."}, "l1": {"kind": "lab", "prompt": "<p>Press \"Cancel the pole\" and set Kp to 0.226 V/A (that is 2000 rad/s × Lq). Predict the 10–90 % rise time and the overshoot for a 60 A step, then read them. Now double Kp (keep cancelling): predict again. Then press \"Your VESC's gains\" and say why its dashed trace is a little slower than yours.<\/p>", "key": ["Kp = 0.226: predicted 2.2/2000 = 1.10 ms, no overshoot; the lab reads about 1.0 ms (the discrete loop differs slightly from the formula)", "Kp doubled (0.45 V/A, ωc 4000 rad/s): rise about halves (formula 0.55 ms, lab about 0.43 ms), still no overshoot", "the VESC's kp was computed with L = 106 µH, so on Lq = 113 µH its bandwidth is about 1880 rad/s: slightly slower (lab about 1.07 ms)", "the error at the end of the window is zero in all three"], "traps": ["expecting overshoot from a higher Kp: with cancellation the loop is first order"], "solution": "<p>With cancellation the loop is first order: 1.10 ms predicted, about 1.0 ms in the lab, no overshoot. Double Kp and the rise roughly halves, still no overshoot. The VESC's trace is a bit slower because it sized kp with the average L, 106 µH, not Lq: about 1880 rad/s on your q axis.<\/p>", "prompt_text": "Press \"Cancel the pole\" and set Kp to 0.226 V/A (that is 2000 rad/s × Lq). Predict the 10–90 % rise time and the overshoot for a 60 A step, then read them. Now double Kp (keep cancelling): predict again. Then press \"Your VESC's gains\" and say why its dashed trace is a little slower than yours."}, "l2": {"kind": "lab", "prompt": "<p>Keep cancelling, set Kp ≈ 1 V/A and a 100 A step. Predict first: what does the voltage trace do in the first samples, and why? Then switch anti-windup off and compare the current overshoot. Why is the difference small here but huge in the wheels-in-air case of idea 5?<\/p>", "key": ["the first voltage asked is Kp·100 = 100 V: it clamps at 30 V, so the start is a voltage-limited ramp, not the first-order curve", "with anti-windup on: almost no overshoot; off: about 3–4 % overshoot", "small here because the voltage is saturated only for a few hundred microseconds, so the integrator stores little; with the wheels in the air it saturates for seconds", "1 V/A is about 8900 rad/s, far beyond the 4700 rad/s design ceiling: the lab's 30 kHz loop tolerates it; a 15 kHz loop would ring"], "traps": ["reading the voltage-limited ramp as \"the loop is slow\""], "solution": "<p>Kp·100 A asks 100 V, so the voltage sits at the 30 V limit and the current ramps at the rate the voltage allows. Anti-windup off adds about 3–4 % overshoot: the integrator only wound up during a short saturation. In the wheels-in-air case it winds for seconds and the overshoot is no longer small. And note that 1 V/A is about 8900 rad/s, above your 4700 rad/s ceiling.<\/p>", "prompt_text": "Keep cancelling, set Kp ≈ 1 V/A and a 100 A step. Predict first: what does the voltage trace do in the first samples, and why? Then switch anti-windup off and compare the current overshoot. Why is the difference small here but huge in the wheels-in-air case of idea 5?"}, "c1": {"kind": "case", "prompt": "<p>You ride at 4000 rpm with almost no throttle (iq ≈ 0) and then snap the throttle to ask 60 A. Your VESC's gains, decoupling off. What voltage does the q-axis PI ask for in the first sample, does it fit, and what do you see in the current? What could make this transient cleaner?<\/p>", "key": ["the q integrator already holds about the back-EMF, 21.18 V; the proportional kick adds 0.2119 × 60 = 12.7 V: about 33.9 V asked", "the limit is about 28.5 V (Vbus/√3 × 0.95 duty), so it saturates: the first part of the rise is voltage-limited, slower than the 1.17 ms of the linear loop", "anti-windup (the VESC's integrator clamp) keeps it from overshooting after", "at the end vq ≈ 22.86 V and vd ≈ −8.5 V (cross-coupling): |v| ≈ 24.4 V, inside the limit, so the 60 A is reachable at this speed", "cleaner: a rate limit on the iq request (VESC ramping), or back-EMF feedforward plus a smaller step"], "traps": ["forgetting the integrator already holds the back-EMF", "checking only the steady state and not the first sample", "forgetting vd from cross-coupling in |v|"], "solution": "<p>The integrator already holds about 21.2 V of back-EMF; the 60 A error adds 12.7 V. It asks 33.9 V against about 28.5 V available, so the start is voltage-limited and slower than 1.17 ms. The clamp on the integrator stops an overshoot later. In steady state it fits: vq ≈ 22.9 V, vd ≈ −8.5 V, |v| ≈ 24.4 V. A ramped request avoids the saturation altogether.<\/p>", "prompt_text": "You ride at 4000 rpm with almost no throttle (iq ≈ 0) and then snap the throttle to ask 60 A. Your VESC's gains, decoupling off. What voltage does the q-axis PI ask for in the first sample, does it fit, and what do you see in the current? What could make this transient cleaner?"}, "c2": {"kind": "error", "prompt": "<p>A colleague: \"A PI is old school. Add a D term and make it a PID: the derivative anticipates the error, so your current loop will be faster.\" Where is he wrong for your motor?<\/p>", "key": ["the plant is first order (1/(L·s + R)): PI with cancellation already gives a clean first-order loop; the VESC source says the same (no D needed for a first-order plant)", "speed is set by Kp/L and capped by sampling and delay (≈ 4700 rad/s at 15 kHz), not by a missing D", "a derivative amplifies noise, and phase current measured next to 30 kHz switching is noisy", "D does not help with the real limits: the 30 V wall and the one-and-a-half-period delay"], "traps": ["\"derivative always adds phase margin, so more is better\""], "solution": "<p>Your phase is first order, so a PI that cancels its pole already makes the loop a clean first-order response; the VESC firmware's own comment says no D is needed for that reason. What caps speed is the sampling delay and the 30 V wall, and a D term fixes neither. It does amplify the measurement noise next to 30 kHz switching. Speed comes from Kp, up to the ceiling.<\/p>", "prompt_text": "A colleague: \"A PI is old school. Add a D term and make it a PID: the derivative anticipates the error, so your current loop will be faster.\" Where is he wrong for your motor?"}, "z0": {"kind": "explain", "prompt": "<p>Explain it as you would to an interviewer, in at most 5 lines: why your current loop needs an integral, how you would choose Kp and Ki for your motor, and what limits how fast you can make it.<\/p>", "key": ["integral: zero steady error against back-EMF (21 V at 4000 rpm, decoupling off) and resistance drift, without knowing them", "cancellation: Ki/Kp = R/L leaves Kp/(L·s); ωc = Kp/L; so Kp = ωc·L, Ki = ωc·R; VESC: 2000 rad/s (kp 0.2119, ki 56.20)", "ceiling: sampling and delay, ωc ≤ ωs/20, about 4700 rad/s at 15 kHz (control period still open)", "30 V saturation and windup; the VESC clamps its integrators"], "traps": [], "solution": "<p>A P controller needs an error to make voltage, so against 21 V of back-EMF and drifting resistance it never gets there; the integral removes the error without knowing either. I put the PI zero on the motor's pole, Ki/Kp = R/L, which leaves a pure integrator and a first-order loop with bandwidth Kp/L: Kp = ωc·L, Ki = ωc·R. My VESC did exactly that at 2000 rad/s. The ceiling is sampling and delay, about 4700 rad/s for a 15 kHz loop, and the 30 V limit, where the integrator must be clamped against windup.<\/p>", "prompt_text": "Explain it as you would to an interviewer, in at most 5 lines: why your current loop needs an integral, how you would choose Kp and Ki for your motor, and what limits how fast you can make it."}, "z1": {"kind": "doubt", "prompt": "<p>What is still unclear? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors.<\/p>", "key": [], "traps": [], "solution": "", "prompt_text": "What is still unclear? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors."}}, "hasScene": false}, {"id": "C03-L3a", "cycle": "C03", "title": "Park: riding on the rotor, and the dq equations", "date": "2026-11-04", "slot": "2", "minutes": "55", "lede": "In L2 three currents became one arrow that turns 200 times a second at 4000 rpm. Now sit on your rotor and look at that arrow from there: it stops. Two constant numbers, id and iq, and four equations that are your VESC's whole picture of the motor.", "sources": "Hughes & Drury, Electric Motors and Drives, 5th ed. §8.2.2 pp. 266–267; §8.6.2 pp. 291–294; §9.3.5 pp. 326–328; §9.5.1 pp. 342–344; §9.6.3 pp. 358–360. VESC firmware dq equations as quoted in 04_model/params/motor_params.m", "html": "\n<section class=\"sec\" id=\"s-predict\"><h2>Predict<\/h2>\n<p>Two from your open mistakes first, from memory. Then two guesses about today, with your reason.<\/p>\n<div class=\"qa\" data-q=\"r1\"><\/div>\n\n<div class=\"qa\" data-q=\"r2\"><\/div>\n\n<div class=\"qa\" data-q=\"p1\"><\/div>\n\n<div class=\"qa\" data-q=\"p2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-core\"><h2>Core: six ideas on your motor<\/h2>\n<p>Each idea starts from your rotor or your VESC, then the law. On a wide screen the motor on the right follows the idea you are reading.<\/p>\n<article class=\"idea\"><span class=\"n\">1<\/span><div><h3>Ride on the rotor: 200 Hz sines become two constant numbers<\/h3>\n<p>At 4000 rpm your phase currents oscillate at 200 Hz, and the Clarke arrow from L2 (iα, iβ) turns 200 times a second. The VESC cannot regulate that well with a PI (Predict p2). The trick: describe the arrow not on axes glued to the stator, but on axes glued to the rotor. The rotor turns at the same electrical speed as the arrow, so on its axes the arrow stops.<\/p>\n<p>Park does this: it rotates the αβ axes by the rotor's electrical angle θe. Hughes says it plainly: an observer riding with the field sees a constant phasor.<\/p>\n<div class=\"eq\">id = iα·cos θe + iβ·sin θe    iq = −iα·sin θe + iβ·cos θe<\/div>\n<div class=\"eq\">inverse:  iα = id·cos θe − iq·sin θe    iβ = id·sin θe + iq·cos θe<\/div>\n<p>It is only a rotation: it does not change the arrow's length, so with amplitude-invariant Clarke the length of (id, iq) is the phase current peak. And it holds at every instant, transients included, not only in steady state. What it needs is θe, which changes 3 times per shaft turn (θe = 3·θm).<\/p>\n<div class=\"scene-ref\" data-scene='{&quot;phases&quot;: &quot;3&quot;, &quot;field&quot;: &quot;off&quot;, &quot;currents&quot;: &quot;on&quot;, &quot;vectors&quot;: &quot;on&quot;, &quot;dq&quot;: &quot;on&quot;, &quot;labels&quot;: &quot;off&quot;, &quot;rotor&quot;: &quot;on&quot;, &quot;spin&quot;: &quot;on&quot;, &quot;speed&quot;: &quot;0.12&quot;, &quot;delta&quot;: &quot;90&quot;, &quot;caption&quot;: &quot;The d and q axes are painted on the rotor and turn with it. Watch the current arrow: against the stator it turns, against the d\\u2013q axes it stands still.&quot;}'><button type=\"button\" class=\"btn ghost show-scene\">Show it in the motor<\/button><p>dq axes riding on the rotor.<\/p><\/div>\n\n<div class=\"qa\" data-q=\"i1\"><\/div>\n<p class=\"src\">Hughes §8.2.2 and fig. 8.3, pp. 266–267 (two-stage transformation, rotating frame sees a constant phasor)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">2<\/span><div><h3>d and q on your rotor: iq pulls, id pushes on the magnet's flux<\/h3>\n<p>Look at one of your six buried magnets. The <strong>d axis<\/strong> (direct) goes through the centre of a magnet pole, along its flux. The <strong>q axis<\/strong> (quadrature) is 90° electrical ahead, which on your p = 3 rotor is 30° mechanical: the steel between two magnets. Hughes notes that on a buried-magnet rotor there are two candidates for \"direct axis\" (the magnet's and the low-reluctance one) and that the convention is the magnet's. The VESC uses the same.<\/p>\n<p>What each current does physically:<\/p>\n<ul><li><strong>iq<\/strong> makes a stator field 90° from the magnet: the compass needle of L2 pulled at right angles. All the torque comes from here, like I in B·I·l.<\/li><li><strong>id<\/strong> makes a stator field along the magnet axis. It gives no magnet torque. Positive id adds to the magnet's flux, negative id opposes it (field weakening). Your VESC has field weakening and MTPA off, so it asks id = 0 always.<\/li><\/ul>\n<div class=\"eq\">flux on d:  ψd = Ld·id + λm    flux on q:  ψq = Lq·iq    (the magnet only appears on d)<\/div>\n<aside class=\"mine\"><span>In your motor<\/span>Ld = 99 µH &lt; Lq = 113 µH: flux pushed along d must cross the magnet (μr ≈ 1, like air), flux along q runs through steel. Lq/Ld = 1.14 says \"not pure surface magnets\"; it does not prove interior magnets (your mistake #8). The real layout is not measured.<\/aside>\n<div class=\"scene-ref\" data-scene='{&quot;phases&quot;: &quot;0&quot;, &quot;field&quot;: &quot;off&quot;, &quot;currents&quot;: &quot;off&quot;, &quot;vectors&quot;: &quot;off&quot;, &quot;dq&quot;: &quot;on&quot;, &quot;labels&quot;: &quot;on&quot;, &quot;rotor&quot;: &quot;on&quot;, &quot;spin&quot;: &quot;off&quot;, &quot;caption&quot;: &quot;No current. Find a magnet, its d axis through the centre, and the q axis 30\\u00b0 mechanical ahead, between two magnets.&quot;}'><button type=\"button\" class=\"btn ghost show-scene\">Show it in the motor<\/button><p>d and q on a still rotor.<\/p><\/div>\n\n<div class=\"qa\" data-q=\"i2\"><\/div>\n<p class=\"src\">Hughes §9.3.5, fig. 9.12, pp. 326–328 (buried magnets, choice of the d axis); §9.5.1, pp. 342–344 (Iq makes torque, Id = 0 gives maximum torque per amp)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">3<\/span><div><h3>The dq voltage equations, term by term, at 4000 rpm<\/h3>\n<p>These are the equations your VESC firmware uses, quoted at the top of <code>motor_params.m<\/code>. Hughes works with phasors and ignores R; these are the same physics written per axis:<\/p>\n<div class=\"eq\">vd = Rs·id + Ld·did/dt − ωe·Lq·iq<\/div>\n<div class=\"eq\">vq = Rs·iq + Lq·diq/dt + ωe·(Ld·id + λm)<\/div>\n<p>Four kinds of term:<\/p>\n<ul><li><strong>Rs·i<\/strong>: the copper (and MOSFETs), 28 mΩ.<\/li><li><strong>L·di/dt<\/strong>: the coil resisting change. Only in transients; in steady state di/dt = 0. τ = L/R ≈ 3.5 ms (d) and 4.0 ms (q).<\/li><li><strong>ωe·L·i, cross-coupling<\/strong>: appears because you look from a turning frame. The q current makes flux Lq·iq; seen by the d axis that flux is turning, so it induces a voltage. It grows with speed.<\/li><li><strong>ωe·λm, back-EMF<\/strong>: the magnet turning. Only on q, because the magnet sits on d and its voltage leads it by 90°.<\/li><\/ul>\n<p>With id = 0 in steady state, the q equation is vq = R·iq + ωe·λm: the V = I·R + E of L1. Seen in dq, your PMSM is a DC motor plus a d axis and a cross term.<\/p>\n<aside class=\"mine\"><span>In your motor<\/span>Your VESC has decoupling OFF (<code>foc_cc_decoupling = 0<\/code>): no feedforward of ωe·λm or ωe·L·i. The PI integrators must build those volts themselves, as if they were a disturbance.<\/aside>\n<div class=\"qa\" data-q=\"i3\"><\/div>\n<p class=\"src\">dq equations: VESC firmware as quoted in 04_model/params/motor_params.m (Hughes uses the phasor form V = E + jIXs, §9.5.1, p. 343)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">4<\/span><div><h3>Torque: Te = 1.5·p·(λm + (Ld − Lq)·id)·iq<\/h3>\n<p>Torque from the power balance. With amplitude-invariant Clarke and Park (the VESC's choice), id and iq are peak phase values. Three phases deliver P = 3·Vrms·Irms = 3·(V̂/√2)·(Î/√2) = 1.5·V̂·Î. That is where 1.5 comes from: it is the price of keeping amplitudes, not a property of the motor.<\/p>\n<div class=\"eq\">P = 1.5·(vd·id + vq·iq)<\/div>\n<p>The part of that power that the back-EMF converts is 1.5·ωe·λm·iq. Set it equal to Te·ωm and use ωe = p·ωm:<\/p>\n<div class=\"eq\">Te = 1.5·p·[ λm·iq + (Ld − Lq)·id·iq ]    magnet torque + reluctance torque<\/div>\n<aside class=\"mine\"><span>In your motor<\/span>Kt = 1.5 × 3 × 16.855 mWb = 0.0758 N·m per amp of iq: 40 A gives 3.03 N·m, 120 A gives 9.10 N·m at the motor shaft. The VESC believes λm = 15.92 mWb (5.5 % low), so it thinks it makes 0.0716 N·m/A.<\/aside>\n<p>Your reluctance term: Ld − Lq = −13.5 µH. It helps only with <strong>negative<\/strong> id. Hughes: on PM/Rel rotors the reluctance share ranges from 1:4 to 1:1; yours is far smaller.<\/p>\n<div class=\"qa\" data-q=\"i4\"><\/div>\n<p class=\"src\">Hughes §9.3.5, pp. 326–327 (PM/Rel torque components); §9.5.1, p. 344 (P = E·Iq, the d.c.-machine form)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">5<\/span><div><h3>A wrong angle mixes id and iq<\/h3>\n<p>Everything above uses θe. Your VESC gets it from the three Hall sensors at low speed and from an observer (a flux estimator) above 2500–4000 ERPM, which is 830–1330 rpm at the motor. If the angle it uses is off by ε, its d–q axes are rotated by ε relative to the real magnet. It thinks it puts 40 A on q; in reality the current sits at 90° + ε from the magnet:<\/p>\n<div class=\"eq\">real id = −I·sin ε    real iq = I·cos ε<\/div>\n<p>So an angle error does two things: less torque (cos ε, the sin δ of L2 i5 seen from the rotor) and a current on d that nobody asked for. If the estimate is ahead (ε &gt; 0), you get negative id (weakening); behind, positive id. The currents still read perfect in the VESC: it measures them in its own wrong frame.<\/p>\n<div class=\"scene-ref\" data-scene='{&quot;phases&quot;: &quot;3&quot;, &quot;field&quot;: &quot;on&quot;, &quot;currents&quot;: &quot;off&quot;, &quot;vectors&quot;: &quot;on&quot;, &quot;dq&quot;: &quot;on&quot;, &quot;labels&quot;: &quot;off&quot;, &quot;rotor&quot;: &quot;on&quot;, &quot;spin&quot;: &quot;on&quot;, &quot;speed&quot;: &quot;0.12&quot;, &quot;delta&quot;: &quot;60&quot;, &quot;caption&quot;: &quot;\\u03b4 = 60\\u00b0: the stator field is 30\\u00b0 short of the q axis. Part of the current now lies on d. Watch the torque-per-amp readout.&quot;}'><button type=\"button\" class=\"btn ghost show-scene\">Show it in the motor<\/button><p>Angle error of 30°.<\/p><\/div>\n\n<div class=\"qa\" data-q=\"i5\"><\/div>\n<p class=\"src\">Hughes §9.5.1, p. 344 (torque ∝ current component at right angles to the magnet flux); §9.6.3, p. 359 (FOC locks the frame to the rotor)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">6<\/span><div><h3>What your VESC does every control period<\/h3>\n<p>Now the map for the next lessons. Every control period (one or two PWM periods at 30 kHz, so 33 or 67 µs; which one your FSESC build uses is still OPEN in <code>motor_params.m<\/code>), the VESC runs:<\/p>\n<ul><li>measure two (or three) phase currents<\/li><li><strong>Clarke<\/strong>: iU, iV, iW → iα, iβ (L2)<\/li><li><strong>angle<\/strong>: θe from Halls or observer<\/li><li><strong>Park<\/strong> with θe: → id, iq (today)<\/li><li><strong>two PI controllers<\/strong>: id towards 0, iq towards the throttle's request → vd, vq (L4)<\/li><li><strong>voltage limit<\/strong>: |v| ≤ Vbus/√3 = 30 V (L2 hexagon)<\/li><li><strong>inverse Park<\/strong> with the same θe: → vα, vβ<\/li><li><strong>SVPWM<\/strong>: → three duty cycles for the three half-bridges (L1, L2)<\/li><\/ul>\n<p>Left of Park everything turns at 200 Hz; right of it, in steady state, everything is DC. Hughes draws exactly this for a PM motor (fig. 9.29), with the flux demand set to zero.<\/p>\n<div class=\"eq\">at 200 Hz and 33 µs: 150 control periods per electrical cycle<\/div>\n<div class=\"qa\" data-q=\"i6\"><\/div>\n<p class=\"src\">Hughes §9.6.3, fig. 9.29, pp. 358–359 (FOC scheme for a PM motor, flux demand zero); §8.6.2, pp. 291–294 (two measured currents, frame transform, PI on flux and torque components)<\/p>\n<\/div><\/article>\n<\/section>\n<section class=\"sec\" id=\"s-lab\"><h2>Lab: touch it<\/h2>\n<p>Write your prediction before you move a slider. If it surprises you, say why in the same box.<\/p>\n<div class=\"labbox\" data-lab=\"park\" data-title=\"abc currents, the αβ arrow and the dq frame\"><\/div>\n\n<div class=\"qa\" data-q=\"l1\"><\/div>\n\n<div class=\"qa\" data-q=\"l2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-judgement\"><h2>Judgement<\/h2>\n<p>Reason from what you know is true, not from what sounds familiar.<\/p>\n<div class=\"qa\" data-q=\"c1\"><\/div>\n\n<div class=\"qa\" data-q=\"c2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-close\"><h2>Close<\/h2>\n\n<div class=\"qa\" data-q=\"z0\"><\/div>\n\n<div class=\"qa\" data-q=\"z1\"><\/div>\n\n<\/section>", "questions": {"r1": {"kind": "recall", "prompt": "<p>Your quad at full throttle on a hill, VESC in current control. Who decides how many amps flow in the motor phases: the hill, or you? And when can the VESC fail to deliver what you ask?<\/p>", "key": ["in current mode the throttle sets the current reference; the VESC's current loop forces it, the hill does not", "the hill only changes the speed (more load, less acceleration or the quad slows down)", "the VESC can only push the asked current while it has voltage left over the back-EMF: at high speed (duty near 0.95) the current falls below the request"], "traps": ["\"the load torque decides the current\" (his mistake #2): true in voltage mode, not in his VESC", "forgetting the voltage limit: current control is not unconditional"], "solution": "<p>You do. The throttle is a current request and the VESC's current loop forces it, whatever the hill. The hill only decides what the speed does. The limit is voltage: the current flows only if the inverter has volts left over the back-EMF (ωe·λm). Near the duty ceiling it cannot, and the current drops below what you ask. Today you see this as an equation: the q-axis voltage.<\/p>", "prompt_text": "Your quad at full throttle on a hill, VESC in current control. Who decides how many amps flow in the motor phases: the hill, or you? And when can the VESC fail to deliver what you ask?"}, "r2": {"kind": "recall", "prompt": "<p>\"More pole pairs make the motor smoother.\" What does the number of pole pairs really change, and what is the torque formula that shows it?<\/p>", "key": ["torque per amp: Te = 1.5·p·λm·iq, so Kt grows with p (0.0758 N·m/A for p = 3)", "electrical frequency at the same speed: fe = p·rpm/60", "smoothness comes from the sinusoidal waveform and the slot/winding design, not from p (his mistake #7)"], "traps": ["repeating \"smoother\" (mistake #7)", "forgetting that p also raises the electrical frequency the controller must follow"], "solution": "<p>p multiplies torque per amp (Te = 1.5·p·λm·iq, Kt = 0.0758 N·m/A with your p = 3) and the electrical frequency (fe = p·rpm/60, 200 Hz at 4000 rpm). Smoothness is about waveform shape and slots, not p. You will derive the 1.5 today.<\/p>", "prompt_text": "\"More pole pairs make the motor smoother.\" What does the number of pole pairs really change, and what is the torque formula that shows it?"}, "p1": {"kind": "predict", "prompt": "<p>You sit on your rotor, turning with it, and look at the stator current arrow from L2 while the quad cruises at constant speed and throttle. What do you see: an arrow turning, standing still, or changing length?<\/p>", "key": ["it stands still and keeps its length", "the arrow turns at ωe and the rotor turns at ωe too (synchronous machine), so relative to the rotor nothing moves"], "traps": ["\"it turns slower\" (that is an induction motor, which has slip)"], "solution": "<p>It stands still. The current arrow turns at ωe and so does the rotor, because the motor is synchronous. From the rotor it is a fixed arrow with fixed length: two constant numbers.<\/p>", "prompt_text": "You sit on your rotor, turning with it, and look at the stator current arrow from L2 while the quad cruises at constant speed and throttle. What do you see: an arrow turning, standing still, or changing length?"}, "p2": {"kind": "predict", "prompt": "<p>A PI controller has to follow a sine reference at 200 Hz. Will it track it well, with no error? Why?<\/p>", "key": ["no: a PI removes steady-state error only for constant references (the integrator wins on DC)", "on a sine it lags and loses amplitude, worse as frequency approaches the loop bandwidth (his loop: 2000 rad/s ≈ 318 Hz)", "this is the reason to change frame: in dq the reference is constant"], "traps": [], "solution": "<p>Not well. The integrator kills error only for constant (DC) targets. A 200 Hz sine is not far below your loop bandwidth (2000 rad/s ≈ 318 Hz): it would lag and lose amplitude. In the rotor frame the same reference becomes constant, and the PI is perfect again.<\/p>", "prompt_text": "A PI controller has to follow a sine reference at 200 Hz. Will it track it well, with no error? Why?"}, "i1": {"kind": "calc", "prompt": "<p>From L2: 100 A peak currents at ωt = 120° gave iα = −50 A, iβ = 86.6 A. At that instant the rotor's d axis is at θe = 30°. Compute id and iq. What does the result say about where the current sits relative to the magnet?<\/p>", "key": ["id = −50·cos 30° + 86.6·sin 30° = −43.3 + 43.3 = 0 A", "iq = 50·sin 30° + 86.6·cos 30° = 25 + 75 = 100 A", "the length is still 100 A (rotation keeps length)", "all the current is on q, 90° electrical ahead of the magnet axis: the maximum-torque position of L2 idea 5"], "traps": ["sign error in iq: it is −iα·sin θe, and iα is negative", "using mechanical degrees for θe"], "solution": "<p>id = (−50)(0.866) + (86.6)(0.5) = 0 A. iq = −(−50)(0.5) + (86.6)(0.866) = 25 + 75 = 100 A. Length 100 A, as before. The current arrow is at 120°, the d axis at 30°: the current is exactly 90° ahead of the magnet, all on q. That is δ = 90°, maximum torque per amp.<\/p>", "prompt_text": "From L2: 100 A peak currents at ωt = 120° gave iα = −50 A, iβ = 86.6 A. At that instant the rotor's d axis is at θe = 30°. Compute id and iq. What does the result say about where the current sits relative to the magnet?"}, "i2": {"kind": "check", "prompt": "<p>Your VESC asks id = 0. Why is that the efficient choice for your motor below base speed? And what would id = +30 A do to the magnet flux and to the copper?<\/p>", "key": ["torque per amp (magnet part) depends only on iq, so any id is current that heats copper (loss ∝ id² + iq²) without magnet torque", "id = 0 gives maximum torque per amp for a non-salient motor; Hughes: current in phase with E gives minimum copper loss for that torque", "id = +30 A strengthens the d-axis flux (ψd = λm + Ld·id): more back-EMF-like voltage, more saturation risk, more copper loss", "with his small saliency the reluctance term with positive id even subtracts torque, since Ld − Lq < 0"], "traps": ["\"id makes torque too\" without the saliency caveat", "\"positive id weakens the field\" (sign: negative id weakens)"], "solution": "<p>Copper loss goes with id² + iq², but magnet torque only with iq. Any id is heat for nothing (Hughes: current in phase with E gives the most torque per amp). id = +30 A adds Ld·id ≈ 3 mWb to the 16.9 mWb of the magnet: more flux, more voltage needed at speed, more saturation, more loss. With Ld &lt; Lq it even removes a little torque through the reluctance term (idea 4).<\/p>", "prompt_text": "Your VESC asks id = 0. Why is that the efficient choice for your motor below base speed? And what would id = +30 A do to the magnet flux and to the copper?"}, "i3": {"kind": "calc", "prompt": "<p>Your motor at 4000 rpm, steady state, iq = 40 A, id = 0. Compute ωe, then each term of vd and vq, and |v|. Does it fit in the 30 V peak your 52 V bus gives with SVPWM?<\/p>", "key": ["ωe = 3 × 4000 × 2π/60 = 1257 rad/s (200 Hz)", "vd = −ωe·Lq·iq = −1257 × 112.8 µH × 40 = −5.67 V", "vq = Rs·iq + ωe·λm = 1.12 + 21.18 = 22.30 V", "|v| = √(5.67² + 22.30²) = 23.0 V < 30 V: it fits, about 7 V of margin", "back-EMF is 95 % of vq; the copper drop is tiny"], "traps": ["using mechanical ω (419 rad/s) instead of electrical", "saying vd = 0 because id = 0 (the cross term is there)", "forgetting the L·di/dt terms are zero only in steady state"], "solution": "<p>ωe = 1257 rad/s. vd = −1257 · 112.8e-6 · 40 = −5.67 V, all from cross-coupling. vq = 0.028 · 40 + 1257 · 0.016855 = 1.12 + 21.18 = 22.30 V. |v| = 23.0 V, below 30 V: the VESC still has about 7 V to push current changes. Note who dominates: the back-EMF, 21 V of 23.<\/p>", "prompt_text": "Your motor at 4000 rpm, steady state, iq = 40 A, id = 0. Compute ωe, then each term of vd and vq, and |v|. Does it fit in the 30 V peak your 52 V bus gives with SVPWM?"}, "i4": {"kind": "calc", "prompt": "<p>iq = 40 A. Compute the torque with id = 0. Then with id = −20 A: how much does the reluctance term add, in N·m and in % of the magnet torque? Is MTPA worth switching on for your motor?<\/p>", "key": ["id = 0: Te = 0.0758 × 40 = 3.03 N·m", "id = −20 A: (Ld − Lq)·id = (−13.54 µH)(−20) = +0.27 mWb, which is 1.6 % of λm", "Te = 1.5 × 3 × (16.855 + 0.271) mWb × 40 = 3.08 N·m, about +0.05 N·m", "but the current magnitude grew from 40 to 44.7 A (+25 % copper loss for +1.6 % torque): MTPA on his motor buys almost nothing"], "traps": ["forgetting the sign: with Ld < Lq, positive id removes torque", "comparing at equal iq but not at equal total current"], "solution": "<p>id = 0: 3.03 N·m. id = −20 A: the reluctance term adds 13.54e-6 × 20 = 0.27 mWb of \"equivalent flux\", 1.6 % of λm, so 3.08 N·m. But |i| went from 40 to 44.7 A, which is 25 % more copper loss for 1.6 % more torque. With saliency this small, MTPA has almost nothing to find: id = 0 is close to optimal. Remember the saliency itself changes with current (measured 13.5 µH at 40 A, more at 98 A).<\/p>", "prompt_text": "iq = 40 A. Compute the torque with id = 0. Then with id = −20 A: how much does the reluctance term add, in N·m and in % of the magnet torque? Is MTPA worth switching on for your motor?"}, "i5": {"kind": "calc", "prompt": "<p>The observer is 30° electrical ahead of the real rotor. The VESC holds iq = 40 A, id = 0 in its frame. What are the real id and iq, and the real torque? What does VESC Tool show for Id and Iq?<\/p>", "key": ["real id = −40·sin 30° = −20 A, real iq = 40·cos 30° = 34.6 A", "real torque = 1.5·3·(16.855 + 0.271) mWb × 34.6 A ≈ 2.67 N·m vs 3.03 expected (−12 %)", "same copper loss (still 40 A), less torque", "VESC Tool shows Id ≈ 0 and Iq ≈ 40 A: it measures in its own (wrong) frame, so the error is invisible in the current plots"], "traps": ["\"the VESC would see the error in Id\": no, it computes Id with the wrong angle", "forgetting the reluctance term changes sign with the sign of ε"], "solution": "<p>Real id = −20 A, real iq = 34.6 A. Torque ≈ 2.67 N·m instead of 3.03 (−12 %); with ε = −30° it would be 2.59 N·m, since then id = +20 A and the reluctance term subtracts. VESC Tool shows Id ≈ 0, Iq ≈ 40 A: the controller is happy because it measures in its own frame. You only see the error indirectly: less acceleration, more amps for the same torque, a voltage vector that does not match the model.<\/p>", "prompt_text": "The observer is 30° electrical ahead of the real rotor. The VESC holds iq = 40 A, id = 0 in its frame. What are the real id and iq, and the real torque? What does VESC Tool show for Id and Iq?"}, "i6": {"kind": "check", "prompt": "<p>In that chain, which signals are constant at steady 4000 rpm and constant throttle, and which oscillate at 200 Hz? Where does θe enter, and what happens to the motor if the Hall cable falls off while you ride at 500 rpm?<\/p>", "key": ["constant: id, iq, their references, vd, vq (DC in the rotor frame)", "200 Hz: iU, iV, iW, iα, iβ, vα, vβ and the three duties", "θe enters twice: in Park (measure) and in inverse Park (act); an error in it corrupts both", "at 500 rpm (1500 ERPM, below the 2500 ERPM blend) the VESC depends on the Halls: without them it has no angle, the frame is wrong, torque collapses or the motor jerks/stalls; the observer only takes over above 2500–4000 ERPM"], "traps": ["\"the PI outputs oscillate\": in steady state they are constant", "forgetting that inverse Park also uses θe"], "solution": "<p>Constant: id, iq, their references and the PI outputs vd, vq. At 200 Hz: phase currents, iα/iβ, vα/vβ, duties. θe enters twice, in Park and in inverse Park. At 500 rpm you are at 1500 ERPM, below the Hall-to-observer blend (2500–4000 ERPM), so the angle comes only from the Halls: lose them and the VESC loses the frame. Expect jerks, a fault, or no torque. Above ~1330 rpm the observer would carry on.<\/p>", "prompt_text": "In that chain, which signals are constant at steady 4000 rpm and constant throttle, and which oscillate at 200 Hz? Where does θe enter, and what happens to the motor if the Hall cable falls off while you ride at 500 rpm?"}, "l1": {"kind": "lab", "prompt": "<p>Set iq = 40 A, id = 0, angle error 0. Predict first: when you double the speed, what happens to the three phase currents, to the αβ arrow, and to the id and iq readouts? Then do it.<\/p>", "key": ["phase currents: same 40 A peak, twice the frequency", "αβ arrow: same length, turns twice as fast", "id and iq: unchanged (0 and 40 A), they do not care about speed", "the speed shows up in the dq voltages (back-EMF and cross terms), not in the currents"], "traps": [], "solution": "<p>The sines keep their 40 A peak but go twice as fast; the αβ arrow turns twice as fast at the same length; id = 0 and iq = 40 A do not move. Speed does not appear in the dq currents at all. It appears in the dq voltages, through ωe·λm and ωe·L·i.<\/p>", "prompt_text": "Set iq = 40 A, id = 0, angle error 0. Predict first: when you double the speed, what happens to the three phase currents, to the αβ arrow, and to the id and iq readouts? Then do it."}, "l2": {"kind": "lab", "prompt": "<p>Now set an angle error of 30°, then 90°. Predict the real id and iq before moving it. At 90°, what does the motor do, and where does the power go?<\/p>", "key": ["30°: real iq ≈ 34.6 A, real id ≈ ±20 A (sign depends on the sign of the error)", "90°: real iq = 0, all 40 A on d: no torque", "at 90° all electrical power goes to copper heat: 1.5·Rs·i² = 67 W for 40 A"], "traps": ["\"at 90° the motor runs backwards\": no, zero torque; it would take more than 90° to reverse it"], "solution": "<p>30°: iq ≈ 34.6 A, id ≈ ±20 A. 90°: iq = 0 and the full 40 A on d. No torque, and the 1.5 × 0.028 × 40² = 67 W all heat the copper. Beyond 90° the torque changes sign.<\/p>", "prompt_text": "Now set an angle error of 30°, then 90°. Predict the real id and iq before moving it. At 90°, what does the motor do, and where does the power go?"}, "c1": {"kind": "case", "prompt": "<p>You are in VESC Tool with the Realtime data plots open on Id and Iq. (a) Quad on a stand, rear wheels in the air, you hold the throttle still at a medium position. (b) Quad on the ground, brake fully on, you ask about 20 A of throttle for two seconds. What should Id and Iq read in each case, and why? Which number in (a) can you not predict yet?<\/p>", "key": ["(a) the wheels spin up until the motor is at the duty ceiling (or a speed where drag equals the asked torque); Iq settles at the small current that just covers the drivetrain drag, not the throttle request", "(a) Id ≈ 0 in both cases: FW and MTPA off, id_ref = 0", "(b) standstill, ωe = 0: Iq ≈ 20 A, steady, as asked (current mode); torque 0.0758 × 20 ≈ 1.5 N·m at the motor; vq ≈ Rs·iq = 0.56 V, duty below 2 %", "(b) at standstill all 20 A is copper heat (≈ 17 W): keep it short; the Halls give the angle at zero speed", "the drag current of (a) with chain and rear wheels is not measured (motor alone: 1.88 A at 5480 rpm)"], "traps": ["\"Iq follows the throttle on the stand\": at the voltage limit it cannot", "\"Iq = 0 at standstill because nothing turns\": torque without motion still needs iq", "\"Id is negative to weaken the field\": field weakening is off"], "solution": "<p>(a) The light load lets the motor spin up until it hits the duty ceiling, so the current loop can no longer push the asked current: Iq falls to whatever the drivetrain drag needs. That is a few amps, not measured with the chain on (motor alone: 1.88 A at 5480 rpm). Id stays near 0. (b) Brake on, speed zero: no back-EMF, so Iq sits at the asked 20 A (≈ 1.5 N·m at the motor) with vq ≈ 0.56 V, under 2 % duty. Id ≈ 0. All 17 W goes to heat in the copper: keep it short. The Halls give the angle at zero speed.<\/p>", "prompt_text": "You are in VESC Tool with the Realtime data plots open on Id and Iq. (a) Quad on a stand, rear wheels in the air, you hold the throttle still at a medium position. (b) Quad on the ground, brake fully on, you ask about 20 A of throttle for two seconds. What should Id and Iq read in each case, and why? Which number in (a) can you not predict yet?"}, "c2": {"kind": "error", "prompt": "<p>A colleague says: \"With id = 0 the motor needs no voltage on the d axis, so vd = 0. The VESC's d-axis PI only matters in field weakening.\" Where is he wrong? Use your 4000 rpm numbers.<\/p>", "key": ["vd = Rs·id + Ld·did/dt − ωe·Lq·iq: with id = 0 the cross-coupling term remains", "at 4000 rpm and iq = 40 A, vd = −5.67 V, a quarter of |v|", "the d-axis PI must create those volts to hold id at 0; with decoupling off, its integrator does it", "if the d loop were open, the cross term would drive id away from 0 and tilt the current off the q axis"], "traps": [], "solution": "<p>The cross-coupling term: vd = −ωe·Lq·iq = −5.67 V at 4000 rpm and 40 A, about a quarter of the 23 V total. id = 0 does not mean vd = 0. The d PI must supply those volts all the time, more at higher speed and current, and your VESC does it without feedforward (decoupling off), only with its integrator. Without it, id would drift away from zero.<\/p>", "prompt_text": "A colleague says: \"With id = 0 the motor needs no voltage on the d axis, so vd = 0. The VESC's d-axis PI only matters in field weakening.\" Where is he wrong? Use your 4000 rpm numbers."}, "z0": {"kind": "explain", "prompt": "<p>Explain it as you would to an interviewer, in at most 5 lines: what Park does, what id and iq mean on your rotor, and why your VESC works in dq instead of on the three phase currents.<\/p>", "key": ["Park rotates the αβ frame by the rotor angle θe; in steady state the currents become constant (id, iq)", "d axis through the magnet, q 90° electrical ahead; iq makes torque (Te = 1.5·p·λm·iq, 0.0758 N·m/A), id strengthens or weakens the magnet flux; VESC holds id = 0", "constant references let two PIs work with zero steady-state error, which they cannot on 200 Hz sines", "it all depends on the angle (Halls, then observer): a wrong angle mixes id and iq and loses torque"], "traps": [], "solution": "<p>Park rotates the stator-fixed current arrow into a frame glued to the rotor, using the electrical angle θe. On my rotor, d goes through a magnet and q sits between magnets. iq makes the torque, 0.0758 N·m per amp; id only strengthens or weakens the magnet's flux, so my VESC holds it at zero. In that frame the 200 Hz sines are constants, so two simple PIs regulate them with no error. The price is the angle: Halls at low speed, an observer above, and an error in it mixes id and iq.<\/p>", "prompt_text": "Explain it as you would to an interviewer, in at most 5 lines: what Park does, what id and iq mean on your rotor, and why your VESC works in dq instead of on the three phase currents."}, "z1": {"kind": "doubt", "prompt": "<p>What is still unclear? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors.<\/p>", "key": [], "traps": [], "solution": "", "prompt_text": "What is still unclear? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors."}}, "hasScene": true}, {"id": "C03-L3b", "cycle": "C03", "title": "Torque, limits and the id–iq plane", "date": "2026-11-05", "slot": "1", "minutes": "55", "lede": "Your quad pulls hard from standstill, stops pulling harder at about 10 km/h and runs out of speed near 37 km/h. Three different walls cause that, and all three fit on one picture: the id–iq plane of your motor.", "sources": "Hughes & Drury, Electric Motors and Drives, 5th ed. §9.5.1 pp. 342–344, §9.5.2 pp. 345–349, §9.6.3 pp. 358–360, §9.7.3 p. 365, §9.7.4 pp. 366–367, §8.6.1 pp. 287–290", "html": "\n<section class=\"sec\" id=\"s-predict\"><h2>Predict<\/h2>\n<p>Two of your open mistakes first, from memory. Then one guess about today, with your reason.<\/p>\n<div class=\"qa\" data-q=\"r1\"><\/div>\n\n<div class=\"qa\" data-q=\"r2\"><\/div>\n\n<div class=\"qa\" data-q=\"p1\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-core\"><h2>Core: six ideas on your motor<\/h2>\n<p>Short recall from L3a: in the rotor frame your motor is two DC-like circuits, d (along a magnet) and q (90° electrical ahead). In steady state:<\/p>\n<div class=\"eq\">vd = Rs·id − ωe·Lq·iq    vq = Rs·iq + ωe·(Ld·id + λm)    Te = 1.5·p·(λm + (Ld − Lq)·id)·iq<\/div>\n<p>Every operating point of your motor is one dot on a plane with id across and iq up. Today you draw the fence around that dot.<\/p>\n<article class=\"idea\"><span class=\"n\">1<\/span><div><h3>The current circle: 120 A is the motor's wall, not the battery's<\/h3>\n<p>Open VESC Tool, Motor Settings → Current: <strong>Motor current max = 120 A<\/strong>. That number limits the length of the current arrow you met in Clarke, whatever direction it points. On the id–iq plane that is a circle:<\/p>\n<div class=\"eq\">id² + iq² ≤ 120²<\/div>\n<p>Why 120 A? Heat. Copper loss is 1.5·Rs·|i|² = 605 W at 120 A in your 28 mΩ phases (MOSFETs included), and the VESC's MOSFETs and the motor winding (no temperature sensor fitted!) can only take that for seconds. With id = 0 the top of the circle is iq = 120 A, Te = 0.0758 × 120 = <strong>9.1 N·m<\/strong>, which through 92/11 and a 0.155 m wheel is about 470 N of push.<\/p>\n<p><strong>Battery current max = 40 A<\/strong> is a different wall in a different place: it lives on the DC side of the inverter. The inverter turns battery power into motor power, so the two currents are linked by power, never by a fixed factor:<\/p>\n<div class=\"eq\">Vbat·Ibat ≈ 1.5·(vd·id + vq·iq)    (ideal inverter; real one: divide by its efficiency)<\/div>\n<aside class=\"mine\"><span>In your motor<\/span>At low speed the motor needs few volts, so 120 A in the phases costs little battery current. At high speed it needs many volts, so even modest phase current costs a lot. The 40 A wall is a power wall: about 52 V × 40 A ≈ 2.1 kW.<\/aside>\n<div class=\"qa\" data-q=\"i1\"><\/div>\n<p class=\"src\">Hughes §9.7.4, pp. 366–367 (intermittent torque region set by the converter's maximum current; I²R limit)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">2<\/span><div><h3>The voltage circle: why your quad stops at 5480 rpm<\/h3>\n<p>Your VESC runs SVPWM. In L2 you found the largest round voltage arrow it can make: Vbus/√3 = <strong>30 V peak<\/strong> at 52 V. The firmware also caps the duty at 0.95, so in practice the ceiling is 0.95 × 30 = 28.5 V. Every steady operating point must satisfy<\/p>\n<div class=\"eq\">vd² + vq² ≤ Vmax²    Vmax = 0.95·Vbus/√3<\/div>\n<p>At no load (id ≈ 0, iq ≈ 0) almost all of that voltage is back-EMF, ωe·λm. So the no-load speed is where the back-EMF alone fills the circle:<\/p>\n<div class=\"eq\">ωe,max ≈ Vmax / λm<\/div>\n<aside class=\"mine\"><span>In your motor<\/span>You measured this on 7-Sep: held at duty 0.9486 with 52.77 V on the bus, the VESC logged 16 440 ERPM (5480 rpm) and |v| = 28.9 V. λm·ωe = 0.016855 × 1722 = 29.0 V. The back-EMF had eaten the whole circle.<\/aside>\n<div class=\"qa\" data-q=\"i2\"><\/div>\n<p class=\"src\">Hughes §8.6.1, pp. 287–290 (SVPWM, Vbus/√3); §9.5.2, p. 345 (the voltage the inverter can produce sets base speed)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">3<\/span><div><h3>The voltage ellipse shrinks with speed: the corner where full torque ends<\/h3>\n<p>Put the steady-state voltages into the voltage circle and drop the small R terms. It becomes a limit on the currents:<\/p>\n<div class=\"eq\">(Lq·iq)² + (Ld·id + λm)² ≤ (Vmax / ωe)²<\/div>\n<p>On the id–iq plane this is an <strong>ellipse<\/strong>. Its centre is at id = −λm/Ld = <strong>−170 A<\/strong>, iq = 0, because there the stator flux cancels the magnet and no voltage is needed. Its size is Vmax/ωe: huge at low speed, shrinking as you speed up. Allowed points are inside <strong>both<\/strong> the circle and the ellipse.<\/p>\n<p>Full torque with id = 0 is the top of the circle, (0, 120 A). The <strong>corner speed<\/strong> (Hughes calls it base speed) is where the shrinking ellipse passes through that point. Below it you have full torque; above it the ellipse cuts the top of the circle off and the maximum torque falls.<\/p>\n<aside class=\"mine\"><span>In your motor<\/span>With 30 V and Rs included, your corner is at about 4020 rpm, 28 km/h. Without Rs the formula gives 4420 rpm: the 3.4 V of Rs·iq at 120 A is not negligible in a 30 V motor. With the 0.95 duty cap it is ~3800 rpm.<\/aside>\n<div class=\"qa\" data-q=\"i3\"><\/div>\n<p class=\"src\">Hughes §9.5.2, pp. 345–347, figs. 9.20–9.21 (full torque up to base speed, voltage ∝ speed below it)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">4<\/span><div><h3>Constant-torque curves and MTPA: why id = 0 is right for you<\/h3>\n<p>Pick a torque, say 5 N·m, and draw every (id, iq) that gives it. From the torque equation, iq = Te / (1.5·p·(λm + (Ld − Lq)·id)). In a motor with strong saliency these curves bend a lot and a negative id buys extra <strong>reluctance torque<\/strong>. Yours has Ld − Lq = −13.5 µH against λm = 16.9 mWb, so the bracket barely changes: 5 N·m needs 65.9 A of iq at id = 0 and 62.9 A at id = −60 A. The curves are almost horizontal lines.<\/p>\n<p><strong>MTPA<\/strong> (maximum torque per ampere) means: for each current size, choose the angle that gives the most torque. At 120 A your best point is id ≈ −11 A, iq ≈ 119.5 A: <strong>9.14 N·m instead of 9.10, a 0.5 % gain<\/strong>. That is less than the 14 % uncertainty of your rotor inertia and well inside the saliency's own drift with current. Hughes shows the same for a non-salient machine: with the current in phase with the back-EMF (id = 0) you get the most torque per amp and the least copper loss.<\/p>\n<aside class=\"mine\"><span>In your motor<\/span>That is why your VESC runs <code>foc_mtpa_mode = 0<\/code>, id_ref = 0 always. A table for a 0.5 % gain, built on an Lq − Ld that moves with current, is not worth it.<\/aside>\n<div class=\"qa\" data-q=\"i4\"><\/div>\n<p class=\"src\">Hughes §9.5.1, pp. 342–344 (torque from the current component at right angles to the magnet flux; Id = 0 gives maximum torque per ampere)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">5<\/span><div><h3>Field weakening: negative id pushes the ellipse, and you pay in current<\/h3>\n<p>Look at the ellipse again: its centre is at id = −170 A. If you move the operating point to the left (negative id), the stator flux partly cancels the magnet: Ld·id + λm shrinks, so the back-EMF the inverter has to fight shrinks too, and the same 30 V reaches a higher speed. That is <strong>field weakening<\/strong>. Hughes's warning is the important part: most of the current is then \"wasted\" opposing the magnet, so it is only good for short bursts.<\/p>\n<div class=\"eq\">flux the inverter sees on d: λm + Ld·id    id = −30 A → 16.86 − 2.98 = 13.88 mWb (−18 %)<\/div>\n<p>What it would buy you: with id = −30 A the no-load speed at 30 V rises from 5670 to about 6890 rpm (+21 %). What it costs:<\/p>\n<ul><li><strong>Current.<\/strong> That −30 A flows all the time, also when you only cruise, and it comes out of the same 120 A circle. Copper loss grows with |i|².<\/li><li><strong>The magnets.<\/strong> Negative id is a field pushing against them. Hot magnets and strong opposing field are how a PM motor demagnetises, and your motor has <strong>no temperature sensor<\/strong>.<\/li><li><strong>Loss of control.<\/strong> At 6800 rpm the magnet alone makes 62 V line-to-line peak against a 52 V bus. If the controller trips, the inverter diodes rectify that into the battery: uncontrolled braking and an over-voltage on the bus.<\/li><\/ul>\n<aside class=\"mine\"><span>In your motor<\/span>Your VESC has <code>foc_fw_current_max = 0<\/code>: field weakening is OFF. Every top speed you have ridden is the natural one of the magnet and the bus.<\/aside>\n<div class=\"scene-ref\" data-scene='{&quot;phases&quot;: &quot;3&quot;, &quot;field&quot;: &quot;on&quot;, &quot;currents&quot;: &quot;off&quot;, &quot;vectors&quot;: &quot;on&quot;, &quot;dq&quot;: &quot;on&quot;, &quot;labels&quot;: &quot;off&quot;, &quot;rotor&quot;: &quot;on&quot;, &quot;spin&quot;: &quot;on&quot;, &quot;speed&quot;: &quot;0.1&quot;, &quot;delta&quot;: &quot;120&quot;, &quot;caption&quot;: &quot;Stator field 120\\u00b0 ahead of the rotor instead of 90\\u00b0: part of the current now points against the magnet&#x27;s d axis. That part makes no torque; it only cancels flux.&quot;}'><button type=\"button\" class=\"btn ghost show-scene\">Show it in the motor<\/button><p>Field weakening seen from the rotor.<\/p><\/div>\n\n<div class=\"qa\" data-q=\"i5\"><\/div>\n<p class=\"src\">Hughes §9.5.2, pp. 347–349, fig. 9.22 (field weakening needs current above rated; most of it opposes the magnet); §9.6.3, pp. 358–360 (FW loop, overvoltage on loss of control); §9.7.3, p. 365 (demagnetisation and efficiency cost)<\/p>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">6<\/span><div><h3>Your quad on the plane: launch, hill and flat top speed<\/h3>\n<p>Now put the three walls together. The battery wall is not a circle on this plane, but you can draw it: for each speed, the points where 1.5·(vd·id + vq·iq) = 52 V × 40 A. As speed rises the same iq needs more voltage and more power, so the battery wall comes down from above.<\/p>\n<p>With your numbers (ideal inverter, 52 V, Crr 0.03 and CdA 0.6 assumed, wheel 0.155 m assumed):<\/p>\n<ul><li><strong>Launch, 0 → ~11 km/h.<\/strong> Dot at the top of the circle, (0, 120 A). The battery gives 21 A at 3.5 km/h and reaches 40 A at about 1550 rpm, <strong>10.8 km/h<\/strong>.<\/li><li><strong>Above ~11 km/h with full throttle.<\/strong> The battery wall pushes the dot down the iq axis: at 25 km/h only 67 A (5.1 N·m) fit in 2.1 kW. The 28 km/h corner of the current circle is never reached: the battery cuts torque first.<\/li><li><strong>Flat, top speed.<\/strong> Road load needs only ~18 A of iq. The dot sits low on the iq axis while the ellipse shrinks onto it at about <strong>5250 rpm, 36.7 km/h<\/strong>. Battery about 15 A. Voltage is the wall.<\/li><\/ul>\n<aside class=\"mine\"><span>In your motor<\/span>Your own baseline says it: \"at launch the motor-current limit is reached, then duty becomes the limit as speed rises\", and battery peaks ~40 A. Today's plane predicts a battery-limited stretch in between. Your CAN logger can check it: look for Ibat flat at 40 A while iq falls.<\/aside>\n<div class=\"qa\" data-q=\"i6\"><\/div>\n\n<\/div><\/article>\n<\/section>\n<section class=\"sec\" id=\"s-lab\"><h2>Lab: touch it<\/h2>\n<p>Write your prediction before you move the slider. If it surprises you, say why in the same box.<\/p>\n<div class=\"labbox\" data-lab=\"idiq\" data-title=\"The id–iq plane of your motor\"><\/div>\n\n<div class=\"qa\" data-q=\"l1\"><\/div>\n\n<div class=\"qa\" data-q=\"l2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-judgement\"><h2>Judgement<\/h2>\n<p>Reason from the plane, with numbers. A feeling is not an answer.<\/p>\n<div class=\"qa\" data-q=\"c1\"><\/div>\n\n<div class=\"qa\" data-q=\"c2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-close\"><h2>Close<\/h2>\n\n<div class=\"qa\" data-q=\"z0\"><\/div>\n\n<div class=\"qa\" data-q=\"z1\"><\/div>\n\n<\/section>", "questions": {"r1": {"kind": "recall", "prompt": "<p>Full throttle from standstill: the VESC pushes 120 A into the motor phases. Roughly how much current comes out of the battery in the first metre, and what links the two numbers?<\/p>", "key": ["much less than 120 A: around 20 A at a few km/h with his numbers", "the link is power: Vbat·Ibat ≈ electrical power into the motor (plus inverter losses)", "at low speed the motor voltage is small (little back-EMF), so the power is small even with 120 A", "no factor 3 and no √3 between phase and battery current"], "traps": ["\"battery current = phase current × 3\" (his error #3)", "\"120 / √3 ≈ 70 A\" (his error in the 1860 A question)"], "solution": "<p>About 20 A. Nothing ties the two currents directly; power does: Vbat·Ibat ≈ 1.5·(vd·id + vq·iq). At standstill the motor needs only a few volts (no back-EMF yet, just R·i), so 120 A in the phases is about 1 kW, which is only ~20 A from a 52 V battery. The inverter is a step-down converter: low voltage and high current on the motor side, high voltage and low current on the battery side.<\/p>", "prompt_text": "Full throttle from standstill: the VESC pushes 120 A into the motor phases. Roughly how much current comes out of the battery in the first metre, and what links the two numbers?"}, "r2": {"kind": "recall", "prompt": "<p>In current mode the throttle asks the VESC for amps. Is there any situation where the motor does NOT get the amps you ask for, even below every current limit?<\/p>", "key": ["yes: when there is not enough voltage left to push that current against the back-EMF", "the current controller saturates at its maximum voltage (duty limit)", "this happens at high speed, because the back-EMF grows with speed"], "traps": ["\"the throttle always sets the current\" (his error #2, half of it)", "\"the load decides the current\" (true only in voltage mode)"], "solution": "<p>Yes. The current only flows if there is voltage to spare to push it against the back-EMF. At high speed the back-EMF ωe·λm eats almost all the voltage the inverter can make, the PI controller hits its voltage ceiling and the current falls short of the request. That is today's second wall.<\/p>", "prompt_text": "In current mode the throttle asks the VESC for amps. Is there any situation where the motor does NOT get the amps you ask for, even below every current limit?"}, "p1": {"kind": "predict", "prompt": "<p>Riding flat out on flat ground, at top speed: which limit stops you going faster: the 120 A motor limit, the 40 A battery limit, or the voltage the inverter can make? One sentence of why.<\/p>", "key": ["the voltage limit", "at top speed on the flat the road needs little torque (tens of amps of iq, not 120)", "the battery gives only ~15 A there, far from 40 A", "the back-EMF has grown until there is no voltage left to push more current"], "traps": [], "solution": "<p>The voltage. On the flat, rolling resistance and air need only about 1.4 N·m at the motor (≈ 18 A of iq) and the battery gives about 15 A. What stops you is that the back-EMF plus the small R·i and L·di terms reach the inverter's maximum voltage (idea 2).<\/p>", "prompt_text": "Riding flat out on flat ground, at top speed: which limit stops you going faster: the 120 A motor limit, the 40 A battery limit, or the voltage the inverter can make? One sentence of why."}, "i1": {"kind": "calc", "prompt": "<p>Launch: motor at 500 rpm (about 3.5 km/h), id = 0, iq = 120 A, battery at 52 V, inverter ideal. Compute ωe, vd, vq, the electrical power and the battery current. Is the battery limit active?<\/p>", "key": ["ωe = 3 × 500 × 2π/60 = 157 rad/s", "vd = −ωe·Lq·iq = −157 × 112.8 µH × 120 ≈ −2.1 V; vq = 0.028 × 120 + 157 × 0.01686 ≈ 3.4 + 2.6 = 6.0 V", "P = 1.5 × vq × iq = 1.5 × 6.0 × 120 ≈ 1080 W (id = 0, so vd does no work)", "Ibat = 1080 / 52 ≈ 21 A: below 40 A, battery limit not active; the 120 A circle is the wall"], "traps": ["120 / √3 or 120 / 3 for the battery current (error #3)", "forgetting the 1.5 of the amplitude-invariant transform in the power", "using |v|·|i| instead of vd·id + vq·iq"], "solution": "<p>ωe = 157 rad/s. vd = −2.1 V, vq = 3.4 + 2.6 = 6.0 V. P = 1.5·(vd·0 + 6.0·120) ≈ 1080 W, of which 605 W is copper loss and ~475 W goes to the shaft. Ibat = 1080/52 ≈ 21 A. So at launch the phases carry 120 A and the battery only 21 A: the motor circle is the wall, the battery has margin.<\/p>", "prompt_text": "Launch: motor at 500 rpm (about 3.5 km/h), id = 0, iq = 120 A, battery at 52 V, inverter ideal. Compute ωe, vd, vq, the electrical power and the battery current. Is the battery limit active?"}, "i2": {"kind": "calc", "prompt": "<p>At what motor speed does the back-EMF alone reach 30 V peak? Give rpm and quad km/h (92/11, wheel 0.155 m). Compare with your measured 5480 rpm and explain the difference with numbers.<\/p>", "key": ["ωe = 30.0 / 0.016855 ≈ 1781 rad/s, ωm = 594 rad/s ≈ 5670 rpm", "quad speed ≈ 594 × 0.155 / 8.364 ≈ 11.0 m/s ≈ 39.6 km/h", "measured 5480 rpm is ~3.4 % lower", "main reason: duty cap 0.95 cuts the ceiling 5 % (28.5 V), partly offset by the higher bus on that day (52.77 V, +1.5 %); the rest is R·i and dead time (~0.19 V)"], "traps": ["forgetting the pole pairs (ωe = 3·ωm)", "using line-to-line voltage (52 V) against the phase back-EMF", "dividing by 8.364 in the wrong direction"], "solution": "<p>ωe = 30.0/0.016855 = 1781 rad/s → 594 rad/s mechanical → 5670 rpm → 39.6 km/h. Measured: 5480 rpm, 3.4 % lower. The VESC stops at duty 0.95: 0.95 × 52.77/√3 = 28.9 V, and 28.9 / 0.016855 = 1715 rad/s → 5460 rpm. Add back the 0.19 V of dead time and the small R·i of 1.9 A and you land on 5480. The model and your log agree.<\/p>", "prompt_text": "At what motor speed does the back-EMF alone reach 30 V peak? Give rpm and quad km/h (92/11, wheel 0.155 m). Compare with your measured 5480 rpm and explain the difference with numbers."}, "i3": {"kind": "calc", "prompt": "<p>Compute the corner speed with id = 0, iq = 120 A and Vmax = 30 V, first without Rs. Then say in which direction Rs moves it and why. What mechanical power is that?<\/p>", "key": ["without Rs: ωe = Vmax / √(λm² + (Lq·iq)²) = 30 / √(0.016855² + 0.01353²) ≈ 30 / 0.02161 ≈ 1389 rad/s ≈ 4420 rpm", "Rs adds Rs·iq = 3.4 V to vq, so less voltage is left for back-EMF: corner drops to ≈ 4020 rpm (~28 km/h)", "power at the corner ≈ 9.1 N·m × 421 rad/s ≈ 3.8 kW mechanical", "Lq·iq = 13.5 mWb is comparable to λm: the q-axis inductance voltage matters at 120 A"], "traps": ["using Ld instead of Lq for the iq term", "adding the voltages as scalars (30 = λm·ωe + Lq·iq·ωe) instead of in quadrature", "forgetting that 3.8 kW needs ~85 A from the battery: the battery wall comes first (idea 6)"], "solution": "<p>Without Rs: |λ| = √(16.86² + 13.53²) mWb = 21.6 mWb, ωe = 30/0.0216 = 1389 rad/s → 4420 rpm. With Rs, vq gets an extra 3.4 V, so the corner falls to ≈ 1264 rad/s → 4020 rpm, 28 km/h. Power ≈ 9.1 N·m × 421 rad/s ≈ 3.8 kW. Hold that number: 3.8 kW plus 0.6 kW of copper is about 85 A from a 52 V battery, more than twice the 40 A wall.<\/p>", "prompt_text": "Compute the corner speed with id = 0, iq = 120 A and Vmax = 30 V, first without Rs. Then say in which direction Rs moves it and why. What mechanical power is that?"}, "i4": {"kind": "calc", "prompt": "<p>Keep |i| = 120 A and compare id = 0 with id = −40 A. Compute the torque of each. Then: is the \"reluctance torque\" worth it on your motor?<\/p>", "key": ["id = 0, iq = 120 A: Te = 1.5 × 3 × 0.016855 × 120 = 9.10 N·m", "id = −40 A, iq = √(120² − 40²) = 113.1 A: Te = 1.5 × 3 × (0.016855 + 13.54e-6 × 40) × 113.1 ≈ 8.86 N·m", "id = −40 A loses 2.7 %: the reluctance term (+0.54 mWb) is smaller than what iq loses", "the true optimum is id ≈ −11 A for +0.5 %: not worth it; id = 0 is correct"], "traps": ["the sign: (Ld − Lq)·id is positive only for negative id, because Ld < Lq", "comparing at the same iq instead of the same |i| (that hides the extra current and heat)"], "solution": "<p>id = 0: 9.10 N·m. id = −40 A: iq = 113.1 A, flux term 16.855 + 0.54 = 17.40 mWb, Te = 8.86 N·m, 2.7 % LESS for the same amps. The reluctance torque is real but tiny, while the iq you give up is not. The optimum (id ≈ −11 A) gains 0.5 %. On your motor, id = 0 is MTPA for all practical purposes.<\/p>", "prompt_text": "Keep |i| = 120 A and compare id = 0 with id = −40 A. Compute the torque of each. Then: is the \"reluctance torque\" worth it on your motor?"}, "i5": {"kind": "case", "prompt": "<p>A friend says: \"Just set Field Weakening Current to 40 A in VESC Tool and the quad goes 25 % faster, free.\" You are in VESC Tool. What do you answer, and what would you need to have in place before even trying it?<\/p>", "key": ["it is not free: the extra −id adds to |i| and copper loss at every high-speed point, and eats into the 120 A circle", "demagnetisation risk with no motor temperature sensor fitted", "loss of control above ~5700 rpm: back-EMF above the bus, uncontrolled current through the diodes into the battery (BMS regen limit 35 A)", "before trying: a motor temperature sensor, a requirement with a number (how much speed, for how long), a test with the wheels off the ground and current/temperature logged, and a decision on what happens on a fault"], "traps": ["\"it is software, so it cannot break anything\"", "thinking field weakening adds power: it adds speed, at roughly the same or more current"], "solution": "<p>Not free. Every amp of negative id is current that makes no torque, adds copper loss and takes room from the 120 A circle; Hughes says FW in a PM motor is intermittent for this reason. It pushes against hot magnets in a motor with no temperature sensor. And above ~5700 rpm a controller trip leaves a back-EMF higher than the bus, which pumps current through the diodes into the battery. Before trying: a temperature sensor on the winding, a requirement (speed gain, duration), and a wheels-up test with current, temperature and bus voltage logged.<\/p>", "prompt_text": "A friend says: \"Just set Field Weakening Current to 40 A in VESC Tool and the quad goes 25 % faster, free.\" You are in VESC Tool. What do you answer, and what would you need to have in place before even trying it?"}, "i6": {"kind": "case", "prompt": "<p>You ride up a long 20 % hill with full throttle. Which limit holds you, at what speed, roughly, and how would you prove it from a VESC log? Then the same question on the flat at top speed.<\/p>", "key": ["20 % hill: the battery wall, at about 25 km/h, iq ≈ 67 A; voltage still has margin (|v| ≈ 22.5 V of 28.5 V)", "proof on the hill: Ibat sits at 40 A while iq is below 120 A and duty below 0.95", "flat: the voltage wall at ~37 km/h, iq ≈ 18 A, Ibat ≈ 15 A", "proof on the flat: duty at 0.95 while iq is below what the throttle asks and Ibat far below 40 A"], "traps": ["\"the 120 A motor limit on the hill\" (only true at very low speed or a very steep hill)", "judging the limit by feel instead of by which logged signal is pinned at its ceiling"], "solution": "<p>Hill: road load at 25 km/h on 20 % needs ~67 A of iq, which costs 1.5·vq·iq ≈ 2.1 kW: the battery wall. The voltage is only at 22.5 V of 28.5 V and iq is far from 120 A. In the log: Ibat flat at 40 A, duty below 0.95. Flat: only ~18 A of iq and ~15 A from the battery, but duty pinned at 0.95: voltage. The rule: the limit is the signal that sits flat at its ceiling.<\/p>", "prompt_text": "You ride up a long 20 % hill with full throttle. Which limit holds you, at what speed, roughly, and how would you prove it from a VESC log? Then the same question on the flat at top speed."}, "l1": {"kind": "lab", "prompt": "<p>Start at low speed with the operating point at (0, 120 A). Predict the speed at which the ellipse starts to cut that point off, then raise the speed slider until it does. What do you read, and does it match idea 3?<\/p>", "key": ["the prediction: about 4000 rpm with Rs, 4400 rpm without", "above that speed the point (0, 120 A) falls outside the ellipse: full torque is no longer possible with id = 0", "the maximum torque then falls along the top edge of the ellipse", "reading within a few % of the hand calculation (the lab's model choices, e.g. R included or not, explain the rest)"], "traps": [], "solution": "<p>The ellipse passes through (0, 120 A) at about 4000 rpm with Rs (4400 without). Above it the top of the circle is outside the ellipse, so with id = 0 the most you can get is where the ellipse crosses the iq axis, which falls with speed. That is the corner speed of idea 3.<\/p>", "prompt_text": "Start at low speed with the operating point at (0, 120 A). Predict the speed at which the ellipse starts to cut that point off, then raise the speed slider until it does. What do you read, and does it match idea 3?"}, "l2": {"kind": "lab", "prompt": "<p>Keep raising the speed. At what speed does the ellipse no longer contain the origin (0, 0)? What does that mean physically, and where is the ellipse's centre when it happens?<\/p>", "key": ["around 5670 rpm with 30 V: back-EMF alone equals Vmax", "above it, even zero current needs more voltage than the inverter has: the no-load speed", "the centre stays at id = −λm/Ld ≈ −170 A, outside the 120 A circle", "so with id = 0 nothing is possible above it; only negative id (field weakening) keeps points inside"], "traps": [], "solution": "<p>About 5670 rpm (39.6 km/h): the back-EMF alone fills the 30 V circle, so the motor cannot even hold zero current there. The ellipse keeps shrinking around its centre at id = −170 A, outside the current circle, so only points with negative id survive above that speed: field weakening, which your VESC has off.<\/p>", "prompt_text": "Keep raising the speed. At what speed does the ellipse no longer contain the origin (0, 0)? What does that mean physically, and where is the ellipse's centre when it happens?"}, "c1": {"kind": "case", "prompt": "<p>On the same flat road, your top speed is clearly lower when the VESC reads 44 V than when it reads 54 V. Explain it with the id–iq plane and give both top speeds. Is it the battery current limit? What else changes near 44 V?<\/p>", "key": ["Vmax = 0.95·Vbus/√3: 29.6 V at 54 V, 24.1 V at 44 V (−19 %)", "the ellipse size is Vmax/ωe, so at 44 V it shrinks onto the low road-load point at a lower speed: ~38 km/h at 54 V vs ~31 km/h at 44 V (≈ 5450 vs 4450 rpm)", "not the battery limit: at top speed Ibat is only ~12–15 A", "near 44 V the VESC's low-voltage fold-back begins (44.2 → 39 V), which cuts current and hurts acceleration; and the pack sags 0.18 Ω × Ibat under load, so the VESC sees less than the resting voltage"], "traps": ["\"less power available, so less speed\": the battery is far from 40 A at top speed; it is voltage", "forgetting the duty cap or the √3 and comparing back-EMF with 44 V directly"], "solution": "<p>Top speed on the flat is the voltage wall. The ellipse is Vmax/ωe in size, and Vmax = 0.95·Vbus/√3 drops from 29.6 V to 24.1 V. The road needs only ~15–19 A of iq, so the dot sits low on the iq axis, and the smaller ellipse reaches it sooner: about 38 km/h (5450 rpm) at 54 V, about 31 km/h (4450 rpm) at 44 V. Top speed scales almost with bus voltage. The battery gives only 12–15 A there, so its 40 A limit has nothing to do with it. Near 44 V two more things: the VESC's fold-back starts at 44.2 V and scales current down (felt in acceleration), and the pack's 0.18 Ω drops ~2.7 V at 15 A, so the bus the VESC uses is lower than what you read at rest. These top speeds lean on Crr, CdA and r_roll, all still assumed.<\/p>", "prompt_text": "On the same flat road, your top speed is clearly lower when the VESC reads 44 V than when it reads 54 V. Explain it with the id–iq plane and give both top speeds. Is it the battery current limit? What else changes near 44 V?"}, "c2": {"kind": "error", "prompt": "<p>A forum post says: \"Your BMS is 40 A and your motor limit is 120 A. 120/√3 = 69 A from the battery, so you trip the BMS at every launch. Set motor current to 69 A.\" Where is he wrong, and what would that change cost you?<\/p>", "key": ["phase and battery current are not linked by √3 (or 3): they are linked by power, Vbat·Ibat ≈ 1.5·(vd·id + vq·iq)", "at launch the motor voltage is a few volts: 120 A in the phases costs ~21 A from the battery (idea 1)", "the battery hits 40 A only from about 11 km/h, and the VESC's own 40 A input limit handles it by reducing iq", "cutting motor current to 69 A would throw away ~43 % of launch torque (9.1 → 5.2 N·m) for no battery benefit"], "traps": ["accepting √3 because it appears in line vs phase voltage (a different thing)"], "solution": "<p>√3 relates line and phase voltages of a star winding; it has nothing to do with DC versus AC current. Power links them: at launch the phases need ~6 V, so 120 A is ~1.1 kW, ~21 A from 52 V. The BMS never sees 69 A at launch; the battery reaches 40 A only near 11 km/h, where the VESC's battery limit (also 40 A) trims iq by itself. Setting 69 A would cost 43 % of launch torque and gain nothing.<\/p>", "prompt_text": "A forum post says: \"Your BMS is 40 A and your motor limit is 120 A. 120/√3 = 69 A from the battery, so you trip the BMS at every launch. Set motor current to 69 A.\" Where is he wrong, and what would that change cost you?"}, "z0": {"kind": "explain", "prompt": "<p>Explain it as you would to an interviewer, in at most 5 lines: what limits your quad's torque and speed, and where each limit shows up on the id–iq plane?<\/p>", "key": ["current circle 120 A (heat, MOSFETs): sets launch torque, 9.1 N·m", "battery 40 A is a power limit (~2.1 kW), not a circle: binds from ~11 km/h at full throttle, so the 28 km/h corner is never reached", "voltage ellipse, size Vmax/ωe with Vmax = 0.95·Vbus/√3: sets top speed (~37 km/h on the flat), scales with bus voltage", "id = 0 because saliency is tiny (MTPA +0.5 %); field weakening would push the ellipse but costs current and magnet risk, and is off"], "traps": [], "solution": "<p>Three walls. The 120 A current circle (heat) gives 9.1 N·m at launch. The 40 A battery limit is a power wall, about 2.1 kW: from about 11 km/h it pulls iq down, so the motor never reaches its 28 km/h corner at full current. The voltage ellipse, Vmax/ωe with Vmax = 0.95·Vbus/√3, sets top speed: about 37 km/h on the flat, lower with a flat battery. I run id = 0 because my saliency gives MTPA only +0.5 %, and field weakening is off: it would buy speed with current, heat and magnet risk.<\/p>", "prompt_text": "Explain it as you would to an interviewer, in at most 5 lines: what limits your quad's torque and speed, and where each limit shows up on the id–iq plane?"}, "z1": {"kind": "doubt", "prompt": "<p>What is still unclear? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors.<\/p>", "key": [], "traps": [], "solution": "", "prompt_text": "What is still unclear? Write it as it is. Claude explains it now, and it goes to the \"what I don't get\" part of the review with your mentors."}}, "hasScene": true}, {"id": "C03-LM", "cycle": "C03", "title": "λm from your CAN logs", "date": "2026-11-10", "slot": "2", "minutes": "55", "lede": "On 7 September you measured λm with a drill and a scope: 16.855 mWb. On 31 October your own logger recorded the VESC while you blipped the throttle. Today you pull λm out of that recording, with no scope and no drill, and you turn the result into the first requirement of your motor model.", "sources": "04_model/params/motor_params.m (λm by scope and by no-load telemetry; duty and |v_dq| definitions, mcpwm_foc.c as quoted there) · 04_model/scripts/can_log_decode.py (VESC status frames, comm_can.c scaling) · 07_experiments/EXP-002 and 06_data/README.md (log_017) · 01_plan/roadmap.md (C03 skill gate)", "html": "\n<section class=\"sec\" id=\"s-predict\"><h2>Predict<\/h2>\n\n<div class=\"qa\" data-q=\"p1\"><\/div>\n\n<div class=\"qa\" data-q=\"p2\"><\/div>\n\n<div class=\"qa\" data-q=\"r1\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-build\"><h2>Build<\/h2>\n<p>Software rule (skill <code>software-con-ia<\/code>): <strong>you write the contract and the acceptance test with a number; the AI writes the code<\/strong>; you read its output and decide if it passes. Physics stays yours: the equation is the one you wrote in Predict.<\/p>\n<article class=\"idea\"><span class=\"n\">1<\/span><div><h3>Find the data and its columns<\/h3>\n<p>The recording is <code>06_data/2026-10-31_can_logger_bench/raw/log_017.csv<\/code>: 137 s, wheels in the air, throttle blips, 0 corrupt frames after the EXP-002 fix. Raw CAN, one line per frame: <code>t_us,id,ext,dlc,d0..d7<\/code>. The decoder <code>04_model/scripts/can_log_decode.py<\/code> already turns it into signals (<code>load()<\/code> returns a table). The frames you need, all from VESC id 15, each arriving about every 21 ms (≈ 48 Hz):<\/p>\n<ul><li>status 1: <code>erpm<\/code> (int32), <code>I_motor<\/code> (int16 / 10, A), <code>duty<\/code> (int16 / 1000)<\/li><li>status 4: <code>I_batt<\/code> (int16 / 10, A)<\/li><li>status 5: <code>V_in<\/code> (int16 / 10, V)<\/li><\/ul>\n<aside class=\"mine\"><span>In your motor<\/span>Look at <code>04_model/results/can_logger_log017.png<\/code> first: it is mostly throttle blips, very few steady holds. That shapes your filter.<\/aside>\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">2<\/span><div><h3>Write the contract (you, five lines)<\/h3>\n<p>In the session, give the AI the header of a new script, <code>04_model/scripts/lambda_from_can.py<\/code>, in your words: inputs, outputs with units, the formula, which samples it keeps and why, and what it does when there are too few. Then ask it to write the code reusing <code>load()<\/code> from <code>can_log_decode.py<\/code>.<\/p>\n<div class=\"qa\" data-q=\"b1\"><\/div>\n\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">3<\/span><div><h3>Write the acceptance test (you choose the number)<\/h3>\n<p>Before you trust the script on real data, it must pass on data where you <strong>know<\/strong> the answer. Ask the AI for a test that builds a synthetic log from your dq equations with λm = 16.855 mWb (some steady segments, some noise, some I = 0 coast samples) and runs the script on it.<\/p>\n<div class=\"qa\" data-q=\"b2\"><\/div>\n\n<\/div><\/article>\n<article class=\"idea\"><span class=\"n\">4<\/span><div><h3>Run it on log_017 and read the output<\/h3>\n<p>Run the test first, then <code>./.venv/Scripts/python.exe 04_model/scripts/lambda_from_can.py 06_data/2026-10-31_can_logger_bench/raw/log_017.csv<\/code>. Read the plot before the numbers: is λm flat across speed?<\/p>\n<\/div><\/article>\n<\/section>\n<section class=\"sec\" id=\"s-check\"><h2>Check<\/h2>\n\n<div class=\"qa\" data-q=\"k1\"><\/div>\n\n<div class=\"qa\" data-q=\"k2\"><\/div>\n\n<div class=\"qa\" data-q=\"k3\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-judgement\"><h2>Judgement<\/h2>\n\n<div class=\"qa\" data-q=\"c1\"><\/div>\n\n<div class=\"qa\" data-q=\"c2\"><\/div>\n\n<\/section>\n<section class=\"sec\" id=\"s-close\"><h2>Close<\/h2>\n\n<div class=\"qa\" data-q=\"z0\"><\/div>\n\n<div class=\"qa\" data-q=\"g1\"><\/div>\n\n<div class=\"qa\" data-q=\"z1\"><\/div>\n\n<\/section>", "questions": {"p1": {"kind": "predict", "prompt": "<p>Your motor runs at a steady speed with a small current, id = 0 (your VESC has MTPA and field weakening off). Write the q-axis voltage equation at steady state, and solve it for λm. Which term do you expect to be small?<\/p>", "key": ["steady state, d/dt = 0: vq = Rs·iq + ωe·λm (with id = 0 the Ld·id term vanishes)", "so λm = (vq − Rs·iq) / ωe, with ωe in electrical rad/s", "Rs·iq is small: 28 mΩ × 10 A = 0.28 V against ~20 V of back-EMF at 12 000 erpm (≈ 1.4 %)", "the d axis still carries vd = −ωe·Lq·iq, which makes |v| slightly bigger than vq"], "traps": ["using mechanical speed (ωm) instead of ωe = p·ωm", "forgetting that the VESC reports erpm, which is already electrical"], "solution": "<p>vq = Rs·iq + ωe·λm, so λm = (vq − Rs·iq)/ωe. The resistive drop is about 1 % of the voltage at cruise, so λm ≈ vq/ωe to first order. Do not forget vd = −ωe·Lq·iq: the arrow the VESC builds is a bit longer than vq.<\/p>", "prompt_text": "Your motor runs at a steady speed with a small current, id = 0 (your VESC has MTPA and field weakening off). Write the q-axis voltage equation at steady state, and solve it for λm. Which term do you expect to be small?"}, "p2": {"kind": "predict", "prompt": "<p>The VESC does not send voltage over CAN. It sends <strong>duty<\/strong> (status 1) and <strong>input voltage<\/strong> (status 5). Guess: in FOC, what voltage does duty = 1.0 correspond to? Vbus? Vbus/2? Vbus/√3? Say why.<\/p>", "key": ["duty = 1 is the largest sine SVPWM can make in its linear range: |v_dq| = Vbus/√3 (30 V at 52 V)", "in the VESC's FOC, duty = √3·|v_dq| / Vbus, so |v_dq| = duty·Vbus/√3", "|v_dq| is amplitude-invariant: the peak of the phase (line-to-neutral) voltage, the same quantity as ωe·λm", "his own data confirms it: 7 Sep, duty 0.9486 × 52.77 V / √3 = 28.90 V against |v_dq| = 28.886 V logged by VESC Tool (0.05 %)"], "traps": ["Vbus/2 (that is sine PWM against the mid-point, 26 V)", "line-to-line (×√3 more), which would give λm 1.73 times too big"], "solution": "<p>Duty in the VESC's FOC is the length of the voltage arrow scaled so that 1.0 is the inscribed circle of the hexagon: |v_dq| = duty·Vbus/√3. You do not have to take the firmware's word for it: on 7 September VESC Tool logged duty 0.9486, Vbus 52.77 V and |v_dq| 28.886 V, and 0.9486 × 52.77/√3 = 28.90 V.<\/p>", "prompt_text": "The VESC does not send voltage over CAN. It sends **duty** (status 1) and **input voltage** (status 5). Guess: in FOC, what voltage does duty = 1.0 correspond to? Vbus? Vbus/2? Vbus/√3? Say why."}, "r1": {"kind": "recall", "prompt": "<p>From your own mistakes list (#13): is what you do today <strong>verification<\/strong> or <strong>validation<\/strong> of the motor model? One line each.<\/p>", "key": ["verification: did I build the model right, against its requirement (e.g. the model's λm equals the measured parameter)", "validation: does the model predict reality for its use, with data different from the data used to set it", "today is a step towards validating λm: the model's λm came from the scope test, the CAN log is independent data from the vehicle in use", "it is not yet validation of the whole model: only one parameter, at near-zero load, wheels in the air"], "traps": ["\"validating is checking that everything works as designed\" (his mistake #13)"], "solution": "<p>Verification asks \"built right?\" against a requirement; validation asks \"right thing?\" against reality, with new data. Today checks the model's λm, set from a scope test, against an independent on-vehicle recording: one step of validation, for one parameter, at light load.<\/p>", "prompt_text": "From your own mistakes list (#13): is what you do today **verification** or **validation** of the motor model? One line each."}, "b1": {"kind": "check", "prompt": "<p>Paste your five-line contract here before you send it to the AI.<\/p>", "key": ["input: path of a can_logger CSV; uses erpm, I_motor, duty, V_in; reuses can_log_decode.load()", "formula: |v| = duty·V_in/√3; vd = −ωe·Lq·I; vq = √(|v|² − vd²); λm = (vq − Rs·I)/ωe with ωe = erpm·2π/60", "sample filter with numbers: current-controlled (I_motor > 0.5 A, not exactly 0), speed high enough for voltage resolution (erpm > 2000), quasi-steady (|d erpm/dt| below a threshold, e.g. 1500–3000 erpm/s)", "outputs: number of samples kept, median and 10–90 % spread of λm in mWb, a least-squares fit of vq against ωe (slop
