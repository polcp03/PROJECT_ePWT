<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 745" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .blk { fill: #f8fafc; stroke: #475569; stroke-width: 1.2; }
    .mcu { fill: #eef2ff; stroke: #1e293b; stroke-width: 2; }
    .vesc { fill: #f1f5f9; stroke: #1e293b; stroke-width: 1.6; }
    .h { font-size: 18px; font-weight: 700; fill: #0f172a; }
    .t { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 11px; fill: #475569; }
    .pin { font-size: 12px; font-family: Consolas, Menlo, monospace; fill: #0f172a; }
    .lbl { font-size: 10.5px; fill: #334155; }
    .w { fill: none; stroke-width: 2.4; }
    .dig { stroke: #2563eb; }
    .ana { stroke: #d97706; }
    .bus { stroke: #7c3aed; }
    .can { stroke: #059669; }
    .pwr { stroke: #dc2626; }
    .gnd { stroke: #1e293b; }
    .brd { stroke: #94a3b8; }
    .plan { stroke-dasharray: 7 5; }
    .dot { fill: #1e293b; }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="745"/>
  <text class="h" x="16" y="34">ePWT VCU — ESP32 pinout · 2026-11-01</text>

  <!-- ESP32 -->
  <text class="t" x="460" y="62" text-anchor="middle">VCU · ESP32-WROOM-32 (logger No. 2)</text>
  <rect class="mcu" x="360" y="70" width="200" height="460" rx="8"/>
  <g class="pin">
    <text x="370" y="114">5V (VIN)</text>
    <text x="370" y="154">GND</text>
    <text x="370" y="194">3V3 out</text>
    <text x="370" y="254">GPIO34</text>
    <text x="370" y="304">GPIO35</text>
    <text x="370" y="354">GPIO32</text>
    <text x="370" y="404">GPIO33</text>
    <text x="370" y="464">GPIO21</text>
    <text x="370" y="504">GPIO22</text>
    <text x="550" y="114" text-anchor="end">GPIO14</text>
    <text x="550" y="149" text-anchor="end">GPIO13</text>
    <text x="550" y="184" text-anchor="end">GPIO27</text>
    <text x="550" y="219" text-anchor="end">GPIO26</text>
    <text x="550" y="289" text-anchor="end">GPIO18</text>
    <text x="550" y="324" text-anchor="end">GPIO19</text>
    <text x="550" y="359" text-anchor="end">GPIO23</text>
    <text x="550" y="394" text-anchor="end">GPIO5</text>
    <text x="550" y="464" text-anchor="end">GPIO0</text>
    <text x="550" y="504" text-anchor="end">GPIO2</text>
  </g>

  <!-- Left: power -->
  <rect class="blk" x="16" y="84" width="200" height="124" rx="6"/>
  <text class="t" x="26" y="104">Power</text>
  <text class="s" x="26" y="122">12 V battery → DC-DC 5.3 V</text>
  <text class="s" x="26" y="138">floats from the 13S pack (DEC-004)</text>
  <text class="s" x="26" y="160">5 V rail: ESP32, MCP2515, SD,</text>
  <text class="s" x="26" y="174">wheel Hall, throttle</text>
  <text class="s" x="26" y="196">3V3 (ESP32): pull-ups and IMU</text>
  <path class="w pwr" d="M216 110 H360"/>
  <path class="w gnd" d="M216 150 H360"/>
  <path class="w pwr" d="M360 190 H216" stroke-dasharray="2 3"/>
  <text class="lbl" x="288" y="104" text-anchor="middle">5.3 V</text>
  <text class="lbl" x="288" y="144" text-anchor="middle">common ground</text>
  <text class="lbl" x="288" y="184" text-anchor="middle">3V3 out</text>

  <!-- Left: wheel -->
  <rect class="blk" x="16" y="228" width="200" height="44" rx="6"/>
  <text class="t" x="26" y="246">Wheel speed · 3144 Hall</text>
  <text class="s" x="26" y="263">front wheel, 10 magnets · 5 V</text>
  <path class="w dig" d="M216 250 H360"/>
  <text class="lbl" x="288" y="244" text-anchor="middle">10 kΩ → 3V3 · interrupt</text>

  <!-- Left: throttle -->
  <rect class="blk" x="16" y="278" width="200" height="44" rx="6"/>
  <text class="t" x="26" y="296">Throttle · 5 V Hall grip</text>
  <text class="s" x="26" y="313">~0.8 V rest → full: measure</text>
  <path class="w ana plan" d="M216 300 H360"/>
  <text class="lbl" x="288" y="294" text-anchor="middle">÷ 10k/12k · 100 nF · ADC1</text>

  <!-- Left: brakes -->
  <rect class="blk" x="16" y="328" width="200" height="44" rx="6"/>
  <text class="t" x="26" y="346">Brake switch · left</text>
  <text class="s" x="26" y="363">on/off contact to GND</text>
  <path class="w dig plan" d="M216 350 H360"/>
  <text class="lbl" x="288" y="344" text-anchor="middle">10 kΩ → 3V3 · 100 nF</text>
  <rect class="blk" x="16" y="378" width="200" height="44" rx="6"/>
  <text class="t" x="26" y="396">Brake switch · right</text>
  <text class="s" x="26" y="413">on/off contact to GND</text>
  <path class="w dig plan" d="M216 400 H360"/>
  <text class="lbl" x="288" y="394" text-anchor="middle">10 kΩ → 3V3 · 100 nF</text>

  <!-- Left: IMU -->
  <rect class="blk" x="16" y="440" width="200" height="80" rx="6"/>
  <text class="t" x="26" y="460">IMU · GY-LSM6DS3</text>
  <text class="s" x="26" y="478">I2C, address 0x6A · 3V3</text>
  <text class="s" x="26" y="494">ax, pitch, yaw rate</text>
  <text class="s" x="26" y="510">waiting for the new one</text>
  <path class="w bus plan" d="M216 460 H360"/>
  <path class="w bus plan" d="M216 500 H360"/>
  <text class="lbl" x="288" y="454" text-anchor="middle">SDA · 10 kΩ → 3V3</text>
  <text class="lbl" x="288" y="494" text-anchor="middle">SCL · 10 kΩ → 3V3</text>

  <!-- Right: MCP2515 -->
  <rect class="blk" x="700" y="88" width="220" height="146" rx="6"/>
  <text class="t" x="710" y="108">CAN · MCP2515 + TJA1050</text>
  <text class="s" x="710" y="128">5 V · HSPI, 4 MHz</text>
  <text class="s" x="710" y="146">SCK · SI · SO · CS</text>
  <text class="s" x="710" y="164">SO is 5 V: 1k/2k divider</text>
  <text class="s" x="710" y="182">J1 = 120 Ω termination</text>
  <text class="s" x="710" y="200">polled, no INT pin</text>
  <path class="w bus" d="M560 110 H700"/>
  <path class="w bus" d="M560 145 H700"/>
  <path class="w bus" d="M560 180 H700"/>
  <path class="w bus" d="M560 215 H700"/>
  <text class="lbl" x="630" y="174" text-anchor="middle">1k / 2k divider</text>

  <!-- Right: SD -->
  <rect class="blk" x="700" y="263" width="220" height="146" rx="6"/>
  <text class="t" x="710" y="283">microSD module</text>
  <text class="s" x="710" y="303">5 V (own 3.3 V regulator)</text>
  <text class="s" x="710" y="321">VSPI · SCK · MISO · MOSI · CS</text>
  <text class="s" x="710" y="339">GPIO5 is a boot strap pin:</text>
  <text class="s" x="710" y="355">fine, CS idles high</text>
  <text class="s" x="710" y="377">card dead — new one on order</text>
  <path class="w bus" d="M560 285 H700"/>
  <path class="w bus" d="M560 320 H700"/>
  <path class="w bus" d="M560 355 H700"/>
  <path class="w bus" d="M560 390 H700"/>

  <!-- Right: on board -->
  <rect class="blk" x="700" y="440" width="220" height="80" rx="6"/>
  <text class="t" x="710" y="460">On the ESP32 board</text>
  <text class="s" x="710" y="480">BOOT button: start / stop log</text>
  <text class="s" x="710" y="498">blue LED: idle / rec / error</text>
  <text class="s" x="710" y="514">both boot strap pins: keep</text>
  <path class="w brd" d="M560 460 H700"/>
  <path class="w brd" d="M560 500 H700"/>

  <!-- CAN to VESC -->
  <path class="w can" d="M920 160 H944 V600"/>
  <text class="lbl" x="936" y="560" text-anchor="end">CAN H · L · GND</text>
  <text class="lbl" x="936" y="575" text-anchor="end">500 kbit/s</text>

  <!-- VESC -->
  <rect class="vesc" x="590" y="600" width="354" height="128" rx="6"/>
  <text class="t" x="602" y="620">VESC · Flipsky 6.7 Mini Pro · CAN ID 15</text>
  <text class="s" x="602" y="640">Rotor Halls → stay on the VESC (commutation)</text>
  <text class="s" x="602" y="657">Motor NTC 10 k → TEMP pin of the Hall plug (new)</text>
  <text class="s" x="602" y="674">ADC throttle input → disconnected</text>
  <text class="s" x="602" y="691">CAN timeout: no VCU frames → zero torque</text>
  <text class="s" x="602" y="708">BMS: passive backup, not wired to anything</text>

  <!-- Legend -->
  <rect class="blk" x="16" y="600" width="556" height="128" rx="6"/>
  <text class="t" x="28" y="620">Legend</text>
  <path class="w dig" d="M28 640 H64"/><text class="s" x="72" y="644">digital input</text>
  <path class="w ana" d="M28 660 H64"/><text class="s" x="72" y="664">analog input (ADC1)</text>
  <path class="w bus" d="M28 680 H64"/><text class="s" x="72" y="684">bus: SPI / I2C</text>
  <path class="w can" d="M28 700 H64"/><text class="s" x="72" y="704">CAN</text>
  <path class="w pwr" d="M200 640 H236"/><text class="s" x="244" y="644">power</text>
  <path class="w dig" d="M200 660 H236"/><text class="s" x="244" y="664">solid = wired today</text>
  <path class="w dig plan" d="M200 680 H236"/><text class="s" x="244" y="684">dashed = planned</text>
  <text class="s" x="362" y="644">Never use: GPIO 6–11 (flash),</text>
  <text class="s" x="362" y="660">1 / 3 (USB serial), 12 (boot strap)</text>
  <text class="s" x="362" y="680">ADC2 pins read nothing with Wi-Fi on</text>
  <text class="s" x="362" y="700">Free: 36, 39 (analog in) · 4, 16, 17, 25</text>
</svg>
